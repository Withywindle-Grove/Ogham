<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- An invented harbour drawn by hand for the gallery and the layout page (dec-7 piece 5a). It stands in for a
       pack's map: never a book's picture. Its colours are its own, as a printed map's would be. -->
  <rect width="1200" height="800" fill="#d9d2bf"/>
  <path d="M0 260 C140 230 260 300 380 280 C520 255 600 330 720 360 C840 390 900 470 960 560 L960 800 L0 800 Z" fill="#8e9c9c"/>
  <path d="M0 520 C120 500 240 560 330 640 C380 690 400 760 420 800 L0 800 Z" fill="#7d8b8c"/>
  <path d="M960 0 L960 800" stroke="#2b2620" stroke-width="2"/>
  <rect x="960" y="0" width="240" height="800" fill="#f1ede2"/>
  <path d="M0 260 C140 230 260 300 380 280 C520 255 600 330 720 360 C840 390 900 470 960 560" fill="none" stroke="#2b2620" stroke-width="3"/>
  <!-- The jetty, the breakwater, the wreck -->
  <path d="M300 120 L300 300 L330 300 L330 120 Z" fill="#5b4a37" stroke="#2b2620" stroke-width="2"/>
  <path d="M560 470 C640 440 720 450 800 500" fill="none" stroke="#c9bfa6" stroke-width="22" stroke-linecap="round"/>
  <path d="M560 470 C640 440 720 450 800 500" fill="none" stroke="#2b2620" stroke-width="2" stroke-dasharray="14 10"/>
  <path d="M430 610 l60 -30 l40 20 l-70 40 Z" fill="#6b5640" stroke="#2b2620" stroke-width="2"/>
  <!-- Houses on the shore -->
  <g fill="#a69b85" stroke="#2b2620" stroke-width="1.5">
    <rect x="80" y="80" width="40" height="30"/><rect x="140" y="60" width="36" height="34"/><rect x="200" y="96" width="44" height="28"/>
    <rect x="380" y="70" width="38" height="32"/><rect x="440" y="110" width="42" height="30"/><rect x="520" y="60" width="36" height="36"/>
    <rect x="600" y="120" width="40" height="30"/><rect x="680" y="70" width="44" height="34"/><rect x="760" y="140" width="38" height="30"/>
    <rect x="840" y="80" width="40" height="36"/><rect x="100" y="160" width="42" height="30"/><rect x="420" y="190" width="36" height="28"/>
    <rect x="560" y="200" width="44" height="32"/><rect x="820" y="230" width="40" height="30"/><rect x="700" y="230" width="36" height="34"/>
  </g>
  <!-- Ways between the spots -->
  <g fill="none" stroke="#f6f2e8" stroke-width="3" stroke-dasharray="10 8">
    <path d="M315 300 C380 380 420 460 470 600"/>
    <path d="M315 300 C440 340 560 380 640 450"/>
    <path d="M640 450 C700 520 760 600 820 660"/>
  </g>
  <!-- The key's numbers on the picture -->
  <g font-family="Georgia, serif" font-size="26" font-weight="700" text-anchor="middle" fill="#2b2620">
    <circle cx="315" cy="300" r="22" fill="#f6f2e8" stroke="#2b2620" stroke-width="3"/><text x="315" y="309">1</text>
    <circle cx="470" cy="600" r="22" fill="#f6f2e8" stroke="#2b2620" stroke-width="3"/><text x="470" y="609">2</text>
    <circle cx="640" cy="450" r="22" fill="#f6f2e8" stroke="#2b2620" stroke-width="3"/><text x="640" y="459">3</text>
    <circle cx="820" cy="660" r="22" fill="#f6f2e8" stroke="#2b2620" stroke-width="3"/><text x="820" y="669">4</text>
    <circle cx="160" cy="130" r="22" fill="#f6f2e8" stroke="#2b2620" stroke-width="3"/><text x="160" y="139">5</text>
  </g>
  <!-- The key -->
  <g font-family="Georgia, serif" fill="#2b2620">
    <text x="985" y="60" font-size="34" font-weight="700">Key</text>
    <text x="985" y="120" font-size="22">1 The jetty</text>
    <text x="985" y="160" font-size="22">2 The wreck</text>
    <text x="985" y="200" font-size="22">3 The breakwater</text>
    <text x="985" y="240" font-size="22">4 The sea cave</text>
    <text x="985" y="280" font-size="22">5 The net lofts</text>
  </g>
  <text x="20" y="780" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#2b2620">An invented harbour: a stand-in picture</text>
</svg>
