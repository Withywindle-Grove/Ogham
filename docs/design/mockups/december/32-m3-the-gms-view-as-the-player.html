<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>December: page 32, M3, the GM's view as the player (2026-11-21)</title>
<link rel="stylesheet" href="../creation/final/final.css">
<link rel="stylesheet" href="../scene/scene.css">
<link rel="stylesheet" href="../scene/scene-seq.css">
<link rel="stylesheet" href="december.css">
<link rel="stylesheet" href="../shared/book.css">
<style>
  /* this page's own rules: layout and this page's own parts only (the view's band, the row, the Player tab's boxes as
     drawn here). Type, the book format, the stacked button, the pop-up, the toast and the corners come from
     ../shared/book.css and are not restated. */
  .lbl { font-size:14px; color:var(--muted); margin:var(--space-3) 0 var(--space-2); }
  .lbl:first-child { margin-top:0; }
  /* the view's top row: the back link, the title centred, the icons */
  .vtop { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:var(--space-2); min-height:52px; padding:0 var(--space-2) 0 var(--space-4); border-bottom:1px solid var(--rule); }
  .vtop .back { color:var(--accent); text-decoration:underline; min-height:44px; display:flex; align-items:center; }
  .vtop .vtt { font-weight:700; font-size:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:520px; text-align:center; }
  .vtop .vtt small { display:block; font-size:14px; font-weight:400; color:var(--muted); }
  .vtop .rt { display:flex; justify-content:flex-end; }
  /* the view's band (proposal V-A): whose view, on every tab */
  .vband { display:grid; grid-template-columns:28px minmax(0,1fr); gap:var(--space-1) var(--space-3); align-items:center; border:1.5px solid var(--control); border-left:4px solid var(--info); border-radius:4px; background:var(--surface); padding:var(--space-2) var(--space-3); margin:0 0 var(--space-4); }
  .vband > span:first-child { display:flex; color:var(--info); }
  .vband b { overflow-wrap:break-word; }
  .vband small { display:block; font-size:14px; color:var(--muted); }
  .phone .vband { margin:var(--space-2) var(--space-3) var(--space-3); }
  /* the Players page's row (page 13's, with this page's variants) */
  .grow { display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:var(--space-2) var(--space-3); align-items:center; min-height:60px; border-bottom:1px dotted var(--rule); padding:var(--space-2) 0; }
  .grow small { display:block; font-size:14px; color:var(--muted); line-height:1.25; }
  .grow .ga { display:flex; gap:var(--space-2); flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .grow .nm { overflow-wrap:break-word; min-width:0; }
  .phone .grow { grid-template-columns:44px minmax(0,1fr) auto; }
  .phone .grow .ga { grid-column:1 / -1; justify-content:flex-start; }
  .grow .edit { grid-row:1; grid-column:3; }
  .phone .grow .edit { grid-column:3; }
  .av { width:44px; height:44px; border-radius:50%; border:1.5px solid var(--control); display:flex; align-items:center; justify-content:center; font-weight:700; background:var(--surface); }
  .menu { border:1px solid var(--rule); border-radius:8px; background:var(--popup); box-shadow:0 4px 16px rgb(0 0 0 / 25%); min-width:260px; padding:var(--space-1) 0; }
  .menu .mi { display:flex; align-items:center; gap:var(--space-3); min-height:48px; padding:0 var(--space-4); }
  .menu .mi svg { color:var(--muted); flex:none; }
  .menu .mh { font-size:14px; color:var(--muted); padding:var(--space-2) var(--space-4) 0; }
  /* the Player tab, drawn to page 28's approved layout */
  .pt { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--space-4); align-items:start; }
  .pt > div { min-width:0; }
  .phone .phead { gap:var(--space-2); }
  .phead { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
  .port { width:96px; height:96px; border-radius:50%; border:1.5px solid var(--control); overflow:hidden; flex:none; }
  .port svg { width:100%; height:100%; display:block; }
  .rg { box-sizing:border-box; width:44px; height:44px; border-radius:50%; border:2px dotted var(--control); display:inline-flex; align-items:center; justify-content:center; color:var(--muted); }
  .box2 { border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); padding:var(--space-2) var(--space-3); margin-top:var(--space-2); box-sizing:border-box; }
  .box2.heavy { border:2px solid var(--ink); }
  .hpn { display:flex; align-items:center; gap:var(--space-2); }
  .hpn .big { font-size:48px; font-weight:700; line-height:1; }
  .hpn .gap { flex:1; }
  .tiles { display:grid; gap:var(--space-2); margin-top:var(--space-2); }
  .tiles.t2 { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .tiles.t3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
  .tiles.t5 { grid-template-columns:repeat(5, minmax(0,1fr)); }
  .tile { border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); text-align:center; padding:var(--space-1); min-height:56px; display:flex; flex-direction:column; justify-content:center; }
  .tile .k { font-size:14px; color:var(--muted); }
  .tile .v { font-size:20px; font-weight:700; line-height:1.2; }
  .tile .s { font-size:14px; color:var(--muted); }
  .wrow { display:flex; align-items:flex-end; justify-content:space-between; gap:var(--space-2); flex-wrap:wrap; }
  .wrow .nmw { font-size:20px; font-weight:700; }
  .rolls { display:flex; gap:var(--space-3); align-items:center; flex-wrap:wrap; margin-top:var(--space-1); }
  .rolls b { font-size:20px; }
  .rolls small { font-size:14px; color:var(--muted); }
  .gmmark { display:flex; gap:var(--space-2); align-items:center; font-size:14px; color:var(--info); margin-top:var(--space-1); }
  .notbox { display:inline-flex; align-items:center; gap:var(--space-3); min-height:56px; padding:0 var(--space-4); border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); }
  .notbox.lit { border:2px solid var(--ink); font-weight:700; }
  .notbox.lit .ni { background:color-mix(in srgb, var(--glow) 35%, transparent); border-radius:50%; }
  .notbox .ni { display:flex; padding:var(--space-1); }
  .footrow { display:grid; grid-template-columns:minmax(0,1fr) 20px; align-items:center; min-height:56px; border-bottom:1px dotted var(--rule); }
  .footrow b { font-size:20px; }
  .footrow small { display:block; font-size:14px; color:var(--muted); }
  /* the Pack, drawn to the approved Pack (players/01) in the December dress */
  .grp { display:flex; justify-content:space-between; align-items:baseline; margin:var(--space-4) 0 var(--space-1); }
  .grp:first-child { margin-top:0; }
  .grp span:last-child { font-size:14px; color:var(--muted); }
  .irow { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--space-2); align-items:center; min-height:56px; border-bottom:1px dotted var(--rule); padding:var(--space-1) 0; }
  .irow small { display:block; font-size:14px; color:var(--muted); }
  .irow.open { background:var(--wash); box-shadow:inset 3px 0 0 var(--accent); padding-left:var(--space-2); }
  .newtag { display:inline-flex; align-items:center; border:1.5px solid var(--ink); border-radius:4px; padding:0 var(--space-1); font-size:14px; font-weight:700; margin-left:var(--space-2); }
  .pfoot2 { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); margin-top:var(--space-3); border-top:1px solid var(--rule); padding-top:var(--space-2); }
  .lrow { display:grid; grid-template-columns:24px minmax(0,1fr) 20px; gap:var(--space-3); align-items:center; min-height:48px; border-bottom:1px dotted var(--rule); }
  .lrow svg { color:var(--muted); }
  .kv2 { display:flex; justify-content:space-between; gap:var(--space-2); min-height:32px; align-items:center; border-bottom:1px dotted var(--rule); }
  .three32 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:var(--space-4); align-items:start; }
  .two32 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--space-4); align-items:start; }
  .sw2v { display:inline-flex; border:1.5px solid var(--control); border-radius:27px; padding:2px; gap:2px; }
  .sw2v > span { min-height:44px; display:flex; align-items:center; padding:0 var(--space-4); border-radius:23px; }
  .sw2v > span.on { background:var(--wash); box-shadow:inset 0 0 0 2px var(--accent); font-weight:700; }
  /* the dimmed page and the centred pop-up over it */
  .over32 { position:relative; }
  .over32 .veil { position:absolute; inset:0; background:rgba(0,0,0,.35); }
  .over32 .popb { position:absolute; left:50%; top:120px; transform:translateX(-50%); width:440px; }
  .popb .ft { display:flex; justify-content:flex-end; }
  .grid9 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:var(--space-4); align-items:start; }
  .grid9 .popb { max-width:none; }
  .sk32 { display:block; height:16px; border-radius:4px; background:var(--rule); margin:var(--space-2) 0; }
  .pill32 { display:inline-flex; align-items:center; gap:var(--space-1); border:1.5px solid var(--warn); color:var(--warn); border-radius:4px; padding:0 var(--space-2); min-height:28px; font-size:14px; font-weight:700; }
  .phone .tabbar.five { grid-template-columns:repeat(5,1fr); }
  .tabbar span { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .ptb { padding:var(--space-3); }
  .pr18 { display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:var(--space-3); align-items:center; min-height:56px; border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); padding:var(--space-1) var(--space-3); box-sizing:border-box; }
  .pr18 > span:first-child { display:flex; color:var(--muted); }
  .slot18 { display:grid; gap:var(--space-2); margin:var(--space-3) 0; }
  .rem { justify-content:center; } .rem .gap { display:none; }
  .dcap { display:inline-flex; align-items:center; gap:var(--space-1); font-size:16px; margin-right:var(--space-2); vertical-align:bottom; }
  .dcap svg { color:var(--muted); flex:none; }
  .pdest .modes .btn.stk { width:auto; }
  .opt + .spot { margin-top:var(--space-2); }
  .callout .popb { font-size:16px; margin-top:var(--space-2); }
  .callout { border:1.5px dashed var(--info); border-radius:4px; padding:var(--space-2) var(--space-3); font-size:14px; color:var(--ink); background:var(--sheet); }
</style>
</head>
<body>
<script src="../creation/final/final.js"></script>
<script src="../scene/scene.js"></script>
<script src="../scene/scene-seq.js"></script>
<script src="december.js"></script>
<script src="icons/icons.js"></script>
<script src="strip.js"></script>
<script src="../shared/book.js"></script>
<script>
// Invented names and numbers only. Sam plays Wren (a caster); Robin plays Tam (no magic); Ash is the GM's own.
const LONGC = 'Ashwin Thistlewood of the Long Stair, called the Lantern-Bearer';
const LONGP = 'Bartholomew Featherstone-Quillfeather the Younger';
const go = svg(SY.right, 20);
const sep16 = svg(SY.right, 16);
const stk = (words, k, o = {}) => `<span class="btn stk${o.accent ? ' accent' : ''}" role="button"${o.label ? ` aria-label="${o.label}"` : ''}>${gi(k, 24)}<span>${words}</span></span>`;
const more = (label) => `<span class="btn sq" role="button" aria-label="${label}">${I.more}</span>`;
const pop = (title, body, o = {}) => `<div class="popb" role="dialog" aria-label="${title}"><div class="hd"><span class="sheet-title">${title}</span><span class="btn sq" role="button" aria-label="Close" style="border:0;background:transparent">${I.close}</span></div>${body}${o.bare ? '' : `<div class="ft">${b('Got it')}</div>`}</div>`;

// ---- the GM's Players page ----
const plHead = `<div class="hrow"><h2>Players and characters</h2>${b('Invite a player', { accent: true })}</div><div class="sect">Players</div>`;
const editB = (name) => `<span class="edit">${stk('Edit', 'quill-ink', { label: `Edit ${name}` })}</span>`;
/* how: 'A' all in the row; 'B' four views in the row, Give and Remove in ⋯ (the lean); 'C' View sheet alone, the rest in ⋯ */
const doors = (name, magic, how) => {
  const v = [small('View sheet'), small('Pack'), magic ? small('Magic') : '', small('Scene')].join('');
  if (how === 'A') return `${v}${small('Give to a player…')}${small('Remove…')}`;
  if (how === 'C') return `${small('View sheet')}${more(`More for ${name}`)}`;
  return `${v}${more(`More for ${name}`)}`;
};
const chRow = (name, sum, meta, o = {}) => `<div class="grow"><span class="av" aria-hidden="true">${name.charAt(0)}</span><span class="nm"><b>${name}</b>${sum ? `<span class="meta">, ${sum}</span>` : ''}<small>${meta}</small></span>${o.bare ? `<span class="ga">${o.bare}</span>` : `${o.how === 'C' ? '' : editB(name)}<span class="ga"${o.how === 'C' ? '' : ' style="grid-column:2 / -1"'}>${doors(name, o.magic, o.how || 'B')}</span>`}</div>`;
const noChar = (meta) => `<div class="grow"><span class="av" aria-hidden="true"></span><span><b>No character yet</b><small>${meta}</small></span><span></span></div>`;
const menuB = (name) => `<div class="menu" role="menu" aria-label="More for ${name}"><div class="mi" role="menuitem">${gi('open-palm', 24)}Give to a player…</div><div class="mi" role="menuitem">${gi('cancel', 24)}Remove…</div></div>`;
const menuC = (name, magic) => `<div class="menu" role="menu" aria-label="More for ${name}"><div class="mi" role="menuitem">${gi('knapsack', 24)}Pack</div>${magic ? `<div class="mi" role="menuitem">${gi('moon', 24)}Magic</div>` : ''}<div class="mi" role="menuitem">${gi('campfire', 24)}Scene</div><div class="mi" role="menuitem">${gi('quill-ink', 24)}Edit</div><div class="mi" role="menuitem">${gi('open-palm', 24)}Give to a player…</div><div class="mi" role="menuitem">${gi('cancel', 24)}Remove…</div></div>`;
const onPlayers = (h) => h.replace('class="ri on" role="button" aria-label="Scene"', 'class="ri" role="button" aria-label="Scene"').replace('class="ri" role="button" aria-label="Players"', 'class="ri on" role="button" aria-label="Players"');
const listB = `${chRow('Wren', 'level 3', 'Sam, joined 12 Oct', { magic: true })}${chRow('Tam', 'level 1', 'Robin, joined 14 Oct')}${noChar('Kit, joined 2 Nov')}${chRow('Ash', 'level 1', 'Yours', { magic: true })}${chRow('Fen', 'level 1', 'Archived', { bare: `${small('View sheet')}${small('Remove…')}` })}`;

const m3a = onPlayers(ipad('gm', `<div class="cols2" style="grid-template-columns:minmax(0,1fr) 280px"><div>${plHead}${listB}</div><div><p class="lbl"><b>Wren’s ⋯ open</b> (the lean, B).</p>${menuB('Wren')}</div></div>
  <div class="sect" style="margin-top:var(--space-5)">Not picked, for comparison: the same row two other ways</div>
  <p class="lbl"><b>(A) Everything in the row:</b> seven controls; on a tablet the row’s buttons take a second line.</p>${chRow('Wren', 'level 3', 'Sam, joined 12 Oct', { magic: true, how: 'A' })}
  <p class="lbl"><b>(C) View sheet alone in the row,</b> the rest behind ⋯ (Pack, Magic, Scene, Edit, Give to a player…, Remove…).</p><div class="cols2" style="grid-template-columns:minmax(0,1fr) 280px;margin-top:0"><div>${chRow('Wren', 'level 3', 'Sam, joined 12 Oct', { magic: true, how: 'C' })}</div><div>${menuC('Wren', true)}</div></div>`,
  'M3a. <b>New, a proposal: the Players page’s row</b> (tfg-4, ⚑ 7 of the ruling). <b>The lean, (B):</b> the four doors into the player’s view are small plain buttons in the row, in the order of his words (View sheet, Pack, Magic, Scene; ⚑ the order); <b>Edit is the stacked quill at the row’s top right</b>, as the player’s sits on “Your characters” (tfr-4); <b>“Give to a player…” and “Remove…” move into the row’s ⋯</b>: both are rare, and Remove… is the one that costs. <b>Magic only where the character has a Magic tab</b> (tfg-2): Tam has none. <b>The GM’s own character</b> (Ash, “Yours”) has the same row. <b>An archived character</b> (Fen) keeps today’s row: View sheet opens the full sheet, as today. A character waiting for approval is not a row here: it sits in “Waiting for you”, as today, and its View sheet opens the full sheet (d5-22). The page’s one accent stays “Invite a player”.'));

// the phone, 375 px (drawn 343 inside, as every phone in this folder)
const phPlayers = (how, cap, open) => phone(`${phoneBar('The Reed Marches')}<div class="inner"><div class="sect" style="margin-top:0">Players</div>${chRow('Wren', 'level 3', 'Sam, joined 12 Oct', { magic: true, how })}${chRow(LONGC, 'level 12', `${LONGP}, joined 12 Oct`, { magic: true, how })}${chRow('Tam', 'level 1', 'Robin, joined 14 Oct', { how })}${open || ''}</div>${tabBar('gm').replace('<span class="on">Scene</span>', '<span>Scene</span>').replace('<span>Players</span>', '<span class="on">Players</span>')}`, cap);
const m3b = `<div><p class="cap" style="width:1080px">M3b. <b>New, a proposal: the row at 375 px with a long name, three ways</b> (⚑ 7). The name and the player’s name wrap; the buttons wrap under them. <b>(A)</b> six small buttons on three lines and Edit: the row is as tall as the screen’s first third. <b>(B), the lean:</b> four doors on two lines, Edit at the top right, ⋯ last. <b>(C)</b> one line, but Pack, Magic and Scene are two taps. Every button 44 px high, 8 px apart.</p><div class="wall">${phPlayers('A', '(A) Everything in the row.')}${phPlayers('B', '(B) The lean: four doors, Edit, ⋯.', `<p class="lbl"><b>Its ⋯</b>, open:</p>${menuB(LONGC)}`)}${phPlayers('C', '(C) View sheet and ⋯.')}</div></div>`;

// ---- the view: its frame on a tablet ----
const railV = (on, magic = true) => `<div class="rail">${[['crown', 'Player'], ['fire', 'Scene'], ['sack', 'Pack'], ...(magic ? [['moon', 'Magic']] : [])].map(([k, l]) => `<span class="ri${l === on ? ' on' : ''}" role="button" aria-label="${l}">${k === 'moon' ? gi('moon', 24) : sym(k, 24)}</span>`).join('')}</div>`;
const topV = (title = '') => `<div class="vtop"><span class="back" role="link">‹ Players</span><span class="vtt">${title}</span><span class="rt">${ico('note', 'Log')}${ico('mail', 'Messages')}${ico('book', 'Reference')}<span class="ico" role="button" aria-label="More">${I.more}</span></span></div>`;
const vband = (p = 'Sam', c = 'Wren') => `<div class="vband" role="note"><span>${sym('eye', 24)}</span><span><b>${p}’s view of ${c}</b><small>What you do here is logged as yours.</small></span></div>`;
const vdev = (tab, inner, cap, o = {}) => `<div><p class="cap" style="width:1024px">${cap}</p><div class="dev ipad${o.cls ? ' ' + o.cls : ''}">${railV(tab, o.magic !== false)}<div class="main">${o.top || topV(o.title === undefined ? 'Wren' : o.title)}<div class="page">${o.noBand ? '' : vband(o.p, o.c)}${inner}</div></div>${o.extra || ''}</div></div>`;

// ---- the Player tab, as page 28 draws it (approved 2026-11-20), shortened to the parts M3 needs ----
const ring = (k, label) => `<span class="rg" role="img" aria-label="${label}">${sym(k, 20)}</span>`;
const headP = `<div class="phead"><span class="port">${pic(1)}</span>${ring('stone', 'No status')}${ring('drop', 'Not bleeding')}${ring('flame', 'Light: none carried')}${ring('star', 'No blessing')}</div>`;
const hpBox = (now = 11, most = 16) => `<div class="box2"><div class="sclab" style="margin-top:0">Hit points</div><div class="hpn"><span class="big">${now}</span><span class="meta">of ${most}</span><span class="gap"></span><span class="btn sq" role="button" aria-label="Lose 1">${I.minus}</span><span class="btn sq" role="button" aria-label="Gain 1">${I.plus}</span></div></div>`;
const acAtk = `<div class="tiles t2"><div class="tile"><span class="k">Armour class</span><span class="v">15</span><span class="s">Mail, shield</span></div><div class="tile"><span class="k">Attack</span><span class="v">+1</span><span class="s">Melee +2, Missile +1</span></div></div>`;
const weapon = (o = {}) => `<div class="box2 heavy"><div class="wrow"><span><span class="nmw">${o.name || 'Longsword'}</span><small class="meta" style="display:block">In hand, Grip: one hand</small></span><span class="stkgroup" data-stkgroup>${stk('Grip', 'fist')}${stk('Attack', 'sword-brandish')}</span></div><div class="rolls">${dieMark(20, 20)}<b>d20 ${o.hit || '+2'}</b><small>to hit</small>${dieMark(8, 20)}<b>d8 ${o.dmg || '+1'}</b><small>damage</small></div>${o.mark || ''}</div>`;
const atHand = `<div class="sclab">At hand</div><div class="irow"><span><b>★ Shortbow</b><small>Quiver: Arrows ×18</small></span><span class="stkgroup" data-stkgroup>${stk('Quiver', 'quiver')}${stk('Wield', 'sword-hilt')}</span></div>`;
const level = `<p style="margin:var(--space-3) 0 0"><b>Reed witch, level 3</b> <span class="meta">2,400 of 4,000 experience</span></p>`;
const notBox = (n) => `<span class="notbox${n ? ' lit' : ''}" role="button" aria-label="${n ? n : 'No notices'}"><span class="ni">${gi('trumpet', 24)}</span>${n || 'No notices'}</span>`;
const scores = `<div class="sclab">Scores</div><div class="tiles t3">${[['Might', 14, '+1'], ['Grace', 10, '+0'], ['Grit', 13, '+1'], ['Wit', 9, '+0'], ['Sense', 11, '+0'], ['Voice', 12, '+0']].map(([k, v, m]) => `<div class="tile" role="button"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${m}</span></div>`).join('')}</div>`;
const saves = `<div class="sclab">Saves</div><div class="tiles t5">${[['Body', 12], ['Nerve', 13], ['Wits', 14], ['Luck', 15], ['Ward', 16]].map(([k, v]) => `<div class="tile" role="button"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;

  ${phone(`<div style="position:relative;min-height:560px">${vbarPh('Wren')}${vband()}${phHp}${sheetPh}</div>`, 'A blocked action, as a sheet.')}

const miniC = (label, html) => `<div><p class="lbl"><b>${label}</b></p><div class="pcard">${html}</div></div>`;

  ${miniC('Couldn’t load.', `${vband()}<p style="margin:0 0 var(--space-2)">${warn('Couldn’t load Wren’s sheet.')}</p>${b('Try again')}<p class="meta" style="margin:var(--space-2) 0 0">“‹ Players” still goes back.</p>`)}
  ${miniC('Offline.', `<p style="margin:0 0 var(--space-2)"><span class="pill32">${I.warn}Offline</span></p>${vband()}<p class="meta" style="margin:0">The tab reads as last loaded; what the GM does waits and syncs as on Sam’s own tab (today’s offline rules).</p>`)}
  ${miniC('Wren given to Robin while the GM looks.', `${vband('Robin')}<p class="meta" style="margin:0">⚑ The band follows the new player. Not ruled: drawn for him to say.</p>`)}
  ${miniC('Wren removed while the GM looks.', `<div class="toastb"><span class="tmsg">Wren left the campaign.</span><span class="tb"></span></div><p class="meta" style="margin:var(--space-2) 0 0">⚑ The view closes back to Players. Not ruled.</p>`)}
  ${miniC('Messy: long names, 0, 99+.', `${vband(LONGP, LONGC)}${notBox('99+ notices')}${hpBox(0, 999)}`)}
</div>`,
  'M3k. <b>New, a proposal: the view’s states</b>, each drawn as a card of the tab. <b>Loading:</b> the band and the top row come at once from the Players list, so whose view it is shows before the tab does. <b>Couldn’t load:</b> the warning sign, plain words, “Try again”; the way back still works. <b>Offline:</b> the app’s Offline mark; the view behaves as Sam’s own tab does. <b>Given away or removed while open:</b> not ruled; drawn so he can say (⚑). <b>Messy:</b> both long names wrap in the band; the notices box reads “99+ notices”; hit points 0 of 999. <b>Not a state of the view:</b> a character with no Player tab yet opens the full sheet, as today (d5-22); an empty Players list is today’s page.');

mount(`

  <div class="wall">${m3k}</div>

  <p class="note"><b>7. Not ruled, drawn as a question</b> (M3k): a character given away or removed while the GM is in its view; the GM’s own character (“Yours”): is he its player, so the nine open for him there? (Drawn: the same view, the band reading “Your view of Ash” is not drawn.) An archived character: View sheet as today (drawn).</p>
  <h1>Self-review</h1>
  <p class="note"><b>The stylesheet.</b> This page links the shared mockup stylesheet (<code>../shared/book.css</code>) and its type pass, and restates none of their rules; its own rules are layout and the view’s own parts. Page 28’s own source is not in this repository, so the Player tab is redrawn from its pictures, shortened.</p>
