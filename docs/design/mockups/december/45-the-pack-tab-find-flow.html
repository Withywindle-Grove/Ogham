<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>December: page 45, the Pack tab's find flow: the player's find card, the count on the Pack's icon, New until Got it, coin in a hoard and on the card (rows K18 to K21; approved by Francis on 2026-11-26 in two sittings, p45-1 to p45-29, and redrawn to his answers)</title>
<link rel="stylesheet" href="../creation/final/final.css">
<link rel="stylesheet" href="../pack/pk.css">
<link rel="stylesheet" href="../shared/book.css">
<style>
  /* This page's own rules: layout only, and the parts page 08 (pack/08-the-pack-tab-whole.html) drew as its own
     (the count, the New tag, the coin line), copied as drawn. Type, the book format, the stacked button, the card,
     the sheet's head and the pop-up come from ../shared/book.css and are not restated. Every value is a token of
     docs/06: spacing 4/8/12/16/24/32, type 14/16/20, the tap 44, corners 4, 8, 20 (--radius-sheet) and 999 (--radius-pill). */
  body { min-width:2560px; }
  .pair { grid-template-columns:max-content max-content; }
  .fr { margin:0 0 var(--space-5); padding:0 var(--space-5) var(--space-5) 0; width:max-content; max-width:none; }
  .fr > .cap { font-size:16px; color:var(--ink); max-width:1180px; }
  .headnote { max-width:1180px; font-size:16px; color:var(--ink); border:1.5px dashed var(--warn); border-radius:4px; padding:var(--space-3); margin:0 0 var(--space-4); }
  .note { max-width:1180px; }
  .note.big { font-size:16px; color:var(--ink); }
  .lab { font-size:14px; color:var(--muted); margin:0 0 var(--space-2); max-width:343px; }
  .lab b { color:var(--ink); }
  .trio { display:flex; gap:var(--space-4); align-items:flex-start; }
  .flag { display:inline-block; border:1.5px dashed var(--warn); border-radius:4px; padding:0 var(--space-1); color:var(--ink); font-weight:700; font-size:14px; }
  .flag.done { border-style:solid; border-color:var(--ink); }
  .efoot { display:flex; justify-content:flex-end; gap:var(--space-2); margin-top:var(--space-3); }
  .cardb .efoot { margin-top:var(--space-1); }
  .fmark { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; flex:none; }
  /* from pack/08 and pack/07 (approved), copied as drawn: the count, the New tag, the coin line, a sheet's row */
  .b8 { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--ink); color:var(--page); font-size:14px; font-weight:700; margin-left:var(--space-1); box-sizing:border-box; }
  .pk-tabs > span { position:relative; }
  .pk-tabs .b8 { position:absolute; top:var(--space-1); left:calc(50% + 8px); margin:0; }
  .tag8 { display:inline-block; font-size:14px; font-weight:700; border:1.5px solid var(--ink); border-radius:4px; padding:0 var(--space-1); line-height:20px; margin-left:var(--space-2); vertical-align:2px; }
  .coinl { display:flex; align-items:center; gap:var(--space-2); min-height:52px; padding:var(--space-1) 0; border-top:3px double var(--rule); }
  .coinl .t { flex:1; min-width:0; font-weight:700; }
  .coinl .t small { display:block; font-weight:400; font-size:14px; color:var(--muted); }
  .coinl .go { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; flex:none; transform:rotate(-90deg); }
  .coinl .li { display:inline-flex; color:var(--muted); flex:none; }
  .act { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:48px; border-top:1px solid var(--rule); }
  .act .go { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; transform:rotate(-90deg); flex:none; }
  .act .li { display:inline-flex; color:var(--muted); margin-right:var(--space-2); flex:none; }
  .act > span:first-child { display:inline-flex; align-items:center; flex:1; }
  .hold8 { border:1.5px dashed var(--control); border-radius:4px; min-height:160px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--muted); font-size:14px; margin-top:var(--space-2); padding:var(--space-2); box-sizing:border-box; }
  .pill8 { display:inline-flex; align-items:center; gap:var(--space-1); border:1.5px solid var(--warn); color:var(--warn); border-radius:4px; padding:0 var(--space-2); min-height:28px; font-size:14px; font-weight:700; }
  .starb { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; margin-right:var(--space-2); }
  .sheetup { max-height:none; }
  .sheetup .head { align-items:flex-start; }
  .sheetup .head .ehead { min-width:0; overflow-wrap:break-word; align-self:center; }
  /* measured on page 08 (t44-1): the “About” mark is a full 44 px target; where it meets the first row under it, the mark’s target wins */
  .pk-gh:has(.i) .i { width:44px; }
  .kv2 { display:flex; justify-content:space-between; gap:var(--space-2); min-height:32px; align-items:center; border-bottom:1px dotted var(--rule); }

  /* ---- the tablet, 1180 px: the rail as built (page 38), the lists, the right column (PK1) ---- */
  .tablet.wide { width:1180px; margin-bottom:0; }
  .grid9 { display:grid; grid-template-columns:56px minmax(0,1fr) 400px; align-items:start; }
  .rail9 { align-self:stretch; display:flex; flex-direction:column; align-items:center; gap:var(--space-2); padding:var(--space-3) 0; border-right:1px solid var(--rule); background:var(--surface); }
  .ri9 { position:relative; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:4px; color:var(--muted); }
  .ri9.on { color:var(--ink); background:var(--wash); box-shadow:inset 0 0 0 2px var(--accent); }
  .ri9 .b8 { position:absolute; top:calc(-1 * var(--space-1)); left:calc(50% + 6px); margin:0; }
  .main9 { padding:var(--space-3) var(--space-5); min-width:0; }
  .side9 { align-self:stretch; padding:var(--space-3) var(--space-4); border-left:1px solid var(--rule); min-width:0; }
  .side9 > .cardb:first-child, .inner > .cardb:first-child { margin-top:0; }
  .two9 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--space-5); }

  /* ---- the find card's own additions (the card itself is shared/book.css's .cardb, as PK2 drew it) ---- */
  .cardb p b, .cardb .bsub { overflow-wrap:anywhere; }
  .cardb p { margin-bottom:var(--space-2); }
  /* p45-16: “and N more” is a tap (a 44 px row, underlined as a link is, with the row's chevron) */
  .cardb .more9 { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:44px; font-weight:700; }
  .cardb .more9 > span:first-child { text-decoration:underline; text-underline-offset:4px; }
  .cardb .more9 .go { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; transform:rotate(-90deg); flex:none; }
  .cardb .more9 + .efoot { margin-top:var(--space-2); }
  /* p45-14: a one-thing card's “Got it” stands beside its line */
  .cardb .one9 { display:flex; align-items:center; gap:var(--space-2); }
  .cardb .one9 > p { flex:1; min-width:0; margin-bottom:0; }
  .cardb .one9 > .btn { flex:none; }
  .cardb .once9 { font-size:14px; color:var(--muted); margin:0 0 var(--space-2); }
  .cardb .bk { margin-top:2px; }
  .cardb.why9 { margin-top:0; }
  /* p45-25: a find the GM took back before Got it. Its line turns quiet (the card's quiet colour, the plain weight) at the
     name's own size, so the row keeps its height and its place and “Got it” does not move */
  .cardb p.back9 { color:var(--muted); }
  .call9 { display:grid; grid-template-columns:28px minmax(0,1fr); gap:var(--space-2); align-items:start; }
  .call9 .efoot { grid-column:1 / -1; }

  /* ---- the toast in the ruled dress (tr-1, tr-6, tr-11, tr-12: page 43, frame 43H; shared/book.css still carries the
     toast as it was before that ruling, so this page draws 43H's values itself and says so) ---- */
  .thost { position:absolute; left:var(--space-4); right:var(--space-4); bottom:var(--space-4); display:flex; justify-content:center; }
  .phone .thost { left:var(--space-3); right:var(--space-3); bottom:var(--space-3); }
  .tz9 { position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2) var(--space-3); box-sizing:border-box; min-height:60px; max-width:min(100%, 572px); padding:var(--space-2) var(--space-4) var(--space-3); border-radius:20px; background:var(--ink); color:var(--page); box-shadow:0 8px 32px rgba(0,0,0,.25); overflow:hidden; font-family:"T Bitter", Georgia, serif; line-height:1.5; }
  .tz9.und { padding-right:var(--space-2); }
  .phone .tz9 { width:100%; }
  .tz9 .zt { flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
  .tz9 .zt.err { position:relative; padding-left:calc(20px + var(--space-2)); }
  .tz9 .zx { position:absolute; left:0; top:2px; width:20px; height:20px; border-radius:999px; background:var(--page); color:var(--ink); font-size:14px; font-weight:700; line-height:20px; text-align:center; }
  .tz9 .zu { margin-left:auto; display:inline-flex; align-items:center; gap:var(--space-1); min-height:44px; padding:0 var(--space-3); font-weight:700; text-decoration:underline; text-underline-offset:4px; }
  .tz9 .zbar { position:absolute; left:var(--space-4); right:var(--space-4); bottom:var(--space-1); height:4px; border-radius:999px; background:var(--page); opacity:.65; transform-origin:left; transform:scaleX(.7); }

  /* ---- over the page: the dim, a pop-up centred on the tablet (ap-7, PK13), the sheet from the foot on a phone ---- */
  .popc { position:absolute; left:50%; top:calc(var(--space-6) * 3); transform:translateX(-50%); width:440px; }
  .popc .hd .ehead { min-width:0; overflow-wrap:break-word; align-self:center; }
  .popc .hd > span:last-child { display:inline-flex; flex:none; }

  /* ---- the GM's hoard sheet, drawn as a card alone (page 30's HM2; page 44's TR1) ---- */
  .hoard9 { position:static; width:343px; box-sizing:border-box; border:1px solid var(--rule); border-radius:20px; box-shadow:0 4px 16px rgb(0 0 0 / 25%); padding:var(--space-4); }
  .hoard9 .where { margin:0; }
  .hoard9 .ttl { font-weight:700; font-size:20px; line-height:1.2; }
  .hoard9 .pk-row .t b { font-size:16px; }
  .hoard9 .sent { display:block; font-size:14px; font-weight:700; }
  .hoard9 .efoot { margin-bottom:var(--space-2); }
  .hoards { padding-left:var(--space-3); }

  /* ---- the count on the Pack's icon, alone ---- */
  .cnt9 { display:flex; gap:var(--space-4); align-items:flex-start; flex-wrap:wrap; }
  .railbox { width:120px; height:176px; border:1.5px solid var(--control); border-radius:4px; background:var(--page); overflow:hidden; display:grid; grid-template-columns:56px 1fr; box-sizing:border-box; }
  .railbox .rail9 { padding-top:var(--space-3); }
  .barbox { width:343px; border:1.5px solid var(--control); border-radius:4px; background:var(--page); overflow:hidden; box-sizing:border-box; }
  .barbox { padding-top:var(--space-1); }
  .barbox .pk-tabs { margin-top:0; }
  .logl { display:flex; align-items:center; min-height:44px; border-bottom:1px dotted var(--rule); padding:var(--space-1) 0; }
  .logl small { display:block; font-size:14px; color:var(--muted); }
  table.flags { border-collapse:collapse; max-width:1180px; font-size:14px; color:var(--ink); margin:var(--space-2) 0 var(--space-4); }
  table.flags td, table.flags th { text-align:left; vertical-align:top; padding:var(--space-1) var(--space-2); border-bottom:1px solid var(--rule); }
</style>
</head>
<body>
<script src="../creation/final/final.js"></script>
<script src="../pack/pk.js"></script>
<script src="icons/icons.js"></script>
<script src="../shared/book.js"></script>
<script>
// Invented names and numbers only. Sam plays Wren. The finds are the ones the GM sends on page 44, frames 44-7 and 44-8
// (pull request #102, a proposal): at "2. The Wreck", the Bronze ring (really the Ring of the Drowned Bell), the Crate's
// Lamp oil ×8 and the Strongbox (240 herons, two moon opals, four boat hooks and a hooded lantern).
const NEW = '<b>Approved 2026-11-26, with picks (p45-1).</b>';
// The twelve questions were ruled on 2026-11-26: each mark now names its ruling (p45-2 to p45-13).
const pick9 = (n) => `<span class="flag done">p45-${n + 1}</span>`;
const ruled9 = (n) => `<span class="flag done">p45-${n}</span>`;
const open9 = (n) => `<span class="flag">⚑ F${n}</span>`;
// creation/final/sweep.js (the fold mark, a frame, a column) is not on main, so the three helpers this page needs are its own
const foldMark = (open) => `<span class="fmark${open ? ' open' : ''}" aria-hidden="true">${I.chev}</span>`;
const col9 = (label, inner, cls = '') => `<div><p class="lab">${label}</p><div class="phone bit ${cls}">${inner}</div></div>`;
const fr9 = (n, slug, cap, body) => `<div class="fr" data-shot="45-${n}-${slug}"><p class="cap">${cap}</p>${body}</div>`;

// ---- parts, as page 08 drew them (PK1 to PK3) ----
const goC = `<span class="go" aria-hidden="true">${I.chev}</span>`;
const X8 = `<span class="btn sq" role="button" aria-label="Close" style="border:0;background:transparent">${I.close}</span>`;
const stk8 = (words, k, o = {}) => `<span class="btn stk${o.accent ? ' accent' : ''}" role="button">${gi(k, 24)}<span>${words}</span></span>`;
const badge8 = (n) => `<span class="b8" role="img" aria-label="${n} new">${n}</span>`;
const sub8 = (t) => `<h3 class="bsub">${t}</h3>`;
const foot8 = (btn) => `<div class="efoot">${btn}</div>`;
const tag8 = '<span class="tag8">New</span>';
const coinLine8 = (amounts, isNew) => `<div class="coinl" role="button" aria-label="Coin: ${amounts}${isNew ? ', new' : ''}"><span class="t">${amounts}${isNew ? tag8 : ''}</span>${goC}</div>`;
const stashRow8 = (line) => `<div class="coinl" role="button" aria-label="Party stash: ${line}"><span class="li">${gi('open-chest', 24)}</span><span class="t">Party stash<small>${line}</small></span>${goC}</div>`;
const hand8 = (name, act, k) => `<div class="pk-row"><span class="t"><b>${name}</b><small>${G.star}In hand</small></span>${stk8(act, k)}</div>`;
const hands8 = `${gh(true, 'At hand', '2 items')}${hand8('Reed spear', 'Attack', 'broadsword')}${hand8('Storm lantern', 'Light', 'torch')}`;
const rowNew = (name, o) => row(true, name, o).replace('</b>', `</b>${tag8}`);
const pfoot8 = (say, accent = true) => `<div class="pk-foot"><span class="say">${say}</span>${stk8('Add item', 'knapsack', { accent })}</div>`;
const tabsOn = (on, n) => `<div class="pk-tabs" role="tablist">${[['Player', G.crown], ['Scene', G.fire], ['Pack', G.pouch], ['Log', G.book]].map(([w, i]) => `<span role="tab"${w === on ? ' class="on"' : ''}${w === 'Pack' && n ? ` aria-label="Pack, ${n} new"` : ''}>${i}${w}${w === 'Pack' && n ? badge8(n) : ''}</span>`).join('')}</div>`;
const tbar8 = (title) => `<div class="bar pk-bar pk-wide"><span class="pk-link" role="button" style="min-height:44px;display:inline-flex;align-items:center;padding-left:var(--space-3)">‹ The Reed Marches</span><span class="title">${title}</span><span class="ico" role="button" aria-label="Messages">${G.mail}</span><span class="ico" role="button" aria-label="Rules">${G.book}</span><span class="ico" role="button" aria-label="More">${I.more}</span></div>`;
const offPill = `<p style="margin:0 0 var(--space-2)"><span class="pill8">${I.warn}Offline</span></p>`;

// ---- the tablet at 1180 px: the rail as built, the lists, the right column ----
const rail9 = (on, n) => `<div class="rail9" role="tablist">${[['Player', G.crown], ['Scene', G.fire], ['Pack', G.pouch]].map(([w, i]) => `<span class="ri9${w === on ? ' on' : ''}" role="tab" aria-label="${w}${w === 'Pack' && n ? `, ${n} new` : ''}">${i}${w === 'Pack' && n ? badge8(n) : ''}</span>`).join('')}</div>`;
const tab9 = (o) => `<div class="tablet wide bit"${o.h ? ` style="min-height:${o.h}px"` : ''}>${tbar8(o.title || 'Wren’s pack')}<div class="grid9">${rail9(o.on || 'Pack', o.n)}<div class="main9">${o.left}</div><div class="side9">${o.right}</div></div>${o.over || ''}</div>`;
const ph9 = (title, body, on, n, o = {}) => `${shell(title)}<div class="inner" style="position:relative;min-height:${o.h || 480}px;box-sizing:border-box${o.pad ? ';padding-bottom:96px' : ''}">${body}</div>${tabsOn(on, n)}${o.over || ''}`;

// ---- Wren's pack ----
const COIN0 = '12 crowns, 30 herons, 4 bits';
const COIN1 = '12 crowns, 270 herons, 4 bits';
const LOAD0 = load(true, 'Light, speed 125', [96, 0, 0], '383 of 1,200 coins');
const LOAD1 = load(true, 'Light, speed 125', [96, 0, 0], '384 of 1,200 coins');
const LOAD6 = load(true, 'Light, speed 125', [100, 3, 0], '412 of 1,200 coins');
const CARR = [['Bog sling', { w: 5 }], ['Coil of reed rope', { w: 50 }], ['Glow wand', { w: 10 }], ['Reed basket', { w: 20 }], ['River pearls', { q: 6, w: 6 }]];
const carr9 = (skip = []) => CARR.filter(([n]) => !skip.includes(n)).map(([n, x]) => row(true, n, x)).join('');
const lists9 = (news, n, o = {}) => `${hands8}${worn(true)}${basket(true)}${gh(true, 'Carried', `${n} items`)}${news}${carr9(o.skip)}${tiny(true)}`;
const RING = rowNew('Bronze ring', { w: 1 });
const SIX_ROWS = `${RING}${rowNew('Moon opals', { q: 2, w: 2 })}${rowNew('Hooded lantern', { w: 20 })}${rowNew('Boat hooks', { q: 4, w: 4 })}${rowNew('Silver key', { w: 0 })}`;
const HOARD_ROWS = `${rowNew('Moon opals', { q: 2, w: 2 })}${rowNew('Boat hooks', { q: 4, w: 4 })}${rowNew('Hooded lantern', { w: 20 })}`;

// ---- the find card (PK2's card) ----
const GMNOW = 'From your GM, just now.';
// Ruled 2026-11-26: “Got it” is plain on every tab (p45-4); a one-thing card's stands beside its line (p45-14);
// “and N more” is a tap that opens the Pack at the new rows (p45-16).
const gotIt9 = stk8('Got it', 'check-mark');
// A line is [name, who and when, now]. “now” is the stack's new count when a find joins a stack she carries (p45-22).
// { back: name } is a find the GM took back before Got it: a quiet line in the same place (p45-25).
const line9 = (l) => l.back ? `<p class="back9">Your GM took back ${l.the === undefined ? 'the ' : l.the}${l.back}.</p>` : `<p><b>${l[0]}</b>${l[2] ? `, now ${l[2]}` : ''}${l[1] ? `<small>${l[1]}</small>` : ''}</p>`;
const more9 = (n) => `<div class="more9" role="button" aria-label="and ${n} more: see them in your pack"><span>and ${n} more</span>${goC}</div>`;
const card9 = (head, lines, o = {}) => `<div class="cardb" role="status" aria-label="${head}">${sub8(head)}${o.once ? `<p class="once9">${o.once}</p>` : ''}${lines.length === 1 && !o.more ? `<div class="one9">${line9(lines[0])}${gotIt9}</div>` : `${lines.map(line9).join('')}${o.more ? more9(o.more) : ''}${foot8(gotIt9)}`}</div>`;
const ONE = card9('New in your pack', [['Bronze ring', GMNOW]]);
const SIX = card9('6 new things', [['240 herons', `${GMNOW} In your coin.`], ['Bronze ring', GMNOW], ['Moon opals ×2', GMNOW]], { more: 3 });
const COINCARD = card9('New in your coin', [['240 herons', GMNOW]]);
const HOARDCARD = card9('New in your pack', [['240 herons', 'In your coin.'], ['Moon opals ×2'], ['Boat hooks ×4'], ['Hooded lantern']], { once: GMNOW });
const toast9 = (words, o = {}) => `<div class="thost"><div class="tz9${o.undo ? ' und' : ''}" role="${o.err ? 'alert' : 'status'}"><span class="zt${o.err ? ' err' : ''}">${o.err ? '<span class="zx" role="img" aria-label="Problem">✕</span>' : ''}${words}</span>${o.undo ? `<span class="zu" role="button">${gi('anticlockwise-rotation', 20)}Undo</span>` : ''}<span class="zbar" aria-hidden="true"></span></div></div>`;
const STASH_TOAST = 'Your GM put Lamp oil ×8 in the party stash.';
const hold9 = (words, h = 160) => `<div class="hold8" style="min-height:${h}px">${words}</div>`;
const elsewhere9 = (card, n, on = 'Player', extra = '') => ph9('Wren', `${card}${hold9('The tab she is on')}${extra}`, on, n);

// ---- an item's sheet, as its holder sees it before anything is told (page 30's HM4, page 33's K22h, picture 1) ----
const starO = `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3l2.800 6 6.500.6-4.900 4.300 1.500 6.400L12 17l-5.900 3.300 1.500-6.400L2.700 9.600 9.200 9z" ${W}/></svg>`;
const pin8 = `<span class="starb" role="button" aria-label="Pin to At hand" aria-pressed="false">${starO}</span>`;
const act8 = (words, k, go = true) => `<div class="act" role="button"><span><span class="li">${gi(k, 24)}</span>${words}</span>${go ? goC : ''}</div>`;
const ITEM_ACTS = `${act8('Give to…', 'open-palm')}${act8('Put in…', 'swap-bag')}${act8('Drop', 'drop-weapon', false)}`;
const RING_BODY = `<div class="bk"><p>A plain band of old bronze.</p><p class="ln"><span class="lb">What you notice.</span>Cold to the touch, even by the fire.</p></div><div class="kv2"><span class="meta">Slot</span><span>Ring</span></div>${ITEM_ACTS}`;
const ROPE_BODY = `<div class="bk"><p class="ln"><span class="lb">Weight</span>50 coins</p></div>${ITEM_ACTS}`;
const sheetUp = (title, body) => `<div class="dim"></div><div class="sheetup"><div class="head"><span class="ehead">${title}</span><span style="display:inline-flex;flex:none">${pin8}${X8}</span></div>${body}</div>`;
