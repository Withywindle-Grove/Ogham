<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>December: page 33, K22, what a player notices, the GM's edit and the Reveal pop-up (2026-11-21)</title>
<link rel="stylesheet" href="../creation/final/final.css">
<link rel="stylesheet" href="../scene/scene.css">
<link rel="stylesheet" href="../scene/scene-seq.css">
<link rel="stylesheet" href="december.css">
<link rel="stylesheet" href="../shared/book.css">
<style>
  /* this page's own rules: layout and this page's own parts only (the fact row, the form's fields, the veil).
     Type, the book format, the stacked button, the pop-up, the toast and the corners come from ../shared/book.css
     and are not restated. The view's frame, the Pack's rows and the item's rows are page 32's own, copied as drawn. */
  .lbl { font-size:14px; color:var(--muted); margin:var(--space-3) 0 var(--space-2); }
  .lbl:first-child { margin-top:0; }
  .vtop { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:var(--space-2); min-height:52px; padding:0 var(--space-2) 0 var(--space-4); border-bottom:1px solid var(--rule); }
  .vtop .back { color:var(--accent); text-decoration:underline; min-height:44px; display:flex; align-items:center; }
  .vtop .vtt { font-weight:700; font-size:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:520px; text-align:center; }
  .vtop .rt { display:flex; justify-content:flex-end; }
  .vband { display:grid; grid-template-columns:28px minmax(0,1fr); gap:var(--space-1) var(--space-3); align-items:center; border:1.5px solid var(--control); border-left:4px solid var(--info); border-radius:4px; background:var(--surface); padding:var(--space-2) var(--space-3); margin:0 0 var(--space-4); }
  .vband > span:first-child { display:flex; color:var(--info); }
  .vband > span:last-child { min-width:0; }
  .vband small { display:block; font-size:14px; color:var(--muted); white-space:nowrap; }
  .vband b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
  .phone .vband { margin:var(--space-2) var(--space-3) var(--space-3); grid-template-columns:24px minmax(0,1fr); gap:var(--space-1) var(--space-2); }
  .gmmark { display:flex; gap:var(--space-2); align-items:center; font-size:16px; color:var(--info); margin-top:var(--space-1); }
  .gmmark span { min-width:0; overflow-wrap:break-word; }
  .footrow { display:grid; grid-template-columns:minmax(0,1fr) 20px; align-items:center; min-height:56px; border-bottom:1px dotted var(--rule); }
  .footrow b { font-size:20px; }
  .footrow small { display:block; font-size:14px; color:var(--muted); }
  .grp { display:flex; justify-content:space-between; align-items:baseline; margin:var(--space-4) 0 var(--space-1); }
  .grp:first-child { margin-top:0; }
  .grp span:last-child { font-size:14px; color:var(--muted); }
  .irow { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--space-2); align-items:center; min-height:56px; border-bottom:1px dotted var(--rule); padding:var(--space-1) 0; }
  .irow small { display:block; font-size:14px; color:var(--muted); }
  .irow.open { background:var(--wash); box-shadow:inset 3px 0 0 var(--accent); padding-left:var(--space-2); }
  .newtag { display:inline-flex; align-items:center; border:1.5px solid var(--ink); border-radius:4px; padding:0 var(--space-1); font-size:14px; font-weight:700; margin-left:var(--space-2); }
  .pfoot2 { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); margin-top:var(--space-3); border-top:1px solid var(--rule); padding-top:var(--space-2); }
  .lrow { display:grid; grid-template-columns:24px minmax(0,1fr) 20px; gap:var(--space-3); align-items:center; min-height:48px; border-bottom:1px dotted var(--rule); }
  .lrow svg { color:var(--muted); }
  .kv2 { display:flex; justify-content:space-between; gap:var(--space-2); min-height:32px; align-items:center; border-bottom:1px dotted var(--rule); }
  .two32 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--space-4) var(--space-5); align-items:start; }
  .pill32 { display:inline-flex; align-items:center; gap:var(--space-1); border:1.5px solid var(--warn); color:var(--warn); border-radius:4px; padding:0 var(--space-2); min-height:28px; font-size:14px; font-weight:700; }
  .phone .tabbar.five { grid-template-columns:repeat(5,1fr); }
  .tabbar span { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  /* an item's sheet: a long name wraps beside the star and the ✕ */
  .icard .hrow { align-items:flex-start; }
  .icard .hrow h2 { min-width:0; overflow-wrap:break-word; align-self:center; }
  .icard p { margin:0 0 var(--space-2); }
  .icard .knownl { font-weight:700; }
  /* the dimmed page, the centred pop-up over it and the toast at the screen's foot */
  .veil { position:absolute; inset:0; background:rgba(0,0,0,.35); }
  .popc { position:absolute; left:50%; top:calc(var(--space-6) * 5); transform:translateX(-50%); width:440px; }
  .toastc { position:absolute; left:50%; bottom:var(--space-4); transform:translateX(-50%); width:440px; }
  .ft { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:var(--space-2); margin-top:var(--space-3); }
  .popb .hd > span:first-child, .sheetup .head > span:first-child { min-width:0; }
  /* K22's new part: a hidden fact's row in the Reveal pop-up */
  .frow { display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:var(--space-3); align-items:center; min-height:56px; padding:var(--space-1) 0; border-bottom:1px dotted var(--rule); box-sizing:border-box; }
  .frow > svg { color:var(--muted); }
  .frow b { display:block; }
  .frow small { display:block; font-size:14px; color:var(--muted); overflow-wrap:break-word; }
  .toldm { display:inline-flex; align-items:center; gap:var(--space-1); min-height:44px; padding:0 var(--space-2); font-weight:700; }
  .scrollcue { font-size:14px; color:var(--muted); text-align:center; border-top:1px solid var(--rule); padding-top:var(--space-1); }
  /* K22's form: a labelled field with one quiet line under it */
  .fld { margin:0 0 var(--space-3); }
  .fld .fl { display:block; font-weight:700; margin-bottom:var(--space-1); }
  .fld small { display:block; font-size:14px; color:var(--muted); margin-top:var(--space-1); }
  .fld .field { overflow-wrap:break-word; }
  .fld .field.area { min-height:88px; }
  /* a designer's pick, marked on the frame's caption */
  .pk { display:inline-block; border:1.5px dashed var(--info); border-radius:4px; padding:0 var(--space-1); color:var(--ink); font-weight:700; }
  /* the phone: the page behind, dimmed, and the sheet from the foot (page 26's way of drawing it) */
  .sheetup.flow { position:relative; max-height:none; }
  .behind { position:relative; height:52px; overflow:hidden; box-sizing:border-box; }
  .behind.tall { height:auto; }
  .behind .toastb { position:relative; z-index:1; margin:var(--space-6) var(--space-2) var(--space-2); }
  .two32 .toastb { max-width:440px; box-sizing:border-box; }
  .gap3 { height:var(--space-3); }
  .gap5 { height:var(--space-5); }
  .pu-hd { display:flex; align-items:flex-start; gap:var(--space-2); margin-bottom:var(--space-2); }
  .pu-hd .ehead { flex:1; min-width:0; overflow-wrap:break-word; align-self:center; }
  .pu-b { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; flex:none; }
  .grey { filter:grayscale(1); }
</style>
</head>
<body>
<script src="../creation/final/final.js"></script>
<script src="../scene/scene.js"></script>
<script src="../scene/scene-seq.js"></script>
<script src="december.js"></script>
<script src="icons/icons.js"></script>
<script src="strip.js"></script>
<script src="../shared/book.js"></script>
<script>
// Invented names and numbers only. Sam plays Wren; the ring is page 32's (frame M3g); the lantern's long name is page 30's (HM4).
const go = svg(SY.right, 20);
const stk = (words, k, o = {}) => `<span class="btn stk${o.accent ? ' accent' : ''}" role="button">${gi(k, 24)}<span>${words}</span></span>`;
const Xb = `<span class="btn sq" role="button" aria-label="Close" style="border:0;background:transparent">${I.close}</span>`;
const dpick = (words) => `<span class="pk">Designer’s pick</span> ${words}`;
const DRAWN = '<b>Drawn 2026-11-21, awaiting approval.</b> ';

// ---- the view's frame on a tablet (page 32's, as approved) ----
const railV = (on, magic = true) => `<div class="rail">${[['crown', 'Player'], ['fire', 'Scene'], ['sack', 'Pack'], ...(magic ? [['moon', 'Magic']] : [])].map(([k, l]) => `<span class="ri${l === on ? ' on' : ''}" role="button" aria-label="${l}">${k === 'moon' ? gi('moon', 24) : sym(k, 24)}</span>`).join('')}</div>`;
const topV = (title = '') => `<div class="vtop"><span class="back" role="link">‹ Players</span><span class="vtt">${title}</span><span class="rt">${ico('note', 'Log')}${ico('mail', 'Messages')}${ico('book', 'Reference')}<span class="ico" role="button" aria-label="More">${I.more}</span></span></div>`;
const vband = (p = 'Sam', c = 'Wren') => `<div class="vband" role="note" aria-label="${p}’s view of ${c}. What you do here is logged as yours."><span>${sym('eye', 24)}</span><span><b>${p}’s view of ${c}</b><small>What you do here is logged as yours.</small></span></div>`;
const vdev = (inner, cap, o = {}) => `<div><p class="cap" style="width:1024px;max-width:1024px">${cap}</p><div class="dev ipad"${o.short ? ' style="min-height:0"' : ''}>${railV('Pack')}<div class="main">${topV('Wren’s pack')}<div class="page">${vband()}${inner}</div></div>${o.extra || ''}</div></div>`;
// the player's own tablet: the player's rail and top row, no band
const pdev = (inner, cap) => `<div><p class="cap" style="width:1024px;max-width:1024px">${cap}</p><div class="dev ipad" style="min-height:0">${railV('Pack')}<div class="main">${topRow('player')}<div class="page">${inner}</div></div></div></div>`;

// ---- the Pack and an item's sheet (page 32, frame M3g) ----
const packList = `<div class="grp"><span class="sclab" style="margin:0">At hand</span><span>2 items</span></div><div class="irow"><span><b>★ Shortbow</b><small>Quiver: Arrows ×18</small></span>${stk('Quiver', 'quiver')}</div><div class="irow"><span><b>Storm lantern</b><small>Unlit. 3 refills left</small></span>${stk('Light', 'torch')}</div>
  <div class="grp"><span class="sclab" style="margin:0">Worn and in hand</span><span>2 items</span></div><div class="irow"><span><b>Longsword</b><small>In hand</small></span>${go}</div><div class="irow"><span><b>Mail</b><small>Worn</small></span>${go}</div>
  <div class="grp"><span class="sclab" style="margin:0">Carried</span><span>3 items</span></div><div class="irow open" role="button" aria-current="true"><span><b>Bronze ring<span class="newtag">New</span></b><small>Found today</small></span>${go}</div><div class="irow"><span><b>Rations</b><small>×3</small></span>${go}</div><div class="irow"><span><b>Rope, 50 feet</b><small>Coiled</small></span>${go}</div>
  <div class="footrow" role="button"><span><b>Gear</b><small>Backpack: 6 things</small></span>${go}</div><div class="footrow" role="button"><span><b>Party stash</b><small>11 things</small></span>${go}</div>`;
const pfoot = `<div class="pfoot2"><span class="meta">14 items</span>${b('Add item', { accent: true })}</div>`;
const gmLine = (words) => `<div class="gmmark">${sym('eyeoff', 16)}<span>Only you see this: ${words}</span></div>`;
const revealRow = `<div class="lrow" role="button">${sym('eye', 24)}<span>Reveal…</span>${go}</div>`;
const editRow = `<div class="lrow" role="button">${gi('quill-ink', 24)}<span>Edit what players see…</span>${go}</div>`;
const itemRows = `<div class="lrow" role="button">${gi('open-palm', 24)}<span>Give to…</span>${go}</div><div class="lrow" role="button">${gi('swap-bag', 24)}<span>Put in…</span>${go}</div><div class="lrow" role="button">${gi('drop-weapon', 24)}<span>Drop</span><span></span></div>`;
const card = (name, body) => `<div class="pcard icard"><div class="hrow"><h2>${name}</h2>${ico('star', 'Pin to top')}<span class="ico" role="button" aria-label="Close">${I.close}</span></div>${body}</div>`;
const notice = (w) => `<div class="bk"><p class="ln"><span class="lb">What you notice.</span>${w}</p></div>`;
const kv = (k, v) => `<div class="kv2"><span class="meta">${k}</span><span>${v}</span></div>`;
const known = (w) => `<p class="knownl">${w}</p>`;
const srcl = '<p class="meta">From your setting: Saltwick Island, p. 14.</p>';
const LOOK = '<p>A plain band of old bronze.</p>';
const NOTE = 'Cold to the touch, even by the fire.';
const TRUE = 'Ring of the Drowned Bell';
const LONGT = 'The Old Lantern of the Drowned and of the Nine Tides';
const SLOT = kv('Slot', 'Ring');

// ---- the toast and the log ----
const toast = (words, undo = true) => `<div class="toastb"><span class="tmsg">${words}</span>${undo ? `<span class="tu" role="button">${gi('anticlockwise-rotation', 20)}Undo</span>` : ''}<span class="tb"></span></div>`;
const logCard = (title, lines) => `<div class="pcard"><h2 style="margin-top:0">${title}</h2>${lines.map(([t, who]) => `<div class="logl">${t} <span>${who}</span></div>`).join('')}</div>`;
const lab = (label, html) => `<div><p class="lbl"><b>${label}</b></p>${html}</div>`;

// ---- piece A: the GM's edit ----
const fld = (label, value, hint, o = {}) => `<div class="fld"><span class="fl">${label}</span><span class="field${o.area ? ' area' : ''}" role="textbox" aria-label="${label}">${value || '&nbsp;'}</span><small>${hint}</small></div>`;
const editIn = (a, n, cat = 'Ring') => `${fld('Appears as', a, `Left empty, it reads as “${cat}”.`)}${fld('What you notice', n, 'Left empty, players see no such line.', { area: true })}<div class="ft">${b('Save', { accent: true })}</div>`;
const editPop = (a, n, cat) => `<div class="popb" role="dialog" aria-label="What players see"><div class="hd"><span class="sheet-title">What players see</span>${Xb}</div>${editIn(a, n, cat)}</div>`;
const LONGA = 'A hooded lantern of green glass, with a ring for the hand';
const LONGN = 'Cold to the hand, and no smell of oil. The glass is sea-green and thick as a bottle’s foot; held to the ear it hums, low, like a shell. The shutter sticks, and the ring is worn bright on one side only.';

// ---- piece B: the Reveal pop-up ----
const RING = { magic: ['That it’s magic', ''], name: ['Its true name', TRUE], bonus: ['Its bonus', '+1 to saves'], cursed: ['That it’s cursed', ''] };
const LAMP = { magic: ['That it’s magic', ''], name: ['Its true name', LONGT], bonus: ['Its bonus', '+1 to saves against fear'], p1: ['A power', 'Burns without oil'], p2: ['A power', 'Shows what lies under water within ten paces'], p3: ['A power', 'The drowned can see its bearer from as far'], cursed: ['That it’s cursed', ''], charges: ['Its charges', '999 of 999 left'], mark: ['Maker’s mark', 'Three waves under a bell'] };
const WAND = { charges: ['Its charges', '3 of 5 left'] };
const fRow = ([k, v], told) => `<div class="frow"${told ? '' : ' role="button"'} aria-label="${k}${v ? ': ' + v : ''}${told ? '. Told' : ''}">${sym(told ? 'eye' : 'eyeoff', 24)}<span><b>${k}</b>${v ? `<small>${v}</small>` : ''}</span>${told ? `<span class="toldm">${sym('check', 16)}Told</span>` : small('Tell')}</div>`;
const rows = (src, keys, told = []) => keys.map((k) => fRow(src[k], told.includes(k))).join('');
const revealIn = (rowsHtml, o = {}) => `<div class="flist">${rowsHtml}</div>${o.cue ? `<p class="scrollcue">${o.cue}</p>` : ''}${o.all ? '<p class="meta" style="margin:var(--space-3) 0 0">Nothing is left hidden.</p>' : `<div class="ft">${b('Tell them everything', { accent: true })}</div>`}`;
const revealHd = (meta, cls = 'hd', tcls = 'sheet-title') => `<div class="${cls}"><span><span class="${tcls}">Reveal</span><small class="meta" style="display:block;overflow-wrap:break-word">${meta}</small></span>${Xb}</div>`;
const revealPop = (meta, rowsHtml, o = {}) => `<div class="popb" role="dialog" aria-label="Reveal">${revealHd(meta)}${revealIn(rowsHtml, o)}</div>`;
const R4 = ['magic', 'name', 'bonus', 'cursed'];
const L9 = ['magic', 'name', 'bonus', 'p1', 'p2', 'p3', 'cursed', 'charges', 'mark'];
const RMETA = 'Bronze ring, in Wren’s pack';

// ================= K22a: the GM's item sheet with the two rows =================
const ringGM = card('Bronze ring', `${LOOK}${notice(NOTE)}${gmLine(`${TRUE}, +1 to saves, cursed.`)}${SLOT}${revealRow}${editRow}${itemRows}`);
const k22a = vdev(`<div class="cols2" style="margin-top:0"><div>${packList}${pfoot}</div><div>${ringGM}</div></div>`,
  `K22a. ${DRAWN}<b>The GM’s item sheet, with the one new row</b> (k22-1, k22-8). Page 32’s frame M3g (approved 2026-11-21), unchanged but for one row: <b>“Edit what players see…”</b>, under “Reveal…” and above the player’s own rows (Give to…, Put in…, Drop). It opens the form of frame K22b. <b>“Reveal…”</b> now opens the Reveal pop-up of frame K22d (k22-8: the pop-up replaces today’s per-field buttons). ${dpick('one row and one form for both fields, not a row for each; its words, “Edit what players see…”; it shows on an unidentified item until its true name is told (after that neither field shows anywhere), and never on an item that is hidden in part but named (frame K22e, 6).')} Both rows are the GM’s alone: Sam’s own sheet has neither (frame K22h). “Add item” stays the page’s one accent.`);

// ================= K22b: the edit form, as it opens =================
const k22b = vdev(`<div class="cols2" style="margin-top:0"><div>${packList}${pfoot}</div><div>${ringGM}</div></div>`,
  `K22b. ${DRAWN}<b>“Edit what players see…” opens this form</b> (k22-1, k22-3): centred over the dimmed page on a tablet (fb7-1), a sheet from the foot on a phone (frame K22i). <b>Two fields, each starting from the setting’s own words</b>: “Appears as” (one line) and “What you notice” (several lines). <b>Either may be left empty</b>; the quiet line under each says what an empty field does. <b>No warning on his words</b> (k22-3): nothing checks them. One accent, “Save”, alone at the right (ft-1); ✕, Escape or a tap outside closes and keeps nothing. The form does not open the keyboard: focus goes to the card (06, Sheet). ${dpick('the title, “What players see”; the labels are the players’ own (“What you notice”), one name per thing; the two quiet lines.')}`,
  { extra: `<div class="veil"></div><div class="popc">${editPop('Bronze ring', NOTE)}</div>` });

// ================= K22c: the form's cases =================
const ringEmptyGM = card('Ring', `${LOOK}${gmLine(`${TRUE}, +1 to saves, cursed.`)}${SLOT}${revealRow}${editRow}${itemRows}`);
const k22c = vdev(`<div class="two32">
  ${lab('1. Both emptied.', editPop('', ''))}
  ${lab('2. After Save with both empty: the GM’s sheet. Sam’s reads the same, without the GM’s line and rows.', ringEmptyGM)}
  ${lab('3. Messy: long words. The fields grow; nothing is cut.', editPop(LONGA, LONGN, 'Lantern'))}
  ${lab('4. After Save: the toast, at the screen’s foot, and the log.', `${toast('Changed what players see of the Bronze ring.')}<div class="gap3"></div>${logCard('The log’s line, by reader', [['You changed what players see of Wren’s Bronze ring.', 'The GM'], ['<i>No line.</i>', 'Sam, and the party']])}`)}
</div>`,
  `K22c. ${DRAWN}<b>The form’s cases</b> (k22-3). <b>1, both emptied:</b> allowed; the fields stay open and plain. <b>2, what an empty “Appears as” and an empty “What you notice” give:</b> the item reads by its category’s singular name, “Ring”, and there is no “What you notice” line at all, with no hint that one was taken away (06, rule 8). <b>3, long words:</b> the fields grow to their words. <b>4, Save:</b> it happens at once, with a toast and Undo (Undo over confirm); Save with nothing changed closes and says nothing. ${dpick('the toast’s words; the change is logged for the GM only: the players get no log line, their sheet simply reads the new words.')} <b>Not drawn, as no ruling asks for them:</b> a way back to the setting’s words other than Undo; a cap on length.`, { short: true });

// ================= K22d: the Reveal pop-up =================
const k22d = vdev(`<div class="cols2" style="margin-top:0"><div>${packList}${pfoot}</div><div>${ringGM}</div></div>`,
  `K22d. ${DRAWN}<b>“Reveal…” opens the Reveal pop-up</b> (k22-4, k22-5; 05’s “a popup listing each hidden fact in plain words, plus Tell them everything”). <b>One row per fact hidden on this item</b>, in 05’s words: “That it’s magic” (a magic item only), “Its true name”, “Its bonus”, “That it’s cursed”; GM notes are never offered. <b>A tap on a row tells that fact at once</b> (k22-5); the pop-up stays open. <b>“Tell them everything”</b> is the pop-up’s one accent, alone at the right of the foot (ft-1). ${dpick('the title, “Reveal”, with a quiet line naming the item and where it is; each row carries the closed eye, the fact, what it is in a quiet line under it (the GM sees all of it), and a small “Tell” button; the whole row is the tap.')} Centred over the dimmed page on a tablet (fb7-1); ✕, Escape or a tap outside closes it.`,
  { extra: `<div class="veil"></div><div class="popc">${revealPop(RMETA, rows(RING, R4))}</div>` });

// ================= K22e: the pop-up's states =================
const k22e = vdev(`<div class="two32">
  ${lab('1. After a tap on “That it’s cursed”.', `${revealPop(RMETA, rows(RING, R4, ['magic', 'cursed']))}<div class="gap3"></div>${toast('Told Wren: the Bronze ring is cursed.')}`)}
  ${lab('2. After Undo: hidden again.', revealPop(RMETA, rows(RING, R4)))}
  ${lab('3. After a tap on “Its true name”.', `${revealPop(`${TRUE}, in Wren’s pack`, rows(RING, R4, ['magic', 'name']))}<div class="gap3"></div>${toast(`Shown to the players: ${TRUE}. Wren’s Bronze ring now carries its name.`)}`)}
  ${lab('4. After “Tell them everything”.', `${revealPop(`${TRUE}, in Wren’s pack`, rows(RING, R4, R4), { all: true })}<div class="gap3"></div>${toast(`Told Wren everything about the ${TRUE}.`)}`)}
  ${lab('5. Opened again later, the curse told earlier: only what is still hidden.', revealPop(RMETA, rows(RING, ['name', 'bonus'])))}
  ${lab('6. A fact list of one: a plain wand whose charges the setting hides.', revealPop('Ash wand, in Wren’s pack', rows(WAND, ['charges'])))}
</div>`,
