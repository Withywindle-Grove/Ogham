<style>
  /* this page's own rules: layout and this page's own parts only (the fact row, the form's fields, the veil).

     and are not restated. The view's frame, the Pack's rows and the item's rows are page 32's own, copied as drawn. */
  .lbl { font-size:14px; color:var(--muted); margin:var(--space-3) 0 var(--space-2); }
  .lbl:first-child { margin-top:0; }
  .vtop { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:var(--space-2); min-height:52px; padding:0 var(--space-2) 0 var(--space-4); border-bottom:1px solid var(--rule); }

  .vband { display:grid; grid-template-columns:28px minmax(0,1fr); gap:var(--space-1) var(--space-3); align-items:center; border:1.5px solid var(--control); border-left:4px solid var(--info); border-radius:4px; background:var(--surface); padding:var(--space-2) var(--space-3); margin:0 0 var(--space-4); }
  .vband > span:first-child { display:flex; color:var(--info); }
  .vband > span:last-child { min-width:0; }
  .vband small { display:block; font-size:14px; color:var(--muted); white-space:nowrap; }
  .vband b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
  .phone .vband { margin:var(--space-2) var(--space-3) var(--space-3); grid-template-columns:24px minmax(0,1fr); gap:var(--space-1) var(--space-2); }
  .gmmark { display:flex; gap:var(--space-2); align-items:center; font-size:16px; color:var(--info); margin-top:var(--space-1); }
  .gmmark span { min-width:0; overflow-wrap:break-word; }
  .footrow { display:grid; grid-template-columns:minmax(0,1fr) 20px; align-items:center; min-height:56px; border-bottom:1px dotted var(--rule); }
  .footrow b { font-size:20px; }
  .footrow small { display:block; font-size:14px; color:var(--muted); }

  .newtag { display:inline-flex; align-items:center; border:1.5px solid var(--ink); border-radius:4px; padding:0 var(--space-1); font-size:14px; font-weight:700; margin-left:var(--space-2); }
  .pfoot2 { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); margin-top:var(--space-3); border-top:1px solid var(--rule); padding-top:var(--space-2); }
  .lrow { display:grid; grid-template-columns:24px minmax(0,1fr) 20px; gap:var(--space-3); align-items:center; min-height:48px; border-bottom:1px dotted var(--rule); }

  .toastc { position:absolute; left:50%; bottom:var(--space-4); transform:translateX(-50%); width:440px; }
  .ft { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:var(--space-2); margin-top:var(--space-3); }
  .popb .hd > span:first-child, .sheetup .head > span:first-child { min-width:0; }
  /* K22's new part: a hidden fact's row in the Reveal pop-up */

  /* ---- page 47’s At hand rows (loop 2’s draft frame 47-3), copied as drawn ---- */

     (page 35, copied as drawn). Every value is a token from docs/06: spacing 4/8/12/16/24/32, type 14/16/20/36, the
     tap 44, the ring's tap 72 by 76, corners 4 and 20. Type, the stacked button, the toast and the small-capitals label
     come from ../shared/book.css and are not restated. */

  /* the phone at 375 px (page 35's) */
  .ph { position:relative; width:375px; background:var(--page); outline:1.5px solid var(--control); border-radius:4px; box-sizing:border-box; overflow:hidden; --ts:1; }

  .hd { display:grid; grid-template-columns:96px minmax(0,1fr); gap:var(--space-3); align-items:center; }
  .por { width:96px; height:96px; border-radius:50%; border:1.5px solid var(--control); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:var(--accent); box-sizing:border-box; }

  .ic47 { display:grid; grid-template-columns:168px repeat(3, 343px); gap:var(--space-2) var(--space-4); align-items:start; }
  .ic47 .hdc { font-size:14px; color:var(--muted); }
  .ic47 .what b { display:block; font-size:20px; }
  .ic47 .what small { display:block; font-size:14px; color:var(--muted); }
  .ic47 .cand { display:flex; flex-direction:column; gap:var(--space-2); padding-bottom:var(--space-3); border-bottom:1px dotted var(--rule); }
  .ic47 .what { padding-bottom:var(--space-3); border-bottom:1px dotted var(--rule); align-self:stretch; }

  .ic47 .pane { background:var(--page); outline:1.5px solid var(--control); border-radius:4px; padding:0 var(--space-3); }
  .near { display:flex; gap:var(--space-4); flex-wrap:wrap; margin-top:var(--space-2); }
  .lone { display:inline-flex; flex-direction:column; align-items:center; gap:var(--space-1); width:88px; font-size:14px; color:var(--muted); text-align:center; }
  .lone svg { color:var(--ink); }

  /* At hand's rows and the light (page 35, as drawn) */
  .row { display:flex; align-items:center; gap:var(--space-2); min-height:56px; padding:var(--space-1) 0; border-bottom:1px dotted var(--rule); }

  .lb47 { display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-1) 0 var(--space-2); border-bottom:1px dotted var(--rule); }

  .kp .sp { flex:1 1 0; min-width:0; }
  .i44 { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; color:var(--info); flex:none; }
  .tg { width:52px; }
  .rg { position:relative; display:inline-flex; width:52px; height:52px; align-items:center; justify-content:center; flex:none; }
  .rg .arc { position:absolute; inset:0; transform:rotate(-90deg); }

  .rt { display:inline-flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:2px; width:72px; min-height:76px; flex:none; box-sizing:border-box; padding-top:2px; }
  .rt .vb { font-size:calc(14px * var(--ts)); font-weight:700; line-height:1.2; color:var(--ink); white-space:nowrap; }
  /* the weapon in hand block (page 35's 35C, as drawn) */
  .wpn { border:1.5px solid var(--ink); border-radius:4px; background:var(--sheet); padding:var(--space-2) var(--space-3); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--space-1) var(--space-3); align-items:center; margin:var(--space-2) 0; }

  .tst { padding:0 var(--space-3) var(--space-2); }

  .tz .zt { flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }

  .tz .zbar { position:absolute; left:var(--space-4); right:var(--space-4); bottom:var(--space-1); height:4px; border-radius:999px; background:var(--page); opacity:.65; }

  .tab { width:1180px; background:var(--page); border:1.5px solid var(--control); border-radius:4px; box-sizing:border-box; overflow:hidden; display:grid; grid-template-columns:56px minmax(0,1fr); --ts:1; }

<script>
{
// ---- page 33’s parts, copied as drawn ----
const go = svg(SY.right, 20);
const stk = (words, k, o = {}) => `<span class="btn stk${o.accent ? ' accent' : ''}" role="button">${gi(k, 24)}<span>${words}</span></span>`;
const Xb = `<span class="btn sq" role="button" aria-label="Close" style="border:0;background:transparent">${I.close}</span>`;
const dpick = (words) => `<span class="pk">Designer’s pick</span> ${words}`;
const DRAWN = '<b>Approved 2026-11-21.</b> ';
const FIXED = '<b>Approved 2026-11-21, with one fix, drawn here.</b> ';
const FOLLOWS = '<b>Approved 2026-11-21; picture 3 follows K22h’s fix.</b> ';

// ---- the view's frame on a tablet (page 32's, as approved) ----
const railV = (on, magic = true) => `<div class="rail">${[['crown', 'Player'], ['fire', 'Scene'], ['sack', 'Pack'], ...(magic ? [['moon', 'Magic']] : [])].map(([k, l]) => `<span class="ri${l === on ? ' on' : ''}" role="button" aria-label="${l}">${k === 'moon' ? gi('moon', 24) : sym(k, 24)}</span>`).join('')}</div>`;
const topV = (title = '') => `<div class="vtop"><span class="back" role="link">‹ Players</span><span class="vtt">${title}</span><span class="rt">${ico('note', 'Log')}${ico('mail', 'Messages')}${ico('book', 'Reference')}<span class="ico" role="button" aria-label="More">${I.more}</span></span></div>`;
const vband = (p = 'Sam', c = 'Wren') => `<div class="vband" role="note" aria-label="${p}’s view of ${c}. What you do here is logged as yours."><span>${sym('eye', 24)}</span><span><b>${p}’s view of ${c}</b><small>What you do here is logged as yours.</small></span></div>`;
const vdev = (inner, cap, o = {}) => `<div><p class="cap" style="width:1024px;max-width:1024px">${cap}</p><div class="dev ipad"${o.short ? ' style="min-height:0"' : ''}>${railV('Pack')}<div class="main">${topV('Wren’s pack')}<div class="page">${vband()}${inner}</div></div>${o.extra || ''}</div></div>`;
// the player's own tablet: the player's rail and top row, no band
const pdev = (inner, cap) => `<div><p class="cap" style="width:1024px;max-width:1024px">${cap}</p><div class="dev ipad" style="min-height:0">${railV('Pack')}<div class="main">${topRow('player')}<div class="page">${inner}</div></div></div></div>`;

// ---- the Pack and an item's sheet (page 32, frame M3g) ----
const packList = `<div class="grp"><span class="sclab" style="margin:0">At hand</span><span>2 items</span></div><div class="irow"><span><b>★ Shortbow</b><small>Quiver: Arrows ×18</small></span>${stk('Quiver', 'quiver')}</div><div class="irow"><span><b>Storm lantern</b><small>Unlit. 3 refills left</small></span>${stk('Light', 'torch')}</div>
