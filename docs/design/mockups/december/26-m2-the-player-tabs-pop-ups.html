<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>December: the Player tab’s pop-ups in the book’s format, page M2 (2026-11-19)</title>
<link rel="stylesheet" href="../creation/final/final.css">
<link rel="stylesheet" href="../pack/pk.css">
<link rel="stylesheet" href="../shared/book.css">
<style>
  /* This page's own rules: layout and its own parts only. Type, the book format, the stacked button, the sheet's head,
     the pop-up, the toast and the corners come from shared/book.css and are not restated here. Sizes are the app's
     scale (14, 16, 20, 24, 30, 36, 48); corners 4, 8 and 20. The tab behind the pop-ups is page 25's (M1), with its parts. */
  .tablet.wide { width:1024px; }
  .lab { font-size:14px; color:var(--muted); margin:0 0 var(--space-2); }
  .trio { display:flex; gap:var(--space-4); align-items:flex-start; flex-wrap:wrap; }
  .from { font-size:14px; color:var(--muted); font-style:italic; margin:var(--space-1) 0 0; }
  .dg { display:inline-flex; }
  .go { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; flex:none; }
  .go.r { transform:rotate(-90deg); }
  .go.u { transform:rotate(180deg); }
  .xb { border:0; background:transparent; }
  /* the shell: the menu folded to its rail (mn-1), the two columns */
  .pt-grid { display:grid; grid-template-columns:44px minmax(0,4fr) minmax(0,5fr); gap:var(--space-4); padding:var(--space-3); align-items:start; }
  .pt-grid > .pt-r { border-left:1px solid var(--rule); padding-left:var(--space-4); }
  .pt-rail { display:flex; flex-direction:column; gap:var(--space-2); }
  .pt-rail > span { display:flex; width:44px; height:44px; align-items:center; justify-content:center; border-radius:4px; color:var(--muted); }
  .pt-rail > span.on { color:var(--ink); background:var(--wash); box-shadow:inset 0 0 0 2px var(--accent); }
  /* the head */
  .pt-head { display:flex; gap:var(--space-3); align-items:center; box-sizing:border-box; }
  .pt-head.h96 { height:96px; }
  .pt-av { flex:none; border-radius:50%; border:1.5px solid var(--control); background:var(--surface); display:flex; align-items:center; justify-content:center; overflow:hidden; font-weight:700; box-sizing:border-box; }
  .pt-av.s96 { width:96px; height:96px; font-size:36px; }
  .pt-av.s128 { width:128px; height:128px; font-size:48px; }
  .pt-sts { display:flex; gap:var(--space-2); align-items:center; }
  .pt-sts.wrap { flex-wrap:wrap; }
  .pt-side { display:flex; flex-direction:column; gap:var(--space-2); min-width:0; align-items:flex-start; }
  .pt-phead { display:flex; gap:var(--space-3); align-items:flex-start; }
  .pt-prow { margin-top:var(--space-2); }
  .ps-kind { font-size:20px; font-weight:700; line-height:1.2; overflow-wrap:anywhere; }
  .ps-st { position:relative; display:inline-flex; width:52px; height:52px; align-items:center; justify-content:center; flex:none; }
  .ps-st .arc { position:absolute; inset:0; transform:rotate(-90deg); }
  .ps-st .mid { position:relative; display:inline-flex; }
  .ps-st.more { width:44px; height:44px; border:1.5px solid var(--control); border-radius:50%; font-weight:700; font-size:14px; box-sizing:border-box; }
  .ps-stn { display:inline-flex; align-items:center; gap:var(--space-2); min-height:44px; }
  .ps-stn small { display:block; font-size:14px; color:var(--muted); line-height:1.2; }
  /* the right column's top: as tall as the head, the heading's words at its foot, so the first score boxes start level with hit points */
  .pt-rtop { display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; margin-bottom:var(--space-3); box-sizing:border-box; }
  .pt-rtop.h96 { height:96px; }
  .pt-rtop.end { justify-content:flex-end; }
  .pt-rtop .ps-l { margin:0; width:100%; box-sizing:border-box; }
  /* the notices box (new on this page) */
  .nb { display:inline-flex; align-items:center; gap:var(--space-2); box-sizing:border-box; height:64px; min-width:44px; padding:0 var(--space-3) 0 var(--space-2); border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); color:var(--muted); font-size:16px; line-height:1.2; white-space:nowrap; flex:none; }
  .nb .pch { display:inline-flex; width:44px; height:44px; border-radius:50%; align-items:center; justify-content:center; flex:none; }
  .nb.lit { border:2px solid var(--ink); color:var(--ink); font-weight:700; }
  .nb.lit .pch { background:color-mix(in srgb, var(--glow) 40%, var(--sheet)); box-shadow:0 0 var(--space-2) var(--space-1) color-mix(in srgb, var(--glow) 60%, transparent); }
  .nb.low { height:48px; }
  .nb.low .pch { width:36px; height:36px; }
  /* hit points, the tiles, the weapon, the rows: page 14's parts */
  .ps-l { font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:var(--space-3) 0 var(--space-1); display:flex; align-items:baseline; gap:var(--space-2); }
  .ps-lr { flex-wrap:wrap; align-items:center; justify-content:space-between; row-gap:var(--space-1); }
  .ps-rl { text-transform:none; letter-spacing:0; color:var(--ink); font-size:14px; font-weight:400; display:inline-flex; align-items:center; gap:var(--space-1); }
  .ps-meta { font-size:14px; color:var(--muted); margin:var(--space-1) 0 0; }
  .ps-sl { font-size:14px; color:var(--muted); margin:var(--space-3) 0 var(--space-1); }
  .ps-hp { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:var(--space-2); align-items:center; border:1.5px solid var(--control); border-radius:4px; padding:var(--space-2) var(--space-3); margin-top:var(--space-3); background:var(--sheet); }
  .ps-hp .l { grid-column:1 / -1; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .ps-hp .v { font-size:48px; font-weight:700; line-height:1; }
  .ps-hp .v small { font-size:16px; font-weight:400; color:var(--muted); margin-left:var(--space-1); }
  .ps-hpbar { grid-column:1 / -1; display:flex; gap:var(--space-1); }
  .ps-hpbar > span { flex:1; height:8px; background:var(--rule); border-radius:4px; overflow:hidden; }
  .ps-hpbar > span > i { display:block; height:100%; background:var(--ink); }
  .ps-sq { width:56px; height:56px; padding:0; justify-content:center; }
  .ps-tiles { display:grid; gap:var(--space-2); margin-top:var(--space-2); }
  .ps-tiles.flat { margin-top:0; }
  .ps-tiles.c2 { grid-template-columns:1fr 1fr; }
  .ps-tiles.c3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .ps-tiles.c5 { grid-template-columns:repeat(5,minmax(0,1fr)); }
  .ps-tile { border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); padding:var(--space-2) var(--space-1); text-align:center; min-height:64px; box-sizing:border-box; min-width:0; }
  .ps-tile .k { font-size:14px; color:var(--muted); display:block; overflow-wrap:normal; word-break:normal; hyphens:none; line-height:1.2; }
  .ps-tile .v { font-size:20px; font-weight:700; line-height:1.2; display:block; }
  .ps-tile .c { font-size:14px; color:var(--muted); display:block; line-height:1.2; }
  .ps-tile.big .v { font-size:30px; }
  .ps-wpn { border:2px solid var(--ink); border-radius:4px; background:var(--sheet); padding:var(--space-2) var(--space-3); margin-top:var(--space-2); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--space-1) var(--space-3); align-items:center; }
  .ps-wpn .nm { font-size:20px; font-weight:700; line-height:1.2; overflow-wrap:break-word; }
  .ps-wpn .in { font-size:14px; color:var(--muted); }
  .ps-acts { display:flex; gap:var(--space-2); align-items:center; }
  .ps-wpn .ps-acts:has(.btn.stk + .btn.stk) { grid-column:1 / -1; justify-content:flex-end; }
  .ps-roll { display:flex; gap:var(--space-4); flex-wrap:wrap; grid-column:1 / -1; font-size:20px; }
  .ps-roll span { display:inline-flex; align-items:center; gap:var(--space-1); }
  .ps-roll small { font-size:14px; color:var(--muted); margin-left:var(--space-1); }
  .ps-row { display:flex; align-items:center; gap:var(--space-2); min-height:56px; padding:var(--space-1) 0; border-bottom:1px dotted var(--rule); flex-wrap:wrap; justify-content:flex-end; }
  .ps-row .t { flex:1 1 120px; min-width:120px; min-height:44px; box-sizing:border-box; }
  .ps-row .t b { font-size:20px; line-height:1.2; overflow-wrap:break-word; }
  .ps-row .t small { display:block; font-size:14px; color:var(--muted); line-height:1.25; }
  .ps-row .t small > span { display:inline-flex; align-items:center; gap:var(--space-1); margin-right:var(--space-3); }
  .ps-row .t small > .ql { display:block; margin:0; }
  .ps-row .fig { font-size:20px; font-weight:700; white-space:nowrap; display:inline-flex; align-items:center; gap:var(--space-1); }
  .ps-pin { display:inline-flex; vertical-align:-1px; margin-right:var(--space-1); }
  .ps-dots { display:inline-flex; gap:var(--space-1); vertical-align:middle; margin-right:var(--space-2); }
  .ps-dots i { width:10px; height:10px; border-radius:50%; border:1.5px solid var(--ink); display:inline-block; box-sizing:border-box; }
  .ps-dots i.on { background:var(--ink); }
  .ps-litw { border-bottom:1px dotted var(--rule); padding:var(--space-1) 0 var(--space-2); }
  .ps-lit { display:flex; align-items:center; gap:var(--space-2); min-height:56px; padding:var(--space-1) 0; }
  .ps-lit .t { flex:1; min-width:0; min-height:44px; box-sizing:border-box; }
  .ps-lit .t b { font-size:20px; line-height:1.2; }
  .ps-lit .t small { display:block; font-size:14px; color:var(--muted); line-height:1.25; }
  .ps-kl { display:flex; align-items:center; gap:var(--space-2); min-height:56px; }
  .ps-kl .sp { flex:1; }
  .ps-info { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; color:var(--info); flex:none; }
  .tg { position:relative; display:inline-flex; align-items:center; justify-content:center; width:60px; height:44px; flex:none; }
  .tg .tr { position:relative; width:52px; height:28px; border-radius:999px; border:1.5px solid var(--control); background:var(--sheet); box-sizing:border-box; display:block; }
  .tg .kn { position:absolute; top:1.5px; left:1.5px; width:22px; height:22px; border-radius:50%; background:var(--surface); border:1.5px solid var(--control); box-sizing:border-box; display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .tg.on .tr { background:var(--wash); border:2px solid var(--accent); box-shadow:0 0 var(--space-2) 1px color-mix(in srgb, var(--glow) 60%, transparent); }
  .tg.on .kn { top:1px; left:25px; background:var(--sheet); border:1.5px solid var(--accent); }
  .ps-pair { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
  .ps-card { border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); padding:var(--space-2) var(--space-3); }
  .ps-card b { font-size:24px; display:block; line-height:1.2; }
  .ps-card span { font-size:14px; color:var(--muted); }
  .ps-card .pk-state { margin:0 0 var(--space-2); text-align:left; font-size:20px; }
  .ps-card .pk-of { text-align:left; margin:var(--space-2) 0 0; }
  .ps-boxes { display:flex; gap:var(--space-2); flex-wrap:wrap; }
  .ps-boxes span { border:1.5px solid var(--control); border-radius:4px; min-height:44px; padding:0 var(--space-3); display:inline-flex; align-items:center; background:var(--sheet); }
  /* the level block: one tap, no chevron (tfr-2) */
  .pt-lvl { display:block; min-height:48px; margin-top:var(--space-3); box-sizing:border-box; }
  .pt-lvl small { font-size:14px; color:var(--muted); margin-left:var(--space-2); }
  .pt-lvl.stack small { display:block; margin-left:0; }
  .pt-lvl .co { display:block; font-size:14px; color:var(--muted); margin-top:var(--space-1); }
  .ps-xp { display:block; height:8px; background:var(--rule); border-radius:4px; overflow:hidden; margin-top:var(--space-1); }
  .ps-xp i { display:block; height:100%; background:var(--ink); }
  /* Details: folded to its heading (tfr-1), opened in place */
  .pt-fold { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:44px; margin-top:var(--space-3); }
  .pt-fold .ps-l { margin:0; }
  .pt-det { border-left:3px solid var(--accent); padding:var(--space-1) 0 var(--space-1) var(--space-3); }
  .pt-det p:last-child { margin-bottom:0; }
  /* the rows at the right column's foot, with no heading (tfr-4, tfr-5) */
  .pt-rest { border-top:3px double var(--rule); margin-top:var(--space-3); }
  /* a notice in the sheet */
  .pt-pop { position:absolute; top:calc(var(--space-6) * 6); left:50%; transform:translateX(-50%); width:440px; }
  .sheetup.flow { position:relative; max-height:none; }
  .behind { position:relative; height:52px; overflow:hidden; box-sizing:border-box; }
  .nt-n { font-size:14px; color:var(--muted); margin:0 0 var(--space-3); }
  .nt-t { display:flex; align-items:flex-start; gap:var(--space-2); font-weight:700; font-size:20px; line-height:1.2; margin:0 0 var(--space-2); }
  .nt-t svg { margin-top:2px; }
  .nt-t .dg { margin:0 var(--space-1); vertical-align:-3px; }
  .nt p { margin:0 0 var(--space-2); overflow-wrap:break-word; }
  .nt-act { display:flex; justify-content:flex-end; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-3); }
  .nt-row { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:44px; border-bottom:1px dotted var(--rule); }
  /* ---- page M2's own parts: the pop-ups' layout. The entry's heading, the labelled line, the book's sub-heading and table,
     the small-capitals label, the sheet and the pop-up are the shared stylesheet's and are not restated ---- */
  .pt-pop.hi { top:calc(var(--space-6) * 3); }
  .pu-hd { display:flex; align-items:flex-start; gap:var(--space-2); margin-bottom:var(--space-2); }
  .pu-hd .ehead { flex:1; min-width:0; overflow-wrap:break-word; align-self:center; }
  .pu-hd .fig { font-size:36px; font-weight:700; line-height:44px; flex:none; }
  .pu-b { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; flex:none; }
  .pu-roll { display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; }
  .pu-bare { display:flex; justify-content:flex-end; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-3); }
  .pu-kv { display:flex; justify-content:space-between; align-items:baseline; gap:var(--space-3); margin:0 0 var(--space-1); }
  .pu-kv b { white-space:nowrap; }
  .pu-pair { display:flex; gap:var(--space-3); align-items:flex-start; flex-wrap:wrap; }
  /* the two roll boxes of a weapon (the Attack view's, as built) */
  .pu-rb { border:1.5px solid var(--control); border-radius:4px; background:var(--surface); padding:var(--space-2) var(--space-3); margin-bottom:var(--space-2); }
  .pu-rb .h { display:flex; align-items:center; gap:var(--space-2); font-size:20px; font-weight:700; line-height:1.2; margin-bottom:var(--space-1); }
  /* what can be done, as frame PK8 of pack/08 draws it: a row each, a leading icon */
  .pu-acts { border-top:1px solid var(--rule); margin-top:var(--space-3); }
  .act { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:48px; border-top:1px solid var(--rule); }
  .pu-acts .act:first-child { border-top:0; }
  .act > span:first-child { display:inline-flex; align-items:center; flex:1; }
  .act .li { display:inline-flex; width:24px; color:var(--muted); margin-right:var(--space-2); flex:none; }
  .act .go { transform:rotate(-90deg); }
  /* a form you type in: the box and its buttons one width, centred (as built and approved on 2026-11-19) */
  .pu-fit { width:216px; margin:0 auto; }
  .pu-in { font-size:24px; font-weight:700; min-height:56px; display:flex; align-items:center; }
  .pu-two { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); margin-top:var(--space-2); }
  /* the Portrait pop-up: the circle centred, its buttons under it, ending at one right edge */
  .pu-pp { display:flex; flex-direction:column; align-items:center; gap:var(--space-3); }
  .pu-ppw { display:inline-flex; flex-direction:column; align-items:flex-end; gap:var(--space-2); }
  .pu-ppa { display:flex; gap:var(--space-2); }
  .pu-add { display:flex; align-items:center; justify-content:center; min-height:96px; width:100%; border:1.5px dashed var(--control); border-radius:4px; color:var(--muted); box-sizing:border-box; }
  /* a status: its ring beside its lines */
  .pu-st { display:flex; gap:var(--space-3); align-items:center; margin-bottom:var(--space-3); }
  .pu-st .ps-st { width:84px; height:84px; }
  .pu-st p { margin:0; }
  .pu-st small { font-size:14px; color:var(--muted); }
  /* a note in the Notes pop-up */
  .pu-note { border-bottom:1px dotted var(--rule); padding:var(--space-2) 0; }
  .pu-note p { margin:0; overflow-wrap:break-word; }
  .pu-note small { font-size:14px; color:var(--muted); }
  /* the Quiver's rows: the kind in use by its words, its tick, its wash and its edge */
  .ps-row .btn.q { min-width:104px; flex:none; }
  .ps-row .btn.q.on { background:var(--wash); border-color:var(--accent); font-weight:700; }
  .pu-list .ps-row { flex-wrap:nowrap; }
  .pu-list .ps-row .t { min-width:0; }
  /* a column is never wider than its phone: a long label wraps */
  .trio > div { max-width:343px; }
</style>
</head>
<body>
<script src="../creation/final/final.js"></script>
<script src="../creation/final/sweep.js"></script>
<script src="../pack/pk.js"></script>
<script src="icons/icons.js"></script>
<script src="../shared/book.js"></script>
<script>
// ---- the tab behind the pop-ups: page 25’s parts (M1, approved 2026-11-19), unchanged ----
const d = (n, w = 18) => `<span class="dg" role="img" aria-label="d${n}">${die(n, w)}</span>`;
const chevD = `<span class="go" aria-hidden="true">${I.chev}</span>`;
const chevU = `<span class="go u" aria-hidden="true">${I.chev}</span>`;
const chevR = `<span class="go r" aria-hidden="true">${I.chev}</span>`;
const xBtn = `<span class="btn sq xb" role="button" aria-label="Close">${I.close}</span>`;
const lab = (words) => `<div class="ps-l"><span>${words}</span></div>`;
const LONGN = 'Brannoch Ironhorn of the Seven Cairns, called the Unbowed';

// ---- the portrait: a stand-in picture, or the initial when there is none ----
const FACE = `<svg viewBox="0 0 96 96" width="100%" height="100%" aria-hidden="true"><rect width="96" height="96" fill="var(--surface)"/><path d="M12 96c2-22 16-31 36-31s34 9 36 31z" fill="var(--control)"/><circle cx="48" cy="43" r="19" fill="var(--muted)"/><path d="M32 34c-9-3-14-10-13-20 5 6 11 9 18 10zM64 34c9-3 14-10 13-20-5 6-11 9-18 10z" fill="var(--muted)"/></svg>`;
const av = (size, pic = true, letter = 'B') => `<span class="pt-av s${size}" role="button" aria-label="Portrait: change it">${pic ? FACE : letter}</span>`;

// ---- the status rings (R3-6, ps-5): page 14's ----
const ST_SYM = {
  flame: `<path d="M12 3c1 3 4 4.5 4 8a4 4 0 0 1-8 0c0-1.5.5-2.5 1.2-3.3C9.5 9 10.5 10 11 10.5 11 8 11 5.5 12 3z" ${W}/>`,
  star: `<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.3l6.1-.7z" ${W}/>`,
  stone: `<path d="M7 19l-3-5 2-6 6-3 6 3 2 6-3 5z" ${W}/><path d="M9 13l3-4 3 4" ${W}/>`,
  spiral: `<path d="M12 12a1.5 1.5 0 0 1 3 0 3 3 0 0 1-6 0 4.5 4.5 0 0 1 9 0 6 6 0 0 1-12 0 7.5 7.5 0 0 1 15 0" ${W}/>`,
  drop: `<path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.500 3-7 6-11z" ${W}/>`,
};
const ST_TONE = { light: 'glow', harm: 'danger', boon: 'info', neutral: 'ink' };
const stRing = (k, tone, frac, name, dashed = false, btn = true) => { const size = 52, stroke = 5, col = ST_TONE[tone], r = (size - stroke) / 2, c = 2 * Math.PI * r; return `<span class="ps-st"${btn ? ` role="button" aria-label="${name}: its details"` : ''}><svg class="arc" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--rule)" stroke-width="${stroke}"${dashed ? ' stroke-dasharray="4 5"' : ''}/>${dashed ? '' : `<circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--${col})" stroke-width="${stroke}" stroke-dasharray="${(c * frac).toFixed(1)} ${c.toFixed(1)}"/>`}</svg><span class="mid" style="color:var(--${col})" aria-hidden="true">${svg(ST_SYM[k], 26)}</span></span>`; };
const stMore = (n) => `<span class="ps-st more" role="button" aria-label="${n} more: see every status">+${n}</span>`;

const m2l = tabPop(`M2l. ${NEW} <b>The At hand pop-up for a weapon in hand</b> (tfh-1, tfh-2, tfh-4). Ruled: the weapon’s name and its “Attack” open this same pop-up; it holds the two roll boxes and the qualities, then “Give to…”, “Put in…”, “Hide from At hand” and “Drop”, drawn as frame PK8 of the Pack tab draws a thing’s pop-up; <b>no slot, hands, value or weight</b> (his picture 7 shows the rows that go). <b>The pin star always shows on a weapon in hand, beside the ✕</b>, empty here (not pinned), with “Hide from At hand” on the same pop-up. <b>As drawn, and not named on its own in his approval:</b> all of the Attack view stays (the plan’s question 17): the rows under each roll, each part with its figure (his picture 8, “the desired screen”), and where a weapon has them its range, a magic weapon’s notes, what it inflicts and “Fire one” (frame M2m). The line “Rolling the attack here comes with the fight rules, later.” is gone (tfw-3). “Qualities” is a labelled line of the book; the rows that lead on carry their chevron and PK8’s icons. <b>“Hide from At hand” has its icon</b> (his fix of 2026-11-19: one from the set, like the rows beside it): none was picked for it before, so it is drawn with <b>the set’s “Dismiss” mark</b> (st-8), the one already picked for putting a thing out of view: <b>the Studio’s choice of mark, his to change.</b> It has no chevron (it happens on the tap); “Drop” is drawn as PK8 draws it.`, swordPop(false), 'Longsword', { hi: true, h: 800 });

// ---- the Quiver (tfh-6) ----
const qrow = (name, sub, on, word = 'In use ✓') => `<div class="ps-row"><span class="t"><b>${name}</b><small>${sub}</small></span><span class="btn q${on ? ' on' : ''}" role="button" aria-pressed="${!!on}">${on ? word : 'Pick'}</span></div>`;
const quiver = (rows, title = 'Quiver') => `${hd(title)}<div class="pu-list">${rows}</div>`;
const Q2 = (word) => `${qrow('Arrows', '18 in the pack, 1d6', true, word)}${qrow('Silvered arrows', '6 in the pack, 1d6, loses its silver once fired', false)}`;
const m2o = frame3(`M2o. ${NEW} <b>The Quiver</b> (tfh-6; band 3: the red heading, its own buttons, no “Got it”). Ruled: it lists <b>only the kinds the character carries</b>; the lines “What the Shortbow fires. Each shot uses one.” and “Out of a kind: it leaves the quiver and the pack.” are gone (his picture 10); with none carried, one line says so. A pick closes the pop-up, as built. <b>The word on the kind in use: “Picked ✓”, approved 2026-11-19.</b> <b>(A), not picked: “In use ✓”</b>, the word the option sketch invented. <b>(B), approved 2026-11-19: “Picked ✓”</b>, the word the built Quiver has today and the one a picked row has everywhere else in the app. Either way the kind in use is told by its words and tick as well as its wash and edge, never by colour alone, and it stays a button: a tap on it leaves it as it is. <b>The empty line’s words:</b> “Nothing to fire in your pack.”, after the built “Nothing to light in your pack.”; the pop-up then closes with the ✕ alone. <b>Fifth:</b> a long kind’s name wraps beside its button, with 999 and 1 in the pack. <b>Sixth:</b> the same pop-up for another mode that draws from a stack, a sling’s “Pouch”. A grip and a stance list no stack and do not change.`,
  [psheet('One kind carried, in use', quiver(qrow('Arrows', '18 in the pack, 1d6', true, 'Picked ✓'))), psheet('(A) Several kinds: “In use ✓” (not picked)', quiver(Q2('In use ✓'))), psheet('(B) Several kinds: “Picked ✓” (approved)', quiver(Q2('Picked ✓'))), psheet('None carried', quiver('<p>Nothing to fire in your pack.</p>')), psheet('Long names, 999 and 1', quiver(`${qrow('Fire-hardened fen-reed arrows of the Long Causeway', '999 in the pack, 1d6', false)}${qrow('Whistling arrow', '1 in the pack, 1d4, heard a mile off', true, 'Picked ✓')}`)), psheet('A sling’s “Pouch”', quiver(`${qrow('Sling stones', '40 in the pack, 1d4', true, 'Picked ✓')}${qrow('Lead bullets', '12 in the pack, 1d6', false)}`, 'Pouch'))]);
