<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>December: the town, whole (2026-11-14): sitting 1, what the port meet-up needs</title>
<link rel="stylesheet" href="../creation/final/final.css">
<link rel="stylesheet" href="../scene/scene.css">
<link rel="stylesheet" href="../scene/scene-seq.css">
<link rel="stylesheet" href="december.css">
<link rel="stylesheet" href="../shared/book.css">
<style>
  /* this page's own rules: layout and its own parts only. Type, the book format, the stacked button, the sheet's head,
     the toast and the corners come from ../shared/book.css and are not restated here. */
  .lbl { font-size:14px; color:var(--muted); margin:var(--space-3) 0 var(--space-2); }
  .rem { justify-content:center; } .rem .gap { display:none; }
  .phone .rem .step .nm { display:none; }
  .dcap { display:inline-flex; align-items:center; gap:var(--space-1); font-size:16px; margin-right:var(--space-2); vertical-align:bottom; }
  .dcap svg { color:var(--muted); flex:none; }
  .phone .dcap { font-size:14px; }
  .two19 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--space-4); align-items:start; }
  .four19 { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--space-3); align-items:start; }
  .four19 .pcard { padding:var(--space-3); }
  /* page 11's place page: its rows' layout */
  .psee { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--space-2) var(--space-3); align-items:center; min-height:44px; margin-top:var(--space-2); }
  .pce { display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:var(--space-3); align-items:center; min-height:52px; border-bottom:1px dotted var(--rule); padding:var(--space-1) 0; }
  .pce small { display:block; font-size:14px; color:var(--muted); }
  .adders { display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-2); }
  .tfour { display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--space-1) var(--space-3); margin-top:var(--space-3); }
  .chk { min-height:44px; display:flex; align-items:center; }
  .gtrow { display:grid; grid-template-columns:minmax(0,1fr) 44px 28px; gap:var(--space-2); align-items:center; min-height:52px; border-top:1px dotted var(--rule); border-bottom:1px dotted var(--rule); margin-top:var(--space-2); }
  .gtrow small { display:block; font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* the top's tile, from page 16 (reference only: its design is page 16's) */
  .sm { position:relative; min-height:96px; border:1.5px solid var(--control); border-radius:4px; box-sizing:border-box; background:linear-gradient(to bottom right, transparent calc(50% - 1px), var(--control) calc(50% - 1px), var(--control) calc(50% + 1px), transparent calc(50% + 1px)), var(--sheet); }
  .sm .h { position:absolute; inset:0; }
  .sm .c { position:absolute; inset:0; padding:var(--space-2); display:flex; flex-direction:column; gap:2px; box-sizing:border-box; color:var(--muted); font-size:14px; }
  .sm .day .c { clip-path:polygon(0 0, 100% 0, 0 100%); align-items:flex-start; }
  .sm .night .c { clip-path:polygon(100% 0, 100% 100%, 0 100%); align-items:flex-end; justify-content:flex-end; }
  .sm .ics { display:inline-flex; align-items:flex-end; gap:2px; }
  .sm .h.on .c { color:var(--ink); font-weight:700; background:color-mix(in srgb, var(--glow) 22%, var(--sheet)); box-shadow:inset 0 0 0 2px var(--accent); }
  /* the phone */
  .phone .pcard { margin-top:var(--space-3); padding:var(--space-3); }
  .phfacts { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--space-2); margin-top:var(--space-2); }
  .phfacts .fact { padding-left:var(--space-2); padding-right:var(--space-2); column-gap:var(--space-2); }
  .phfacts .fact .v { font-size:16px !important; white-space:nowrap; }
  .phfacts .sm { min-height:96px; }
  .phfacts .fact .k { white-space:nowrap; }
  .phfacts .fact:last-child .k { letter-spacing:0 !important; }
  .facts.c3 { display:flex; justify-content:center; }
  .facts.c3 > * { flex:0 0 calc((100% - 3 * var(--space-3)) / 4); }
  .bk th { white-space:nowrap; }
  .phfoot { border-top:1px solid var(--rule); padding:var(--space-2) var(--space-3); background:var(--sheet); }
  .pill19 { display:inline-flex; align-items:center; gap:var(--space-1); border:1.5px solid var(--warn); color:var(--warn); border-radius:4px; padding:0 var(--space-2); min-height:28px; font-size:14px; font-weight:700; }
  .sk19 { display:block; height:16px; border-radius:4px; background:var(--rule); margin:var(--space-2) 0; }
  .step19 { font-size:14px; color:var(--muted); margin:0 0 var(--space-2); }
  .tag19 { display:inline-block; font-size:14px; font-weight:700; border:1.5px solid var(--ink); border-radius:4px; padding:0 var(--space-1); line-height:20px; margin-left:var(--space-2); }
  .tgrow .side .btn.stk { min-width:72px; }
  .three19 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:var(--space-4); align-items:start; }
  .bk tr.sel td { background:var(--wash); font-weight:700; }
  .bk td small { display:block; font-size:14px; color:var(--muted); font-weight:400; }
  .big19 { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); margin:var(--space-3) 0; }
  .big19 .btn.stk { min-height:88px; font-size:20px; }
  /* the smaller stock row, in variations (frame TW8e) */
  .v19 { grid-template-columns:minmax(0,1fr) auto; align-items:center; min-height:52px; }
  .v19.ph { grid-template-columns:minmax(0,1fr); row-gap:0; }
  .v19 .vg { display:grid; grid-auto-flow:column; align-items:center; justify-items:end; justify-self:end; column-gap:var(--space-2); }
  .v19.ph .vg { column-gap:var(--space-1); }
  .v19.v1 .vg { grid-template-columns:84px 44px 112px 60px; }
  .v19.v2 .vg { grid-template-columns:112px 112px 60px; }
  .v19.v3 .vg, .v19.v4 .vg { grid-template-columns:84px 112px 60px; }
  .v19.v1.ph .vg { grid-template-columns:70px 44px 116px 60px; }
  .v19 .ch, .v19 .hd19 { white-space:nowrap; }
  .v19.hd { min-height:0; padding:0 0 2px; }
  .v19 .hd19 { font-size:14px; color:var(--muted); }
  .dbtn { gap:1px; padding:0; }
  .chip19 { display:inline-flex; align-items:center; gap:var(--space-1); min-height:44px; padding:0 var(--space-2); border:1.5px solid var(--control); border-radius:4px; box-sizing:border-box; white-space:nowrap; background:var(--sheet); }
  .chip19.on, .dbtn.on { background:var(--wash); border-color:var(--accent); }
  .tg.mid .kn { left:13.5px; font-size:14px; font-weight:700; }
  .vh19 { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:44px; margin-bottom:var(--space-2); }
  .vh19 h2 { margin:0; }
  .vh19.ph { flex-wrap:wrap; justify-content:flex-end; }
  .vh19.ph h2 { flex:1 0 100%; }
  /* the stock row Francis picked (4): Chance, Price, Stocked? at the right; the three-position toggle */
  .s4 { grid-template-columns:minmax(0,1fr) auto; align-items:center; min-height:52px; }
  .pbx.onsheet { border:0; background:none; padding:0; margin:0; }
  .pbx.onsheet .pbr + .pbr { margin-top:var(--space-2); }
  .s4.n375 { grid-template-columns:minmax(0,1fr); row-gap:0; }
  .s4 .g4 { display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:0 var(--space-2); justify-self:end; }
  .s4 .p4 { display:flex; align-items:center; gap:var(--space-2); }
  .s4.n375 .g4, .s4.n375 .p4 { column-gap:var(--space-1); }
  .s4 .c4, .s4 .pr4, .s4 .sh4 { display:flex; justify-content:flex-end; align-items:center; white-space:nowrap; }
  .s4 .c4 { width:84px; gap:var(--space-1); }
  .s4 .pr4 { width:112px; }
  .s4 .sh4 { width:60px; }
  .s4 .c4.w { width:auto; min-width:84px; max-width:150px; white-space:normal; text-align:right; }
  .s4 .c4.two { flex-direction:column; align-items:flex-end; gap:0; }
  .s4 .c4 .fg { display:flex; align-items:center; gap:var(--space-1); }
  .q4 { font-size:14px; color:var(--muted); margin:var(--space-3) 0 var(--space-1); }
  .s4.hd { min-height:0; padding:0 0 2px; }
  .s4 .hd19 { font-size:14px; color:var(--muted); }
  .tg.t3 .hit { position:absolute; top:0; right:50%; width:44px; height:44px; }
  .tg.t3 .hit.r { right:auto; left:50%; }
  .showhit .tg.t3 .hit { outline:1.5px dashed var(--muted); outline-offset:-1px; }
  /* Larger text, simulated: the app multiplies every text size by 1.25 and leaves targets as they are */
  .lt19 .s4 { font-size:20px; }
  .lt19 .s4 .price { font-size:25px; }
  .lt19 .s4 .hd19 { font-size:17.5px; }
  .lt19 h2.bsub { font-size:25px; }
  .lt19 .btn.stk { font-size:20px; }
  .lt19 .s4 .c4 { width:108px; }
  .lt19 .s4 .pr4 { width:142px; }
  .lt19 .s4 .sh4 { width:84px; }
  .lt19 .s4 .p4 .tg { margin-left:24px; }
  /* the stock as the book's table (tn-5): the table itself is the shared file's; here only its columns' layout and its form at 375 px */
  .st19 .pr, .st19 th { white-space:nowrap; }
  .st19 td { height:44px; }
  .st19 .tgc { width:60px; text-align:right; }
  .st19 .cutc { color:var(--muted); }
  .ask19 { display:inline-flex; align-items:center; gap:var(--space-2); }
  .wb:has(.ask19) { justify-content:flex-end; align-items:center; gap:var(--space-4); }
  .dv { display:inline-flex; align-items:center; gap:var(--space-1); white-space:nowrap; }
  .n375 .st19 { --stack-cols:minmax(0,1fr) 104px 76px; }
  .n375 .st19 .av { grid-column:1; grid-row:2; }
  .n375 .st19 .pr { grid-column:2; grid-row:2; }
  .n375 .st19 .tgc { grid-column:3; grid-row:2; width:auto; justify-content:flex-end; }
  .n375 .st19 tr.lg .av { grid-column:1 / -1; border-bottom:0; }
  .n375 .st19 tr.lg .pr, .n375 .st19 tr.lg .tgc { grid-row:3; }
  .n375 .st19 tr.lg .pr { grid-column:1 / 3; justify-content:flex-end; }
  .n375 .st19 tr.lg td.av:empty { display:none; }
  .lt19 .bk, .lt19 .bk caption { font-size:20px; }
  .lt19 .bk th { font-size:17.5px; }
  .lt19 .n375 .st19 { --stack-cols:minmax(0,1fr) 124px 100px; }
  /* measured sizes (t44-1): "Edit piece" is as tall as a target; 8 px between a button and the row under it */
  .pce > [role="button"] { min-height:44px; align-content:center; }
  .hrow:has(> .btn.stk) { margin-bottom:var(--space-2); }
  .pce[role="alert"] { margin-bottom:var(--space-1); }
  .quote19 { border-left:3px solid var(--rule); padding-left:var(--space-3); margin:0 0 var(--space-2); }
</style>
</head>
<body>
<script src="../creation/final/final.js"></script>
<script src="../scene/scene.js"></script>
<script src="../scene/scene-seq.js"></script>
<script src="december.js"></script>
<script src="icons/icons.js"></script>
<script src="strip.js"></script>
<script src="../shared/book.js"></script>
<script>
// ---- the parts of pages 11, 03, 05 and 16, as those pages wrote them ----
const go = svg(SY.right, 20);
const sep = svg(SY.right, 16);
const down = svg('<path d="M6 9l6 6 6-6" ' + W + '/>', 20);
const stk = (words, k, o = {}) => `<span class="btn stk${o.accent ? ' accent' : ''}" role="button">${o.sym ? sym(k, 24) : gi(k, 24)}<span>${words}</span></span>`;
const undoT = `<span class="tu" role="button">${gi('anticlockwise-rotation', 20)}Undo</span>`;
const toast = (words, extra = '') => `<div class="toastb" role="status"><span class="tmsg"${extra ? ' style="flex:1 0 100%"' : ''}>${words}</span>${extra}${undoT}<span class="tb" aria-hidden="true"></span></div>`;
const ruleBtn = (k, words) => `<span class="btn big sqb" role="button" aria-label="${words}">${gi(k, 34)}</span>`;
const STEPS5 = [['trumpet', 'Describe'], ['ball', 'Question'], ['sword-brandish', 'Act'], ['wizard', 'Test'], ['chest', 'Resolve']].map(([k, n]) => remStep(gi(k, 32), n, false));
const stripRow = remRow('Sequence of play', STEPS5);
const dl = (date, rest = '', season = 'sprout') => `<span class="dcap">${season ? gi(season, 18) : ''}${date}</span>${rest}`;
const TDATE = dl('12 Reedmonth, spring', 'Morning.');
const moreB = `<span class="btn sq" role="button" aria-label="More">${I.more}</span>`;
const smTile = (read) => `<div class="sm" role="group" aria-label="When the town’s encounter checks run">${[['day', 'heraldic-sun', 'seagull', 'By day', true], ['night', 'moon', 'fluffy-cloud', 'By night', false]].map(([k, a, a2, w, on]) => `<span class="h ${k}${on ? ' on' : ''}"><span class="c"${read ? '' : ` role="button" aria-pressed="${on}"`}><span class="ics">${k === 'day' ? gi(a, 30) + gi(a2, 18) : gi(a2, 18) + gi(a, 30)}</span><span>${on ? sym('check', 16) : ''}${w}</span></span></span>`).join('')}</div>`;
const F_W = fact('weather', 'Weather', 'Fair', 'Dry.');
const F_D = fact('clock', 'Part of the day', 'Morning', 'Afternoon comes next.');
const F_E = fact('encounter', 'Encounter check', 'By day', `<span class="die" role="img" aria-label="Die">${die(6, 16)}</span>1 in 6`);
const gmTop = `${band({ over: 'Session 1. In town.', title: 'Reedmouth, day 1', ident: TDATE, acts: [b('Advance time', { big: true }).replace('>Advance time<', '>' + gi('hourglass', 24) + 'Advance time<'), b('Depart', { big: true, accent: true }).replace('>Depart<', '>' + gi('journey', 24) + 'Depart<'), moreB] })}<hr class="dbl"><div class="facts c3">${F_W}${F_D}${smTile(false)}</div>${stripRow}`;
const plTop = `${band({ over: 'Session 1. In town.', title: 'Reedmouth, day 1', ident: TDATE, acts: [] })}<hr class="dbl"><div class="facts c3">${F_W}${F_D}${smTile(true)}</div>${stripRow}`;
const bandOnly = (role) => `${band({ over: 'Session 1. In town.', title: 'Reedmouth, day 1', ident: TDATE, acts: role === 'gm' ? [b('Advance time', { big: true }).replace('>Advance time<', '>' + gi('hourglass', 24) + 'Advance time<'), moreB] : [] })}<hr class="dbl">`;
const seen = (name) => `<div class="psee"><span>Players see: <b>${name}</b></span>${stk('Rename', 'quill-ink')}</div>`;
const pieceRow = (kind, text, shown, gm = '') => `<div class="pce"><div role="button" aria-label="Edit piece: ${text}"><span class="lbk">${kind}.</span>${text}${gm ? `<small>${gm}</small>` : ''}</div>${eyeBtn(shown)}</div>`;
const notes = (first) => `<div class="spot" role="button" aria-expanded="false" style="border-top:1px dotted var(--rule);margin-top:var(--space-3)"><span><b>Notes</b>${first ? `<small>${first}</small>` : ''}</span><span class="ctl">${down}</span></div>`;
const gmOnly = `<span role="img" aria-label="Only for you: never sent" style="display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;flex:none">${sym('eyeoff', 24)}</span>`;
const tfold = (name, eye) => `<div class="spot" role="button" aria-expanded="false"><span><b>${name}</b></span><span class="ctl">${eye === 'never' ? gmOnly : eyeBtn(!!eye)}${down}</span></div>`;
const todo = (name, fold) => `<div class="spot"${fold ? ' role="button" aria-expanded="false"' : ''}><span><b style="font-weight:400">${name}</b></span><span class="ctl">${fold ? down : ''}</span></div>`;
const hd = (t, right = '') => `<div class="hrow" style="margin-top:var(--space-3)"><h2>${t}</h2>${right}</div>`;
const callsRow = `<span class="btn" role="button" style="display:flex;justify-content:space-between;width:100%;margin-top:var(--space-2)"><span style="display:inline-flex;gap:var(--space-2);align-items:center">${gi('stabbed-note', 20)}Calls to adventure</span><span class="meta" style="white-space:nowrap">6 of 17 sent</span></span>`;
const bookRow = `<div class="gtrow" role="button" aria-expanded="false"><span><b>From the book, for the GM</b><small>Reedmouth stands where the river forgets itself among the reeds…</small></span>${gmOnly}${down}</div>`;
const townHead = (acts, gm = true) => `<div class="crumb">${gm ? '<a class="x">The Reedmere</a>' : '<span>The Reedmere</span>'}${sep}<b>Reedmouth</b></div><div class="band"><div><h3 class="display">Reedmouth</h3><p class="ident">A river town of reed-cutters and ferrymen${gm ? ', held by the Heron Wardens' : ''}.</p></div><div class="acts two">${acts}</div></div>`;
const PLACES = [['1 The Lantern Chapel', 'A squat stone chapel with a brass lantern over its door.', true], ['2 Wardens’ Hall', 'On stilts above the flood line.', true], ['3 The Reed Market', 'Open stalls under a thatched roof, loud until noon.', true], ['4 The Eel and Lantern (inn)', 'Three storeys of tarred timber over the quay.', true], ['5 Hob Tanner’s (bladesmith)', 'A forge that never seems to go out. <b>Closed today.</b>', false]];
const placesGm = (list = PLACES) => list.map(([n, l, s]) => spot(n, l, s)).join('');
const watchBox = `<div class="pbx gm"><div class="pbr"><div><h5>The town watch</h5><p>Six Wardens with poles and nets.</p><p><b>Arrival on the scene:</b> ${dieMark(6, 16)}2d6 rounds after a cry is raised.</p><p><b>In a fight:</b> <a class="x">Heron Warden</a>.</p></div>${gmOnly}</div></div>`;
const asideBox = `<div class="pbx gm"><div class="pbr"><div><h5>If the party asks after the ferrymen</h5><p>They have not been paid this season and will say so to anyone who buys a round.</p></div>${gmOnly}</div></div>`;
const townCardA = (ph) => `<div class="pcard">${townHead(ruleBtn('helm', 'The watch, and trouble in town') + (ph ? '' : b('Move on', { big: true, icon: 'travel' })))}
  ${bookRow}${seen('Reedmouth')}
  <div class="two">${b('Knowledge', { icon: 'book' })}${b('Rules', { icon: 'scales' })}</div>${callsRow}
  <div class="tfour"><b>Inhabitants</b><span>1,100 (a small town).</span><b>Ruler</b><span><a class="x">Warden Halewyn</a>, for the <a class="x">Heron Wardens</a>.</span><b>Religion</b><span><a class="x">The Lantern rite</a>.</span><b>Overview</b><span>Safe. Living: Comfortable, 2 herons a day.</span></div>
  ${hd('About the town')}${tfold('The town', true)}${tfold('The Wardens’ grip', false)}${tfold('A brewing trouble', 'never')}
  ${hd('Tables')}${dieRow('Encounters in town, by day', 'd6')}${dieRow('What the locals look like', 'd6')}
  ${watchBox}</div>`;
const townCardB = (short) => `<div class="pcard">${hd('Places in town', `<span class="meta">4 of 13 shown</span>${stk('Hide all', 'eyeshut', { sym: true })}`)}${placesGm(short ? PLACES.slice(0, 3) : PLACES)}<div class="meta" style="margin-top:var(--space-2)">${short ? 10 : 8} more places. <a class="x">Show all 13</a></div>
  ${hd('Things to do')}${todo('Hear the criers at the Reed Market', true)}${todo('Carouse at the Eel and Lantern', true)}${todo('Pay the Wardens’ toll', false)}
  ${hd('Encounters')}<div class="chk">${dz('Encounters in town, 1 in 6, by day.')}</div>
  ${hd('Pieces', `<span class="meta">1 of 2 shown</span>${stk('Hide all', 'eyeshut', { sym: true })}`)}${pieceRow('Description', 'Smoke over reed roofs; a bell at the water gate.', true)}${pieceRow('Clue', 'New tar on the Wardens’ boats: they mean to sail.', false)}<div class="adders">${stk('+ Piece', 'jigsaw-piece')}${stk('+ Picture', 'easel')}</div>
  ${notes('Halewyn owes the ferrymen a season’s pay.')}
  ${asideBox}
  <p class="source">Town. From your adventure: The Reed Marches.</p></div>`;
const tg4 = (st, name) => `<span class="tg t3${st === 'in' ? ' on' : st === '?' ? ' mid' : ''}" role="radiogroup" aria-label="${name}, stocked today${st === '?' ? ': not decided' : ''}"><span class="hit" role="radio" aria-checked="${st === 'out'}" aria-label="Not in stock"></span><span class="hit r" role="radio" aria-checked="${st === 'in'}" aria-label="In stock"></span><span class="tr"><span class="kn">${st === '?' ? '?' : svg(st === 'in' ? SY.check : '<path d="M7 7l10 10M17 7L7 17" ' + W + '/>', 14)}</span></span></span>`;
const avCell = (a) => { const m = /in-(\d+)$/.exec(a); return m ? `<span class="dv">${dieMark(Number(m[1]), 16)}${a}</span>` : a; };
const askWait = (thing, av) => waitCard('sack', `Wren asks for: ${thing}`, `At 3 The Reed Market.${av ? ' ' + avCell(av) : ''}`, [stk('Price…', 'two-coins'), `<span class="ask19">Stocked?${tg4('?', thing)}</span>`]);
const askCard = `<div class="pcard"><div class="hrow" style="min-height:0;margin-bottom:var(--space-2)"><h2>Waiting for you</h2></div>${askWait('a coil of rope', '4-in-6')}</div>`;
const townMap = (tools) => `<div class="pcard" aria-label="The map">${mapOpen(cityMap(), '', { cls: 'fitw', bare: true }).replace('class="mapopen', 'style="margin-top:0" class="mapopen')}${tools}</div>`;

// ---- TW1 ----
const tw1 = ipad('gm', `${gmTop}<div class="cols2 bktown"><div>${townCardA()}</div><div class="stack">${askCard}${townMap(mapTools(eyeBtn(false)))}${partyOrder(false, true)}</div></div>`,
