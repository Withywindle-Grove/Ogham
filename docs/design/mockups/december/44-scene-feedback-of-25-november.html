<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>December: page 44, the Scene feedback of 25 November (proposals, not approved)</title>
<link rel="stylesheet" href="../creation/final/final.css">
<link rel="stylesheet" href="../scene/scene.css">
<link rel="stylesheet" href="../scene/scene-seq.css">
<link rel="stylesheet" href="december.css">
<link rel="stylesheet" href="../shared/book.css">
<style>
  /* This page's own rules. Type, the book format, the stacked button, the sheet's title, the pop-up, the tapped table and
     the corners come from ../shared/book.css and are not restated here. */
  /* (1) copied as they stand from page 24 (and through it pages 04, 12, 16, 18 and 23): the layout of the parts reused here */
  .lbl { font-size:14px; color:var(--muted); margin:0 0 var(--space-2); }
  .rem { justify-content:center; } .rem .gap { display:none; }
  .phone .rem .step .nm { display:none; }
  .ibs { display:inline-flex; gap:var(--space-2); }
  .btn.sq.ib { padding:6px; }
  .dcap { display:inline-flex; align-items:center; gap:var(--space-1); font-size:16px; letter-spacing:.04em; margin-right:var(--space-2); vertical-align:bottom; }
  .dcap svg { color:var(--muted); flex:none; }
  .phone .dcap { font-size:14px; }
  .phband { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--space-2); align-items:center; margin-top:var(--space-1); }
  .phibs { display:flex; gap:var(--space-2); margin-top:var(--space-2); }
  .four { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--space-4); align-items:start; }
  .mseq { font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .mx { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; flex:none; }
  .flab { display:block; font-size:14px; color:var(--muted); margin:var(--space-3) 0 var(--space-1); }
  .wait .wb { grid-column:1 / -1; align-items:stretch; }
  .bk td:first-child, .bk th:first-child { width:96px; }
  .phone .pdest { grid-template-columns:auto minmax(0,1fr); }
  .phone .pdest .modes { grid-column:1 / -1; justify-content:flex-start; }
  .phone .pcard { margin-top:var(--space-3); padding:var(--space-3); }
  .pdest .modes .btn.stk { width:auto; }
  .pdest .ot b { overflow-wrap:break-word; word-break:normal; }
  .dev .band .acts .btn.sq { width:52px; min-height:52px; }
  .maptools .btn.sq { height:44px; padding:0; }
  .kw22 { font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  .inforce .own22 { display:block; margin-top:var(--space-1); }
  .pk23 { display:flex; align-items:center; gap:var(--space-2); min-height:44px; border-bottom:1px dotted var(--rule); }
  .due23 { display:flex; align-items:center; gap:var(--space-1); font-size:14px; font-weight:700; margin-top:var(--space-1); }
  .shown23 p { margin:var(--space-2) 0 0; }
  .phs23 { display:grid; grid-auto-flow:column; grid-auto-columns:343px; gap:var(--space-4) var(--space-6); align-items:start; }
  .behind { position:relative; height:52px; overflow:hidden; box-sizing:border-box; }
  .sheetup.flow { position:relative; max-height:none; }
  /* (2) new on this page */
  .fr44 { margin:0 0 var(--space-6); }
  .fr44 > .cap { font-size:14px; }
  /* the pop-up's head: its title (or an entry's name) and the X on one line */
  .pu44 { display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:var(--space-2); align-items:center; margin-bottom:var(--space-2); }
  .pu44 .ehead, .pu44 .sheet-title { overflow-wrap:break-word; min-width:0; }
  .popb.w44 { width:440px; }
  .popb.w72 { width:640px; max-width:720px; }
  .phone .popb.w44, .popb.ph44 { width:auto; max-width:none; }
  /* a pop-up centred over a dimmed screen */
  .pc44 { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:var(--space-4); box-sizing:border-box; }
  /* tiles centred: each keeps a quarter of the row (two across on a phone) */
  .facts.c44 { display:flex; flex-wrap:wrap; justify-content:center; }
  .facts.c44 .fact { flex:0 0 calc((100% - 3 * var(--space-3)) / 4); }
  .phone .facts.c44 { gap:var(--space-2); margin-top:var(--space-2); }
  .phone .facts.c44 .fact { flex:0 0 calc((100% - var(--space-2)) / 2); padding-left:var(--space-2); padding-right:var(--space-2); column-gap:var(--space-2); }
  .phone .facts.c44 .fact .v { font-size:16px !important; white-space:nowrap; }
  .phone .facts.c44 .fact .k { white-space:nowrap; letter-spacing:0 !important; }
  .phone .facts.c44 .fact .fi svg { width:20px; height:20px; }
  .phone .facts.c44 .fact:last-child .v { font-size:14px !important; }
  .phone .two.pp44 { grid-template-columns:minmax(0,1fr); }
  /* the encounter's one card: the icon and what was rolled on the first line, the rest across the card */
  .wait.e44 .wi { grid-row:1; }
  .wait.e44 > .all { grid-column:1 / -1; }
  .shown44 { display:flex; align-items:center; gap:var(--space-2); font-size:14px; margin-top:var(--space-2); }
  /* the detail row: a name the pack links, with its stat line or its rule's first words; the whole row is the tap */
  .dt44 { display:grid; grid-template-columns:minmax(0,1fr) 20px; gap:var(--space-2); align-items:center; min-height:44px; padding:var(--space-2) var(--space-3); border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); margin-top:var(--space-2); box-sizing:border-box; }
  .dt44 .nm { font-weight:700; }
  .dt44 .st { display:block; font-size:14px; line-height:1.4; overflow-wrap:break-word; }
  .pr44 { margin-right:var(--space-2); }
  .gm44 { display:block; font-size:14px; color:var(--muted); margin-top:var(--space-2); }
  .dot44 { border:0; border-top:1px dotted var(--rule); margin:var(--space-2) 0; }
  /* the fold "From the book, for the GM": its head is one row, with no eye */
  .fb44 { display:grid; grid-template-columns:minmax(0,1fr) 44px; align-items:center; min-height:44px; border-top:1px dotted var(--rule); border-bottom:1px dotted var(--rule); margin-top:var(--space-3); }
  .fb44 b { display:block; }
  .fb44 small { display:block; font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fbb44 { padding:var(--space-3) 0; border-bottom:1px dotted var(--rule); }
  /* a piece with an arrow before its eye */
  .piece.ar44 { grid-template-columns:minmax(0,1fr) 44px 44px; gap:var(--space-2); }
  .piece > .un44 { grid-column:1 / -1; margin-top:calc(-1 * var(--space-2)); }
  .un44 .gm44:first-child { margin-top:0; }
  .sent44 { display:flex; align-items:center; gap:var(--space-1); font-size:14px; margin-top:var(--space-1); }
  /* the Depart list: the group's head with its fold square; the back row; the search field's label */
  .gh44 { display:grid; grid-template-columns:minmax(0,1fr) auto 44px; gap:var(--space-2); align-items:center; min-height:52px; border-bottom:1.5px solid var(--ink); margin-top:var(--space-3); }
  .gh44 .sclab { margin:0; }
  .gh44 .btn.sq { width:44px; }
  .pk23 .ar { margin-left:auto; color:var(--muted); font-size:14px; }
  .back44 { display:inline-flex; align-items:center; gap:var(--space-1); min-height:44px; padding:0 var(--space-3) 0 var(--space-2); border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); margin-bottom:var(--space-2); }
  .ind44 { padding-left:var(--space-5); }
  /* "Where to?": an Area's name over its rows */
  .ah44 { margin:var(--space-3) 0 0; }
  .ah44:first-child { margin-top:0; }
  /* the Move on pop-up's foot: Back at the left, Move at the right */
  .mf44 { display:flex; justify-content:space-between; gap:var(--space-2); margin-top:var(--space-4); }
  /* the Edit piece form */
  .fld44 { margin:0 0 var(--space-3); }
  .fld44 .fl { display:block; font-weight:700; margin-bottom:var(--space-1); }
  .fld44 .field.area { min-height:96px; }
  .kind44 { display:grid; grid-template-columns:auto minmax(0,1fr) 20px; gap:var(--space-3); align-items:center; min-height:44px; padding:0 var(--space-3); border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); }
  /* the encounter tables page */
  .chips44 { display:flex; flex-wrap:wrap; gap:var(--space-2); margin:var(--space-2) 0 var(--space-3); }
  .tp44 { max-width:640px; }
  .tt .tr { grid-template-columns:4.6em minmax(0,1fr) 24px; }
  ol.q44 { font-size:16px; max-width:760px; padding-left:var(--space-5); color:var(--ink); }
  ol.q44 li { margin-bottom:var(--space-2); }
  .note.big { font-size:16px; color:var(--ink); max-width:760px; }
  /* the critique: its score table and its numbered findings, as pages 40 and 42 have them */
  ol.crit { font-size:16px; max-width:760px; padding-left:var(--space-5); color:var(--ink); }
  ol.crit li { margin-bottom:var(--space-2); }
  table.sc { border-collapse:collapse; font-size:14px; max-width:760px; margin:var(--space-2) 0 var(--space-4); color:var(--ink); }
  table.sc td, table.sc th { border:1px solid var(--rule); padding:var(--space-1) var(--space-2); text-align:left; vertical-align:top; }
</style>
</head>
<body>
<script src="../creation/final/final.js"></script>
<script src="../scene/scene.js"></script>
<script src="../scene/scene-seq.js"></script>
<script src="december.js"></script>
<script src="icons/icons.js"></script>
<script src="strip.js"></script>
<script src="../shared/book.js"></script>
<script>
{
// ---- parts of pages 18, 23, 24, 30 and 33, as those pages wrote them ----
const sep = svg(SY.right, 16);
const go = svg(SY.right, 20);
const NEW = '<b>A proposal, 2026-11-25. Not approved.</b>';
const stk = (words, k, o = {}) => `<span class="btn stk${o.accent ? ' accent' : ''}" role="button"${o.label ? ` aria-label="${o.label}"` : ''}>${o.sym ? sym(k, 24) : gi(k, 24)}<span>${words}</span></span>`;
const ruleBtn = (k, words) => `<span class="btn big sqb" role="button" aria-label="${words}">${gi(k, 34)}</span>`;
const splash = ruleBtn('water-splash', 'Someone fell in');
const moreBtn = `<span class="btn sq" role="button" aria-label="More">${I.more}</span>`;
const stt = (label, html) => `<div><p class="lbl">${label}</p>${html}</div>`;
const num22 = (name) => { const m = /^([0-9]+[.]) (.*)$/.exec(name); return m ? `<span class="keyno">${m[1]}</span>${m[2]}` : name; };
const STEP5 = [['trumpet', 'Describe'], ['ball', 'Question'], ['sword-brandish', 'Act'], ['wizard', 'Test'], ['chest', 'Resolve']];
const stripRow = remRow('Sequence of play', STEP5.map(([k, n]) => remStep(gi(k, 32), n, false)));
const nextTurn = b('Next turn', { big: true, icon: 'clock' });
const ENCI = { line: sym('encounter', 28), swords: gi('crossed-swords', 30), dice: gi('rolling-dices', 30) };
const ib = (k, words) => `<span class="btn sq ib" role="button" aria-label="${words}">${ENCI[k] || gi(k, 30)}</span>`;
const ibs3 = (enc = 'swords') => [ib('camping-tent', 'Make camp'), ib(enc, 'Encounter check'), ib('exit-door', 'Leave the dungeon')].join('');
const dl = (date, rest = '') => `<span class="dcap">${gi('sprout', 18)}${date}</span>${rest}`;
const DATE = dl('14 Reedmonth, spring', 'Two hours of light left.');
const foldBtn = (open) => `<span class="btn sq fold23" role="button" aria-expanded="${open}" aria-label="${open ? 'Fold the top away' : 'Show the top'}">${svg(open ? '<path d="M5 12h14" ' + W + '/>' : '<path d="M12 5v14M5 12h14" ' + W + '/>', 24)}</span>`;
const dueLine = `<span class="due23" role="status">${I.warn}No light</span>`;
const F_W = fact('weather', 'Weather', 'Drizzle', 'Wet.');
const F_L = fact('flame', 'Light', 'Ash’s torch', '4 turns left.');
const F_R = fact('rest', 'Rest', 'In 5 turns', 'One turn in six.');
const F_E = fact('encounter', 'Encounter check', 'On every move', `${dieMark(20, 16)}d20`).replace('class="v"', 'class="v" style="font-size:20px;white-space:nowrap"');
const tiles = (list) => `<div class="facts c44">${list.join('')}</div>`;
const T3 = tiles([F_L, F_R, F_E]);
// the GM's band, in the order ruled 2026-11-25: the three icon buttons, Next turn, the fold mark, then the menu last
const gmBand = (title, o = {}) => `${band({ over: 'Session 1. Saltwick Island.', title, ident: DATE + (o.under || ''), acts: [`<span class="ibs" role="group">${ibs3(o.enc)}</span>`, nextTurn, o.fold === undefined ? foldBtn(true) : o.fold === null ? '' : foldBtn(o.fold), moreBtn] })}<hr class="dbl">`;
const gmTop = (title, o = {}) => `${gmBand(title, o)}${T3}${stripRow}`;
const trail = (last, area = 'The Drowned Harbour') => `<div class="crumb"><a class="x">Saltwick Island</a>${sep}<a class="x">${area}</a>${sep}<b>${last}</b></div>`;
const headOf = (name, acts) => `<div class="band"><div><h3 class="display">${num22(name)}</h3></div><div class="acts two">${acts}</div></div>`;
const pair = `<div class="two">${b('Knowledge', { icon: 'book' })}${b('Rules', { icon: 'scales' })}</div>`;
const SENT = `${dieMark(20, 16)}Roll d20 for an encounter each time the party rows to a new Location.`;
const waitHead = '<div class="hrow" style="min-height:0;margin-bottom:var(--space-2)"><h2>Waiting for you</h2></div>';
const waitNone = `<div class="pcard"><h2 style="margin-top:0">Waiting for you</h2><p class="meta" style="margin:0">Nothing waits.</p></div>`;
const pX = `<span class="mx" role="button" aria-label="Close">${I.close}</span>`;
const toast = (words, undo = true) => `<div class="toastb" role="status"><span class="tmsg">${words}</span>${undo ? `<span class="tu" role="button">${gi('anticlockwise-rotation', 20)}Undo</span>` : ''}<span class="tb" aria-hidden="true"></span></div>`;
const frame = (id, cap, body, w = 1024) => `<div data-frame="${id}" class="fr44"><p class="cap" style="width:${w}px;max-width:${w}px">${cap}</p><div class="wall bit">${body}</div></div>`;
const dframe = (id, html) => `<div data-frame="${id}" class="fr44">${html}</div>`;
const shortPad = (role, inner, cap) => ipad(role, inner, cap).replace('class="dev ipad"', 'class="dev ipad short"');
const overPop = (role, back, pop, h) => `<div class="dev ipad fixed" style="height:${h}px">${railOf(role)}<div class="main">${topRow(role)}<div class="page">${back}</div></div><div class="veil"></div><div class="pc44">${pop}</div></div>`;
const phSheet = (behind, inner, o = {}) => `<div class="phone"><div class="behind">${behind}<div class="dim"></div></div><div class="sheetup flow" role="dialog"${o.label ? ` aria-label="${o.label}"` : ''}>${inner}</div></div>`;
const phBehind = `${phoneBar('The Reed Marches')}`;
const phGm = (inner, foot = '') => `<div class="phone">${phoneBar('The Reed Marches')}<div class="inner">${inner}</div>${foot}${tabBar('gm')}</div>`;
const phPl = (inner) => `<div class="phone">${phoneBar('The Reed Marches')}<div class="inner">${inner}</div>${tabBar('player')}</div>`;

// ---- the book's figures, invented (the labels are the gallery's own: Level, Armour, Hit points, Attacks, Speed, Morale) ----
const fig = (pairs) => pairs.map(([k, v]) => `<span class="pr44"><span class="lbk">${k}</span>${v}</span>`).join(' ');
const LURK1 = [['Level', '2'], ['Armour', '7'], ['Hit points', `${dieMark(8, 16)}2d8 (9)`], ['Attacks', `Bite (+1, ${dieMark(6, 16)}1d6) and drag under`], ['Speed', '60 swimming'], ['Morale', '8']];
const EEL1 = [['Level', '1'], ['Armour', '8'], ['Hit points', `${dieMark(8, 16)}1d8 (4)`], ['Attacks', `Pinch (+0, ${dieMark(4, 16)}1d4)`], ['Speed', '20'], ['Morale', '6']];
const FERRY1 = [['Level', '1'], ['Armour', '9'], ['Hit points', `${dieMark(6, 16)}1d6 (3)`], ['Attacks', `Boat hook (+0, ${dieMark(6, 16)}1d6)`], ['Speed', '40'], ['Morale', '7']];
// the detail row: one part, in three homes (the encounter's card, a piece's own line, "From the book, for the GM")
const dRow = (name, o = {}) => `<div class="dt44 all" role="button" aria-label="${name}: read it"><span><span class="nm">${name}${o.count ? ` ×${o.count}` : ''}</span>${o.as ? `<span class="meta">, ${o.as}</span>` : ''}<span class="st bk">${o.line}</span></span>${go}</div>`;
const lurkRow = (n) => dRow('Bog lurker', { count: n, line: fig(LURK1) });
const eelRow = dRow('Mud crab', { count: 4, line: fig(EEL1) });
const harlRow = dRow('Old Harl', { as: 'a ferryman', line: fig(FERRY1) });
const ferryRow = dRow('Ferryman', { count: 3, line: fig(FERRY1) });
const oilRow = dRow('Lamp oil', { count: 8, line: 'One flask fills a lantern once. Thrown and lit, it burns where it lands.' });
const ringRow = dRow('Ring of the Drowned Bell', { line: 'Its wearer is steadier against harm. Cursed: it does not come off within sight of the sea.' });

// ================= EN: the encounter as one card =================
const encCard = (title, body, buttons) => `<div class="wait e44"><span class="wi">${sym('encounter', 28)}</span><span class="wt">${title}</span>${body}<span class="wb" data-stkgroup>${buttons.join('')}</span></div>`;
const BTN_ROLL = stk('Enter roll…', 'rolling-dices', { accent: true });
const BTN_DISMISS = stk('Dismiss', 'cancel');
const BTN_REVEAL = stk('Reveal', 'eye', { sym: true, label: 'Reveal to players' });
const BTN_MSG = stk('Message…', 'mail', { sym: true });
const BTN_DONE = stk('Done', 'check-mark', { accent: true });
const RES = 'Two bog lurkers rise from the weed and reach for the oars.';
const encDue = encCard('Encounters in the harbour', `<span class="all">${SENT}</span>`, [BTN_ROLL, BTN_DISMISS]);
const encRolled = encCard(RES, lurkRow(2), [BTN_REVEAL, BTN_MSG, BTN_DONE]);
const encShown = encCard(RES, `${lurkRow(2)}<span class="shown44 all" role="status">${sym('eye', 20)}Players see this result.</span>`, [BTN_MSG, BTN_DONE]);
const encNamed = encCard('Old Harl poles his ferry out of the mist, and asks who is paying.', harlRow, [BTN_REVEAL, BTN_MSG, BTN_DONE]);
const iconSet = (k, label) => `<div><p class="lbl">${label}</p><span class="ibs" role="group">${ibs3(k)}</span></div>`;
const en1 = ipad('gm', `${gmTop('1. The Jetty, turn 2')}<div class="four" style="margin-top:var(--space-4)">
  ${stt('<b>A. The check is due</b> (after a move, or from the band’s button).', `<div class="pcard">${waitHead}${encDue}</div>`)}
  ${stt('<b>B. After the roll:</b> the same card. What was rolled leads it.', `<div class="pcard">${waitHead}${encRolled}</div>`)}
  ${stt('<b>C. After “Reveal”:</b> the line stands in the button’s place.', `<div class="pcard">${waitHead}${encShown}</div>`)}
  ${stt('<b>D. A row that names a character.</b>', `<div class="pcard">${waitHead}${encNamed}</div>`)}
  ${stt('<b>E. A row with no encounter</b> (“Nothing stirs”): no card; the toast says it.', `${waitNone}<div style="margin-top:var(--space-3)">${toast('Rolled 7: nothing stirs.')}</div>`)}
  ${stt('<b>F. “Dismiss” tapped on A:</b> the card goes; the toast brings it back.', `${waitNone}<div style="margin-top:var(--space-3)">${toast('Encounter check dismissed.')}</div>`)}
</div>
<div class="pcard" style="margin-top:var(--space-4)"><p class="lbl" style="margin-bottom:var(--space-3)"><b>The band’s encounter button</b> (F3 b: “needs a better icon”). The three, at the band’s size:</p><div style="display:flex;gap:var(--space-6);flex-wrap:wrap">${iconSet('line', 'Today: thin crossed swords.')}${iconSet('swords', '1. The icon set’s crossed swords (drawn in the band above).')}${iconSet('dice', '2. The rolling dice of “Enter roll…”.')}</div></div>`,
  `EN1 (F3 a, b; F4 a, b; F5 a, b; F6 a, b, c; F7 a; F9). ${NEW} <b>One encounter is one card in “Waiting for you”.</b> Today the check’s line and the card “An encounter waits” both show, and “Start” opens a third place. <b>A.</b> The check is due: the table’s name, the pack’s sentence, “Enter roll…” (the accent) and a new “Dismiss”, so the GM can close a check started by mistake (F3 b). <b>B.</b> After the roll the same card changes: what was rolled is its title (no check name, no “Turn 1”: F5 b); each creature the row names is a <b>detail row</b> (its name, how many, its stat line; the whole row is the tap) in place of the underlined link (F6 b); then “Reveal”, “Message…” and “Done”. Gone from the card: “Encounter tables ›” (F4 b), “Start” and “Dismiss” on a second card (F5 a, F6 c). <b>C.</b> After “Reveal”. <b>D.</b> A named character has the same row (“Old Harl, a ferryman”, the ferryman’s stat line). <b>E, F.</b> No card left behind. <b>The top:</b> “…” is last, after the fold mark (F3 a, ruled); three tiles stand centred (F7 a, ruled). <b>Mine, to check:</b> the button reads “Reveal” (it is read aloud as “Reveal to players”) so that three buttons fit one row; “Done” keeps the accent, as today; a row with no encounter closes at once; a wrong row is put right with the toast’s Undo; “Start” is gone until fights are built (⚑ 2); the icon set’s crossed swords are drawn in the band (⚑ 1): today’s thin pair reads as a close mark.`);

const ENC = [['1–8', 'Nothing stirs.'], ['9–10', 'Gulls mob the boat. Anyone standing must sit or be knocked down.'], ['11–12', 'A seal follows the boat, curious, and will not be driven off.'], ['13–14', 'A bell rings twice under the water, somewhere near the wreck.'], ['15–16', 'Two bog lurkers rise from the weed and reach for the oars.'], ['17–18', 'Old Harl poles his ferry out of the mist, and asks who is paying.'], ['19', 'A drowned sailor drifts by, face down, a purse still at his belt.'], ['20', 'The Tidewife surfaces beside the boat and looks at each of the party in turn.']];
const rollRow = `<p style="margin:0 0 var(--space-2);display:flex;align-items:center;gap:var(--space-2)">${dieMark(20, 24)}<b>Roll d20, then tap the row.</b></p>`;
const encTable = `<div class="bk">${rollRow}<table class="tap"><tr><th>${dieMark(20, 16)}d20</th><th>Encounter</th></tr>${ENC.map(([n, w]) => `<tr role="button"><td>${n}</td><td>${w}</td></tr>`).join('')}</table></div>`;

const backEnc = `${gmTop('1. The Jetty, turn 2')}<div class="cols2"><div><div class="pcard">${trail('1. The Jetty')}${headOf('1. The Jetty', splash + b('Move on', { big: true, icon: 'travel' }))}${pair}</div></div><div class="stack"><div class="pcard">${waitHead}${encDue}</div></div></div>`;

  overPop('gm', backEnc, rollPop(), 760));

const statPop = (o) => `<div class="popb ${o.cls || 'w44'}" role="dialog" aria-label="${o.name}"><div class="pu44"><span class="ehead">${o.name}</span>${pX}</div><div class="bk">${o.body}</div></div>`;
const lurkBody = `<p class="meta" style="font-size:14px;margin:0 0 var(--space-2)">How many: 2</p><p>A grey shape under the duckweed. Drags its prey under and holds it there.</p><p class="dsc">Medium beast, animal wits</p><p class="ln">${fig(LURK1.slice(0, 3))}</p><p class="ln">${fig(LURK1.slice(3))}</p><hr class="dot44"><p class="ln">${fig([['Behaviour', 'Patient, territorial, never leaves the water'], ['Speech', 'None']])}</p><p><b>Ambush from the water:</b> A lurker lying still under weed is not seen unless someone searches the water.</p><p><b>Drag under:</b> A bitten character is held, and begins to drown.</p><p class="source">From your setting: Fen Rules, p. 31</p>`;
const harlBody = `<p class="dsc">A ferryman, wary</p><p>Works the ferry at the jetty and knows who tied up this week. He will not cross after dark, and he is owed for the last three crossings.</p><p><b>Wants:</b> his fare, and no trouble with the wardens.</p><h4>Ferryman</h4><p class="ln">${fig(FERRY1.slice(0, 3))}</p><p class="ln">${fig(FERRY1.slice(3))}</p><p class="source">From your adventure: Saltwick Island, p. 13 and p. 14</p>`;
const oilBody = `<p class="meta" style="font-size:14px;margin:0 0 var(--space-2)">How many: 8</p><p>A clay flask, stoppered with wax.</p><p><b>In a lantern:</b> one flask fills a lantern once.</p><p><b>Thrown:</b> lit and thrown, it burns where it lands.</p><p class="source">From your setting: Fen Rules, p. 12</p>`;
const LONGN = 'The Old Ferrywarden of the Nine Drowned Tides';
const en3 = frame('44-3', `EN3 (F5 c; F6 a; F4 d; F19). ${NEW} <b>What a detail row opens: one pop-up, the same for a creature, a named character and an item.</b> It is the stat pop-up Francis liked, with his two changes: no title line over it (“Encounter waiting: …” is gone) and the X on the line of the name. <b>A.</b> A creature: how many, its description, its figures in the pack’s groups, its abilities, its source. <b>B.</b> A named character: their own notes first, then the stat line of what they are (“Ferryman”), under its own sub-heading. <b>C.</b> An item: how many, then its rule. <b>D.</b> Messy: a very long name wraps under the X’s line; a character with no stat block in the packs says so. <b>Gone:</b> “‹ Back to the encounter” and the pop-up it opened (F6 a): the card behind already holds those facts, and the X closes. <b>Mine, to check:</b> a named character’s stat line needs the pack to link the character to a stat block (work for the pack tools); with no link, D’s line shows.`,
  `${stt('<b>A.</b> A creature.', statPop({ name: 'Bog lurker', body: lurkBody }))}${stt('<b>B.</b> A named character.', statPop({ name: 'Old Harl', body: harlBody }))}${stt('<b>C.</b> An item.', statPop({ name: 'Lamp oil', body: oilBody }))}${stt('<b>D.</b> Messy: a long name, and no stat block in the packs.', statPop({ name: LONGN, body: `<p class="dsc">A warden, old</p><p>Keeps the customs shed and its ledgers.</p><p class="meta" style="font-size:14px">Not in your packs: a stat line for this character.</p><p class="source">From your adventure: Saltwick Island</p>` }))}`, 1880);

const phTopGm = `<div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)"><h3 class="display" style="margin:0;font-size:20px">1. The Jetty, turn 2</h3><span style="display:inline-flex;gap:var(--space-2)">${foldBtn(false)}${moreBtn}</span></div><div class="phband" style="margin-top:var(--space-2)"><p class="ident" style="font-size:14px;margin:0">${dl('14 Reedmonth')}</p><span class="btn" role="button">${gi('hourglass', 20)}Next turn</span></div>`;

  `<div class="phs23">${stt('<b>A.</b> The check is due.', phGm(`${phTopGm}${phWait(encDue)}`))}${stt('<b>B.</b> “Enter roll…”.', phSheet(phBehind, `<div class="pu44"><span class="sheet-title">Encounters in the harbour</span>${pX}</div>${encTable}`))}${stt('<b>C.</b> The result.', phGm(`${phTopGm}${phWait(encRolled)}`))}${stt('<b>D.</b> A detail row tapped.', phSheet(phBehind, `<div class="pu44"><span class="ehead">Bog lurker</span>${pX}</div><div class="bk">${lurkBody}</div>`))}</div>`, 1520);

// ================= DT: details at hand =================

const BOOK = `<p>A cog on her side on the bar, decks awash. Three ferrymen sleep under the sailcloth by day and strip her by night. <b>Old Harl</b> comes for them at dusk.</p><p><b>Below.</b> The hold is flooded to the knee. Four mud crabs have the run of it and pinch at anything that wades.</p><p><b>Stern cabin.</b> A crate of eight flasks of lamp oil, dry, under the fallen beams.</p><div class="aside"><p style="margin-bottom:var(--space-1)"><b>RING OF THE DROWNED BELL</b></p><p>Cast from the bronze of a sunken bell. Its wearer is steadier against harm, and cannot take it off within sight of the sea.</p></div>`;
const bookRows = `<h4>Stat lines</h4>${eelRow}${ferryRow}${harlRow}<h4>Items</h4>${oilRow}${ringRow}<p class="source">p. 14</p>`;

const P_DESC = pieceRow(`A cog on her side on the bar, decks awash, her <b class="kw22">mast</b> showing at every tide. Someone has stretched a <b class="kw22">sailcloth</b> over the stern.`, true);
const P_SAIL = pieceRow('<b>Sailcloth.</b> Three men sleep under it, a boat hook beside them.', false, { under: gmOnly(ferryRow) });

const pieceFoot = (n, of) => `<div style="display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2)">${stk('+ Piece', 'jigsaw-piece')}<span class="meta" style="flex:1;text-align:right">${n} of ${of} shown</span>${stk('Hide all', 'cancel').replace(gi('cancel', 24), sym('eyeshut', 24))}</div>`;
const wreckHead = (accent = true) => `${trail('2. The Wreck')}${headOf('2. The Wreck', splash + b('Move on', { big: true, accent, icon: 'travel' }))}`;
const dt1 = ipad('gm', `${gmBand('2. The Wreck, turn 3', { fold: false })}<div class="cols2"><div><div class="pcard">${wreckHead()}${bookFold(true, BOOK + bookRows)}${pair}${P_DESC}${P_SAIL}${P_HOLD}${pieceFoot(1, 3)}</div></div><div class="stack">${waitNone}${stt('<b>A tap on “Lamp oil ×8”:</b> the same pop-up as an encounter’s (frame EN3).', statPop({ name: 'Lamp oil', body: oilBody, cls: 'ph44' }))}${stt('<b>The fold at rest:</b> one row, and no eye.', `<div class="pcard">${bookFold(false)}</div>`)}</div></div>`,
  `DT1 (F4 d; F17; F18; F19; F21). ${NEW} <b>Details at hand: a name the pack links is one tap from where the GM reads it.</b> The party is at “2. The Wreck”; the top is folded. <b>“From the book, for the GM”</b> stays whole (F18, ruled) and has no eye (F17, ruled: the crossed eye is gone; nothing here can be revealed). It now ends with two short groups, <b>“Stat lines”</b> and <b>“Items”</b>: one detail row for each creature, named character and item the place names. The row shows the stat line or the rule’s first words; a tap opens the pop-up of frame EN3. <b>On a piece:</b> the line “The stat line never shows (…)” becomes the same detail row under the words “Only you see this.” (two rows drawn: “Ferryman ×3”, “Mud crab ×4”). It has no eye: it is never shown. <b>Mine, to check:</b> the two group names (⚑ 9); both homes at once repeat a row (⚑ 9); the boxed item in the book’s text stays as the book has it, and its row under “Items” is the tap; the top is drawn folded only to give the card room.`);
const dt2 = frame('44-6', `DT2 (F19; F21). ${NEW} <b>The same at 375 px.</b> <b>A.</b> The fold open: the book’s words, then the two groups; each row wraps its stat line. <b>B.</b> A piece with its detail row. <b>C.</b> “Old Harl” tapped: the pop-up as a sheet. <b>Mine, to check:</b> on a phone the open fold is long (about two screens here); it is folded again with one tap on its head.`,
  `<div class="phs23">${stt('<b>A.</b> The fold open.', phGm(`<div class="crumb">${'<span>The Drowned Harbour</span>'}${sep}<b>2. The Wreck</b></div><h3 class="display" style="font-size:24px;margin:0">${num22('2. The Wreck')}</h3>${bookFold(true, BOOK + bookRows)}`))}${stt('<b>B.</b> A piece and its row.', phGm(`<h3 class="display" style="font-size:24px;margin:0">${num22('2. The Wreck')}</h3>${bookFold(false)}${pair}${P_DESC}${P_SAIL}`))}${stt('<b>C.</b> “Old Harl” tapped.', phSheet(phBehind, `<div class="pu44"><span class="ehead">Old Harl</span>${pX}</div><div class="bk">${harlBody}</div>`))}</div>`, 1140);

// ================= TR: found treasure =================

const tr1 = ipad('gm', `${gmBand('2. The Wreck, turn 3', { fold: false })}<div class="cols2"><div><div class="pcard">${wreckHead(false)}${bookFold(false)}${pair}${P_DESC}${P_BOX}${P_RING(true)}${P_OIL}${pieceFoot(3, 5)}</div><div style="margin-top:var(--space-3)">${toast('Bronze ring sent to Wren.')}</div></div><div class="stack">${stt('<b>A tap on “Bronze ring”</b> (one thing): where it goes, at once.', `<div class="popb ph44">${ringSheet}</div>`)}${stt('<b>A tap on “Crate”</b> (a count): a row a thing, as a hoard has.', `<div class="popb ph44">${oilSheet}</div>`)}</div></div>`,
  `TR1 (F20 b, d; F21 c; F23). ${NEW} <b>Every found thing has the hoard’s arrow, and the hoard’s “Send”.</b> The hoard’s sheet and its “To a character” / “To the party stash” are built (page 30, frame HM2); today only a piece the pack writes as a hoard has the arrow. <b>Proposed:</b> any Treasure piece has it, also a single thing; a tap on the piece’s words opens the sheet, as a hoard’s words do, and the arrow says so. <b>One thing</b> (“Bronze ring”): the sheet shows the piece’s words and goes straight to where it is sent. <b>A count</b> (“Lamp oil ×8”): one row a thing and “Send all”, as a hoard. After a send the piece says where it went (“Sent to Wren.”) and the toast has Undo, as built. <b>The eye and the arrow are two acts:</b> the eye shows the piece’s words to the players; the arrow hands the thing over. <b>A magic item under a plain description (F23):</b> the party gets “Bronze ring”; its truth is the row under “Only you see this.”, and the GM tells it later from the item’s own card (“Reveal…”, page 33), unchanged. <b>Mine, to check:</b> the two sheets are drawn as cards (on a tablet they stand in the right-hand panel, as HM2); “Send all” is the sheet’s one accent, so “Move on” is drawn plain while a sheet is open; a thing the setting has no item for is sent as a one-off by its words, as the hoard does.`);
const tr2 = frame('44-8', `TR2 (F20 b; F21 c). ${NEW} <b>The same at 375 px.</b> <b>A.</b> The pieces, each with its arrow and its eye, 8 px apart; what only the GM sees takes the card’s whole width under the words. <b>B.</b> The sheet for one thing. <b>C.</b> The sheet for a count. <b>Mine, to check:</b> the words and two 44 px targets share 343 px, so the words wrap to about 26 characters a line.`,
  `<div class="phs23">${stt('<b>A.</b> The pieces.', phGm(`<h3 class="display" style="font-size:24px;margin:0">${num22('2. The Wreck')}</h3>${P_BOX}${P_RING(true)}${P_OIL}`))}${stt('<b>B.</b> One thing.', phSheet(phBehind, ringSheet))}${stt('<b>C.</b> A count.', phSheet(phBehind, oilSheet))}</div>`, 1140);

// ================= DP: the Depart list =================
const pkRow = (name, o = {}) => `<div class="pk23${o.ind ? ' ind44' : ''}" role="button"><span style="flex:1;min-width:0;overflow-wrap:break-word">${num22(name)}</span>${o.area ? `<span class="ar">${o.area}</span>` : ''}</div>`;

const HARB = ['The Old Mooring', '0. The Anchorage', '1. The Jetty', '2. The Wreck', '3. The Breakwater', '4. The Customs Shed', '5. The Sea Cave'];

const dpE = `${whereHead}${searchField('quay')}<p style="margin:var(--space-3) 0 var(--space-2)">No place matches “quay”.</p>${b('Other… use “quay” as a new place')}`;
const dp3 = frame('44-9', `DP3 (F1 a, c; F2). ${NEW} <b>The Depart list, “Where?”, as one view.</b> Base: page 24’s frame DP1 and the built list. <b>A. As it opens.</b> New at the top: the search field and “Recently visited”, which the first picker has and this list did not (F2: no way back to them; now there is no second view to come back from). Then each Area as a <b>group that folds</b> (F1 c), with its count and the app’s own fold square, “−” and “+”. <b>The order (F1 a, ruled):</b> places with no number first, then by number: 0, 1, 2 … 9, 10, 11, never 1, 10, 11, 2. Then “From your packs” and “Other…”, as built. <b>B. A search for “1”:</b> each row names its Area at the right, so two places numbered 1 are told apart. <b>C. Messy:</b> a long Area name wraps; thirteen places stay in number order. <b>D. A pack opened</b> (from “From your packs”): its places carry their numbers, in the same order (F2), and <b>“Back”</b> returns to the list. <b>E. Nothing found.</b> <b>Mine, to check:</b> which group starts open (drawn: the Area last played open, the others folded; ⚑ 10); the tick on a picked row is as DP1 and is not redrawn; the pack’s view replaces the list inside the same pop-up; loading is DP1’s two skeleton rows, not redrawn.`,
  `<div class="four" style="grid-template-columns:repeat(3,440px);gap:var(--space-5)">${stt('<b>A.</b> As it opens.', `<div class="popb w44">${dpA}</div>`)}${stt('<b>B.</b> A search for “1”.', `<div class="popb w44">${dpB}</div>${`<p class="lbl" style="margin-top:var(--space-4)"><b>E.</b> Nothing found.</p><div class="popb w44">${dpE}</div>`}${`<p class="lbl" style="margin-top:var(--space-4)"><b>D.</b> A pack opened, with “Back”.</p><div class="popb w44">${dpD}</div>`}`)}${stt('<b>C.</b> Messy: a long name, thirteen places.', `<div class="popb w44">${dpC}</div>`)}</div>`, 1420);

  `<div class="phs23">${stt('<b>A.</b> As it opens.', `<div class="phone"><div class="inner">${dpA.split('<span class="ar">').join('<span class="ar" style="margin-left:0;flex-basis:100%">').split('class="pk23" role="button"><span style="flex:1;min-width:0;overflow-wrap:break-word">').join('class="pk23" role="button" style="flex-wrap:wrap;row-gap:0;padding:var(--space-1) 0"><span style="flex:1 0 100%;min-width:0;overflow-wrap:break-word">')}</div></div>`)}${stt('<b>B.</b> A pack opened.', `<div class="phone"><div class="inner">${dpD}</div></div>`)}</div>`, 760);

// ================= WT: "Where to?" rows =================
