<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>December: page 44, the Scene feedback of 25 November (redrawn to the rulings of 26 November, not approved)</title>
<link rel="stylesheet" href="../creation/final/final.css">
<link rel="stylesheet" href="../scene/scene.css">
<link rel="stylesheet" href="../scene/scene-seq.css">
<link rel="stylesheet" href="december.css">
<link rel="stylesheet" href="../shared/book.css">
<style>
  /* This page's own rules. Type, the book format, the stacked button, the sheet's title, the pop-up, the tapped table and
     the corners come from ../shared/book.css and are not restated here. */
  /* (1) copied as they stand from page 24 (and through it pages 04, 12, 16, 18 and 23): the layout of the parts reused here */
  .lbl { font-size:14px; color:var(--muted); margin:0 0 var(--space-2); }
  .rem { justify-content:center; } .rem .gap { display:none; }
  .phone .rem .step .nm { display:none; }
  .ibs { display:inline-flex; gap:var(--space-2); }
  .btn.sq.ib { padding:6px; }
  .dcap { display:inline-flex; align-items:center; gap:var(--space-1); font-size:16px; letter-spacing:.04em; margin-right:var(--space-2); vertical-align:bottom; }
  .dcap svg { color:var(--muted); flex:none; }
  .phone .dcap { font-size:14px; }
  .phband { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--space-2); align-items:center; margin-top:var(--space-1); }
  .phibs { display:flex; gap:var(--space-2); margin-top:var(--space-2); }
  .four { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--space-4); align-items:start; }
  .mseq { font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .mx { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; flex:none; }
  .flab { display:block; font-size:14px; color:var(--muted); margin:var(--space-3) 0 var(--space-1); }
  .wait .wb { grid-column:1 / -1; align-items:stretch; }
  .bk td:first-child, .bk th:first-child { width:96px; }
  .phone .pdest { grid-template-columns:auto minmax(0,1fr); }
  .phone .pdest .modes { grid-column:1 / -1; justify-content:flex-start; }
  .phone .pcard { margin-top:var(--space-3); padding:var(--space-3); }
  .pdest .modes .btn.stk { width:auto; }
  .pdest .ot b { overflow-wrap:break-word; word-break:normal; }
  .dev .band .acts .btn.sq { width:52px; min-height:52px; }
  .maptools .btn.sq { height:44px; padding:0; }
  .kw22 { font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  .inforce .own22 { display:block; margin-top:var(--space-1); }
  .pk23 { display:flex; align-items:center; gap:var(--space-2); min-height:44px; border-bottom:1px dotted var(--rule); }
  .due23 { display:flex; align-items:center; gap:var(--space-1); font-size:14px; font-weight:700; margin-top:var(--space-1); }
  .shown23 p { margin:var(--space-2) 0 0; }
  .phs23 { display:grid; grid-auto-flow:column; grid-auto-columns:343px; gap:var(--space-4) var(--space-6); align-items:start; }
  .behind { position:relative; height:52px; overflow:hidden; box-sizing:border-box; }
  .sheetup.flow { position:relative; max-height:none; }
  /* (2) new on this page */
  .fr44 { margin:0 0 var(--space-6); }
  .fr44 > .cap { font-size:14px; }
  /* the pop-up's head: its title (or an entry's name) and the X on one line */
  .pu44 { display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:var(--space-2); align-items:center; margin-bottom:var(--space-2); }
  .pu44 .ehead, .pu44 .sheet-title { overflow-wrap:break-word; min-width:0; }
  .popb.w44 { width:440px; }
  .popb.w72 { width:640px; max-width:720px; }
  .phone .popb.w44, .popb.ph44 { width:auto; max-width:none; }
  /* a pop-up centred over a dimmed screen */
  .pc44 { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:var(--space-4); box-sizing:border-box; }
  /* tiles centred: each keeps a quarter of the row (two across on a phone) */
  .facts.c44 { display:flex; flex-wrap:wrap; justify-content:center; }
  .facts.c44 .fact { flex:0 0 calc((100% - 3 * var(--space-3)) / 4); }
  .phone .facts.c44 { gap:var(--space-2); margin-top:var(--space-2); }
  .phone .facts.c44 .fact { flex:0 0 calc((100% - var(--space-2)) / 2); padding-left:var(--space-2); padding-right:var(--space-2); column-gap:var(--space-2); }
  .phone .facts.c44 .fact .v { font-size:16px !important; white-space:nowrap; }
  .phone .facts.c44 .fact .k { white-space:nowrap; letter-spacing:0 !important; }
  .phone .facts.c44 .fact .fi svg { width:20px; height:20px; }
  .phone .facts.c44 .fact:last-child .v { font-size:14px !important; }
  .phone .two.pp44 { grid-template-columns:minmax(0,1fr); }
  /* the encounter's one card: the icon and what was rolled on the first line, the rest across the card */
  .wait.e44 .wi { grid-row:1; }
  .wait.e44 > .all { grid-column:1 / -1; }
  .shown44 { display:flex; align-items:center; gap:var(--space-2); font-size:14px; margin-top:var(--space-2); }
  /* the detail row: a name the pack links, with its stat line or its rule's first words; the whole row is the tap */
  .dt44 { display:grid; grid-template-columns:minmax(0,1fr) 20px; gap:var(--space-2); align-items:center; min-height:44px; padding:var(--space-2) var(--space-3); border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); margin-top:var(--space-2); box-sizing:border-box; }
  .dt44 .nm { font-weight:700; }
  .dt44 .st { display:block; font-size:14px; line-height:1.4; overflow-wrap:break-word; }
  .pr44 { margin-right:var(--space-2); }
  .gm44 { display:block; font-size:14px; color:var(--muted); margin-top:var(--space-2); }
  .dot44 { border:0; border-top:1px dotted var(--rule); margin:var(--space-2) 0; }
  /* the fold "From the book, for the GM": its head is one row, with no eye */
  .fb44 { display:grid; grid-template-columns:minmax(0,1fr) 44px; align-items:center; min-height:44px; border-top:1px dotted var(--rule); border-bottom:1px dotted var(--rule); margin-top:var(--space-3); }
  .fb44 b { display:block; }
  .fb44 small { display:block; font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fbb44 { padding:var(--space-3) 0; border-bottom:1px dotted var(--rule); }
  /* a piece with an arrow before its eye */
  .piece.ar44 { grid-template-columns:minmax(0,1fr) 44px 44px; gap:var(--space-2); }
  .piece > .un44 { grid-column:1 / -1; margin-top:calc(-1 * var(--space-2)); }
  .un44 .gm44:first-child { margin-top:0; }
  .sent44 { display:flex; align-items:center; gap:var(--space-1); font-size:14px; margin-top:var(--space-1); }
  /* the Depart list: the group's head with its fold square; the back row; the search field's label */
  .gh44 { display:grid; grid-template-columns:minmax(0,1fr) auto 44px; gap:var(--space-2); align-items:center; min-height:52px; border-bottom:1.5px solid var(--ink); margin-top:var(--space-3); }
  .gh44 .sclab { margin:0; }
  .gh44 .btn.sq { width:44px; }
  .pk23 .ar { margin-left:auto; color:var(--muted); font-size:14px; }
  .back44 { display:inline-flex; align-items:center; gap:var(--space-1); min-height:44px; padding:0 var(--space-3) 0 var(--space-2); border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); margin-bottom:var(--space-2); }
  .ind44 { padding-left:var(--space-5); }
  /* "Where to?": an Area's name over its rows */
  .ah44 { margin:var(--space-3) 0 0; }
  .ah44:first-child { margin-top:0; }
  /* the Move on pop-up's foot: Back at the left, Move at the right */
  .mf44 { display:flex; justify-content:space-between; gap:var(--space-2); margin-top:var(--space-4); }
  /* the Edit piece form */
  .fld44 { margin:0 0 var(--space-3); }
  .fld44 .fl { display:block; font-weight:700; margin-bottom:var(--space-1); }
  .fld44 .field.area { min-height:96px; }
  .kind44 { display:grid; grid-template-columns:auto minmax(0,1fr) 20px; gap:var(--space-3); align-items:center; min-height:44px; padding:0 var(--space-3); border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); }
  /* the encounter tables page */
  .chips44 { display:flex; flex-wrap:wrap; gap:var(--space-2); margin:var(--space-2) 0 var(--space-3); }
  .tp44 { max-width:640px; }
  .tt .tr { grid-template-columns:4.6em minmax(0,1fr) 24px; }
  ol.q44 { font-size:16px; max-width:760px; padding-left:var(--space-5); color:var(--ink); }
  ol.q44 li { margin-bottom:var(--space-2); }
  .note.big { font-size:16px; color:var(--ink); max-width:760px; }
  /* the critique: its score table and its numbered findings, as pages 40 and 42 have them */
  ol.crit { font-size:16px; max-width:760px; padding-left:var(--space-5); color:var(--ink); }
  ol.crit li { margin-bottom:var(--space-2); }
  table.sc { border-collapse:collapse; font-size:14px; max-width:760px; margin:var(--space-2) 0 var(--space-4); color:var(--ink); }
  table.sc td, table.sc th { border:1px solid var(--rule); padding:var(--space-1) var(--space-2); text-align:left; vertical-align:top; }
  /* (3) redrawn 2026-11-26, to Francis's rulings and the critique's findings he picked */
  /* the band: a thin rule sets the fold mark apart from the actions; with the words under the marks (a wide screen) the row is the stacked button's height */
  .vr44 { width:1px; align-self:stretch; background:var(--control); margin:var(--space-1) 0; }
  .dev .band.w44 .acts .btn.big, .dev .band.w44 .acts .btn.sq { min-height:56px; }
  .dev .band.w44 .acts .btn.sq { width:56px; }
  /* the detail row loses its box: a dotted rule above and below, as a piece has (finding 13) */
  .dt44 { border:0; border-top:1px dotted var(--rule); border-bottom:1px dotted var(--rule); border-radius:0; background:transparent; padding:var(--space-2) 0; }
  .dt44 + .dt44 { margin-top:0; border-top:0; }
  .dt44 .st.meta { color:var(--muted); }
  /* a stat line breaks between pairs; a die stays with its number (finding 12) */
  .pr44 { display:inline-block; max-width:100%; }
  .nw44 { white-space:nowrap; }
  /* the encounter's card: the words at body size; the line that says what was picked, with "Change…" */
  .ew44 { font-size:16px; line-height:1.5; }
  .rl44 { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); margin-top:var(--space-1); }
  .rl44 .meta { font-size:14px; min-width:0; }
  .shown44 { align-items:flex-start; }
  .shown44 svg { flex:none; margin-top:1px; }
  .phone .wait.e44 .wb.w3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); }
  .phone .wait.e44 .wb.w3 .btn.stk { min-width:0 !important; width:100%; padding-left:var(--space-1); padding-right:var(--space-1); }
  /* at 375 px the encounter's card has no box of its own inside "Waiting for you": two boxes deep, and room for three 88 px buttons */
  .phone .pcard .wait.e44 { border:0; padding:0; background:transparent; }
  /* the tapped table's picked row, in the roll's pop-up */
  table.tap tr.on44 td { background:var(--wash); font-weight:700; }
  table.tap tr.on44 { outline:2px solid var(--accent); outline-offset:-2px; }
  table.tap tr.at44 td { background:var(--wash); }
  table.tap tr.at44 td:first-child { font-weight:700; }
  .tk44 { float:right; margin-left:var(--space-2); display:inline-flex; }
  /* a warning line under a field */
  .wl44 { display:flex; align-items:center; gap:var(--space-1); font-weight:700; color:var(--warn); margin:calc(-1 * var(--space-1)) 0 var(--space-2); }
  /* the "…" menu, as page 32 draws it */
  .menu44 { border:1px solid var(--rule); border-radius:8px; background:var(--popup); box-shadow:0 4px 16px rgb(0 0 0 / 25%); padding:var(--space-1) 0; }
  .menu44 .mi { display:flex; align-items:center; gap:var(--space-3); min-height:48px; padding:0 var(--space-4); }
  .menu44 .mi svg { color:var(--muted); flex:none; }
  .mdiv44 { border:0; border-top:1px solid var(--rule); margin:var(--space-1) 0; }
  .sw44 { width:52px; height:44px; display:inline-flex; align-items:center; flex:none; }
  .sw44 i { display:block; width:52px; height:28px; border-radius:14px; border:1.5px solid var(--control); background:var(--sheet); position:relative; box-sizing:border-box; }
  .sw44 i::after { content:""; position:absolute; left:3px; top:3px; width:19px; height:19px; border-radius:50%; background:var(--control); }
  /* skeleton rows; a pop-up that stops at the screen's height, its rows scrolling */
  .sk44 { height:16px; border-radius:4px; background:var(--rule); margin:0 0 var(--space-3); }
  .popb.tall44 { display:flex; flex-direction:column; max-height:520px; }
  .scr44 { position:relative; overflow:hidden; min-height:0; flex:1 1 auto; padding-right:var(--space-3); }
  .sb44 { position:absolute; right:0; top:var(--space-1); width:4px; height:38%; border-radius:2px; background:var(--control); }
  .gn44 { display:grid; grid-template-columns:auto 96px; gap:var(--space-3); align-items:center; justify-content:start; margin:0 0 var(--space-3); }
  .gn44 .fl { font-weight:700; }
  /* a piece's words that are a tap of their own (a Treasure piece) keep the row's height */
  .piece .lead[role="button"] { min-height:44px; display:flex; align-items:center; }
  /* the Depart list: a second level of indent inside a pack */
  .gh44.ind44 { margin-top:0; padding:var(--space-1) 0; border-bottom:1px dotted var(--rule); }
  .pk23.ind2 { padding-left:calc(2 * var(--space-5)); }
  /* "Where to?": the closed eye and what the players read */
  .ns44 { display:inline-flex; align-items:center; gap:var(--space-1); }
  /* the players' pair at 375 px: two stacked buttons of one width; the third tile takes the row */
  .two.pp44.ph { grid-template-columns:auto minmax(0,1fr); }
  .two.pp44.ph .btn.stk { width:100%; }
  .phone .facts.c44 .fact:nth-child(3):last-child { flex:0 0 100%; }
  .phone .facts.c44 .fact:nth-child(3):last-child .v { font-size:16px !important; }
  /* Knowledge: an unfolded section, its eye on its own heading */
  .ksec.k44 { align-items:center; }
  .ksec.k44.open { display:block; }
  .kh44 { display:grid; grid-template-columns:minmax(0,1fr) 44px 44px; gap:var(--space-2); align-items:center; }
  .kh44 h4 { margin:0; }
  .ksec.k44 .when { display:flex; align-items:flex-start; gap:var(--space-1); }
  .ksec.k44 .when svg { flex:none; margin-top:2px; }
  .ksec.k44 .bk { margin-top:var(--space-1); }
  /* "Edit piece": the kinds unfold in place; "Remove this piece" as a quiet row */
  .kind44 { grid-template-columns:minmax(0,1fr) 20px; }
  .kl44 { border:1.5px solid var(--control); border-top:0; border-radius:0 0 4px 4px; padding:0 var(--space-3); }
  .kl44 .pk23:last-child { border-bottom:0; }
  .rm44 { border-bottom:0; margin-top:calc(-1 * var(--space-1)); }
  table.sc td b.ok { font-weight:700; }
</style>
</head>
<body>
<script src="../creation/final/final.js"></script>
<script src="../scene/scene.js"></script>
<script src="../scene/scene-seq.js"></script>
<script src="december.js"></script>
<script src="icons/icons.js"></script>
<script src="strip.js"></script>
<script src="../shared/book.js"></script>
<script>
{
// ---- parts of pages 18, 23, 24, 30 and 33, as those pages wrote them ----
const sep = svg(SY.right, 16);
const go = svg(SY.right, 20);
const NEW = '<b>Redrawn to Francis’s rulings of 2026-11-26. Not approved.</b>';
const stk = (words, k, o = {}) => `<span class="btn stk${o.accent ? ' accent' : ''}${o.on ? ' on' : ''}" role="button"${o.on !== undefined ? ` aria-pressed="${!!o.on}"` : ''}${o.label ? ` aria-label="${o.label}"` : ''}>${o.sym ? sym(k, 24) : gi(k, 24)}<span>${words}</span></span>`;
const ruleBtn = (k, words) => `<span class="btn big sqb" role="button" aria-label="${words}">${gi(k, 34)}</span>`;
const splash = ruleBtn('water-splash', 'Someone fell in');
const moreBtn = `<span class="btn sq" role="button" aria-label="More">${I.more}</span>`;
const stt = (label, html) => `<div><p class="lbl">${label}</p>${html}</div>`;
const num22 = (name) => { const m = /^([0-9]+[.]) (.*)$/.exec(name); return m ? `<span class="keyno">${m[1]}</span>${m[2]}` : name; };
const STEP5 = [['trumpet', 'Describe'], ['ball', 'Question'], ['sword-brandish', 'Act'], ['wizard', 'Test'], ['chest', 'Resolve']];
const stripRow = remRow('Sequence of play', STEP5.map(([k, n]) => remStep(gi(k, 32), n, false)));
const nextTurn = b('Next turn', { big: true, icon: 'clock' });
// ⚑ 1, ruled 2026-11-26: the encounter's mark is the icon set's crossed swords, in the band, the tile and the card alike
const SW = (w) => gi('crossed-swords', w);
const swap = (html, w) => html.split(sym('encounter', w)).join(SW(w));
// the band's three marks, as built: 52 px squares, read aloud by their words
const ib = (k, words) => `<span class="btn sq ib" role="button" aria-label="${words}">${gi(k, 30)}</span>`;
const bandMarks = `<span class="ibs" role="group">${ib('camping-tent', 'Make camp')}${ib('crossed-swords', 'Encounter check')}${ib('exit-door', 'Leave the dungeon')}</span>`;
// finding 18: where the band has room (1180 px and wider) each mark has its word under it (the stacked button)
const bandTools = `<span class="ibs" role="group" data-stkgroup>${stk('Camp', 'camping-tent', { label: 'Make camp' })}${stk('Encounter', 'crossed-swords', { label: 'Encounter check' })}${stk('Leave', 'exit-door', { label: 'Leave the dungeon' })}</span>`;
const dl = (date, rest = '') => `<span class="dcap">${gi('sprout', 18)}${date}</span>${rest}`;
const DATE = dl('14 Reedmonth, spring', 'Two hours of light left.');
// finding 5: one fold mark on the page, the chevron (down while folded, up while open); "+" is left to mean "add"
const foldMark = (open, w = 24) => svg(open ? '<path d="M6 15l6-6 6 6" ' + W + '/>' : '<path d="M6 9l6 6 6-6" ' + W + '/>', w);
const foldBtn = (open) => `<span class="btn sq fold23" role="button" aria-expanded="${open}" aria-label="${open ? 'Fold the top away' : 'Show the top'}">${foldMark(open)}</span>`;
const foldSq = (open, name) => `<span class="btn sq" role="button" aria-expanded="${open}" aria-label="${open ? 'Fold' : 'Unfold'} ${name}">${foldMark(open)}</span>`;
const vr = '<span class="vr44" aria-hidden="true"></span>';
const dueLine = `<span class="due23" role="status">${I.warn}No light</span>`;
const F_W = fact('weather', 'Weather', 'Drizzle', 'Wet.');
const F_L = fact('flame', 'Light', 'Ash’s torch', '4 turns left.');
const F_R = fact('rest', 'Rest', 'In 5 turns', 'One turn in six.');
const F_E = swap(fact('encounter', 'Encounter check', 'On every move', `${dieMark(20, 16)}d20`).replace('class="v"', 'class="v" style="font-size:20px;white-space:nowrap"'), 28);
const tiles = (list) => `<div class="facts c44">${list.join('')}</div>`;
const T3 = tiles([F_L, F_R, F_E]);
// the GM's band: the three marks, Next turn, a rule, the fold mark, then the menu last (F3 a, ruled 2026-11-25)
const gmBand = (title, o = {}) => `${band({ over: 'Session 1. Saltwick Island.', title, ident: DATE + (o.under || ''), acts: [o.words ? bandTools : bandMarks, nextTurn, vr, foldBtn(o.fold === undefined ? true : o.fold), moreBtn] }).replace('class="band"', o.words ? 'class="band w44"' : 'class="band"')}<hr class="dbl">`;
const gmTop = (title, o = {}) => `${gmBand(title, o)}${T3}${stripRow}`;
const trail = (last, area = 'The Drowned Harbour') => `<div class="crumb"><a class="x">Saltwick Island</a>${sep}<a class="x">${area}</a>${sep}<b>${last}</b></div>`;
const headOf = (name, acts) => `<div class="band"><div><h3 class="display">${num22(name)}</h3></div><div class="acts two">${acts}</div></div>`;
const pair = `<div class="two">${b('Knowledge', { icon: 'book' })}${b('Rules', { icon: 'scales' })}</div>`;
const SENT = `${dieMark(20, 16)}Roll d20 for an encounter each time the party rows to a new Location.`;
const waitHead = '<div class="hrow" style="min-height:0;margin-bottom:var(--space-2)"><h2>Waiting for you</h2></div>';
const waitNone = `<div class="pcard"><h2 style="margin-top:0">Waiting for you</h2><p class="meta" style="margin:0">Nothing waits.</p></div>`;
const pX = `<span class="mx" role="button" aria-label="Close">${I.close}</span>`;
const toast = (words, undo = true) => `<div class="toastb" role="status"><span class="tmsg">${words}</span>${undo ? `<span class="tu" role="button">${gi('anticlockwise-rotation', 20)}Undo</span>` : ''}<span class="tb" aria-hidden="true"></span></div>`;
const frame = (id, cap, body, w = 1024) => `<div data-frame="${id}" class="fr44"><p class="cap" style="width:${w}px;max-width:${w}px">${cap}</p><div class="wall bit">${body}</div></div>`;
const dframe = (id, html) => `<div data-frame="${id}" class="fr44">${html}</div>`;
const shortPad = (role, inner, cap) => ipad(role, inner, cap).replace('class="dev ipad"', 'class="dev ipad short"');
const overPop = (role, back, pop, h) => `<div class="dev ipad fixed" style="height:${h}px">${railOf(role)}<div class="main">${topRow(role)}<div class="page">${back}</div></div><div class="veil"></div><div class="pc44">${pop}</div></div>`;
const phSheet = (behind, inner, o = {}) => `<div class="phone"><div class="behind">${behind}<div class="dim"></div></div><div class="sheetup flow" role="dialog"${o.label ? ` aria-label="${o.label}"` : ''}>${inner}</div></div>`;
const phBehind = `${phoneBar('The Reed Marches')}`;
const phGm = (inner, foot = '') => `<div class="phone">${phoneBar('The Reed Marches')}<div class="inner">${inner}</div>${foot}${tabBar('gm')}</div>`;

  <p class="note big"><b>What works.</b>
  <br>&bull; An encounter is one card: the check, its result and its details. A row with nothing in it leaves no card behind.
  <br>&bull; The detail row puts the stat line where the name is read, and one pop-up serves a creature, a named character and an item (EN3 is the strongest frame on the page).
  <br>&bull; The Depart list is one view in map order, searched by name or number.
  <br>&bull; The two pop-ups and the form are the app’s standard pop-up, as tall as their words, with one accent at the foot’s right.
  <br>&bull; The players’ “An encounter” card (EN5) gives them the words and nothing else.
  <br><b>Mode:</b> Operate, at a table. The page keeps to the app’s parts and the book’s format, with no ornament added.
  <br><b>Load:</b> lightest on EN, PU and EP; heaviest on DT1. <b>Hierarchy:</b> clear on every frame but EN1 B to D, where a rolled sentence at heading size outranks the place (14).
  <br><b>Not counted:</b> a small-caps line over a heading (“Session 1. Saltwick Island.”, “Depart”, “Move on”, “Rolled by hand”, “2. The Wreck”). <code>impeccable</code> bans an eyebrow over a heading, but here it is the app’s approved house pattern, and the brief wins.</p>
  <ol class="crit">
  <li><b>High. “Reveal” sends the row’s words whole, in one tap, to every player’s Scene</b> (EN1 B, EN5).
    <br>A table’s row is written for the GM and may say more than the players should know yet. Undo takes the card back, but not what was read.
    <br>Fix: “Reveal…” opens the standard pop-up with the words in a box the GM can trim, and “Reveal” as its accent. Or keep one tap and accept the risk.
    <br>A hidden-data question, so it needs his ruling. (<code>harden</code>)</li>
  <li><b>High. After “Reveal”, “Message…” slides into the place where “Reveal” was</b> (EN1 C, EN4 C).
    <br>A second tap in the same spot opens a message.
    <br>Fix: the three buttons keep their places. “Reveal” becomes a pressed “Revealed” with the open eye, and a tap on it takes the reveal back, which gives that Undo a lasting home. (<code>layout</code>)</li>
  <li><b>High. A wrong row can be put right only while the toast lasts</b> (EN1 B and E, EN2, ET1).
    <br>Rows of eight to twenty, 44 px tall, tapped at a table: a slip is likely. Once the toast is gone, nothing leads back to the table.
    <br>Fix: a quiet “Change…” on the result card that reopens the table with the row ticked. (<code>harden</code>)</li>
  <li><b>High. Sharing an Area’s section from one of its places doesn’t say how far the share goes, and the eye sits on the row that unfolds</b> (KN1 A, B, D).
    <br>“Shared with the players, turn 9.” doesn’t say whether it was shared for the whole Area or only here. And a slip beside the fold shares at once; Undo can’t unread it.
    <br>Fix: say “Shared with the players, across The Drowned Harbour, turn 9.”, and show the eye only inside the unfolded section.
    <br>Hidden data again, so it needs his ruling. (<code>clarify</code>)</li>
  <li><b>High. Folds have four marks, and on the GM’s band the fold mark reads as “add”</b> (PS2 C, EN1, DT1, KN1, DP3, DP3b).
    <ul>
      <li>On the GM’s top, the fold square “+” stands in the row of actions, between “Next turn” and “…”. In that company it reads as “add something”, not “show the top”.</li>
      <li>A fold is shown four ways: “+” and “−” in a square (the top, the Depart groups), a chevron at the right (“From the book, for the GM”), and “›” before a heading (Knowledge).</li>
      <li>In the Depart list the same “+” unfolds an Area in place but swaps the whole view for a pack.</li>
      <li>“›” also opens a detail pop-up, opens the send sheet and goes one step on.</li>
    </ul>
    Fix: one fold mark for all folds. Set the top’s fold apart from the actions (at the band’s left edge, by the title, or after a rule). A pack unfolds in place like an Area. “›” then means only “opens”. (<code>polish</code>)</li>
  <li><b>Medium. A tap on a piece’s words does two things, depending on its kind</b> (TR1, EP1; ⚑ 7).
    <br>A Treasure piece opens the send sheet; any other piece opens “Edit piece”. Nothing on the piece says which, and the kind can be changed.
    <br>Fix: ⚑ 7’s other choice. The words never open the form; “Edit the piece’s words” stands behind the arrow on every piece. (<code>clarify</code>)</li>
  <li><b>Medium. The button says “Enter roll…” and two toasts quote a number nobody entered</b> (EN1 A and E, ET1 A).
    <br>The pop-up asks for a tap on a row. The app knows the range (“1–8”, “15–16”), not the roll (“7”, “16”).
    <br>Fix: the button reads “Roll…”, and the toasts read “1–8: nothing stirs.” and “Rolled by hand: 15–16, two bog lurkers…”. (<code>clarify</code>)</li>
  <li><b>Medium. “N. Unexplored” says less than today’s row when no map is shown</b> (WT1 B and C, PS1, PS3; ⚑ 6).
    <br>Three rows differ by one digit, and the way’s own name is gone. Under “Elsewhere”, “0. Unexplored” quotes a number from a map the players have never been given.
    <br>Fix: keep his words as the name, with the way under them in quiet words. With ⚑ 6, decide whether the number shows at all where the group has no map, and always under “Elsewhere”. (<code>clarify</code>)</li>
  <li><b>Medium. DT1 holds seven boxed rows on one card, three of them the same stat line</b> (DT1, DT2; ⚑ 9).
    <br>“Ferryman ×3”, “Old Harl, a ferryman” and the piece’s “Ferryman ×3” all carry it. On a phone the open fold is about two screens.
    <br>Fix, with ⚑ 9: give each detail one home. It goes on the piece where a piece names it; the fold keeps only what no piece names; identical lines join (“Ferryman ×3, and Old Harl”). (<code>distill</code>)</li>
  <li><b>Medium. In “Edit piece”, the X drops what was typed without a word; and the Kind list has no way back but the X</b> (EP1 A, B, C).
    <br>A long text is lost in one tap. The Kind list takes the form’s place with no “Back”, where PU1 and DP3 D have one.
    <br>Fix: if there are changes, the X closes and says “Changes dropped.” with Undo. The Kind list gets “Back”, or the kinds open in place under their row. (<code>harden</code>)</li>
  <li><b>Medium. One count has two names in the same list</b> (DP3 A, C, D; DP3b). <i>New.</i>
    <br>An Area’s group reads “7 Locations” and “13 Locations”, capitalised. A pack reads “212 places”. An Area inside a pack reads “3 places”.
    <br>Fix: one word in the list, lower case: “7 places”. (<code>clarify</code>)</li>
  <li><b>Medium. Line breaks part a number from its word</b> (PS3 A and B, EN5 B, EN1 B, EN4 C, DT1, DT2).
    <br>On a phone the top reads “The Drowned Harbour, turn” with “14” alone on the next line (new in this run). A stat line breaks between a die and its number (“(+0,” then “1d6)”). DT2 C breaks “p.” from “14”.
    <br>Fix: a no-break space in “turn 14” and in “p. 14”, and a stat line breaks only between label-and-value pairs. A build rule; no new drawing. (<code>typeset</code>)</li>
  <li><b>Medium. Boxes three deep</b> (EN1 B to D, EN4 C).
    <br>“Waiting for you”, the encounter’s card and the detail row each draw an edge, inside the screen’s own.
    <br>Fix: inside a card, the detail row loses its box and keeps a dotted rule above and below, as a piece has. The whole row is still the tap. (<code>quieter</code>)</li>
  <li><b>Medium. The rolled row is the card’s title, at heading size</b> (EN1 B and D, EN4 C).
    <br>It is 20 px bold over two lines here, three on a phone. A pack’s 40-word row becomes a block of bold that outranks the place.
    <br>Fix: the row’s words at body size under a short heading (“An encounter”, as the players’ card has), or cut at three lines with the rest behind a tap. (<code>typeset</code>)</li>
  <li><b>Medium. On a phone the third tile stands alone, and two stacked buttons take 96 px above the place’s words</b> (PS3 A, EN5 B; ⚑ 5).
    <br>One tile centred under two reads as a slip. “What everyone knows” and “Rules” one above the other push the place’s words down to about 573 px.
    <br>Fix: the third tile takes the row’s full width, and the two buttons sit side by side as icon-over-word buttons. (<code>layout</code>)</li>
  <li><b>Medium. “Send all” stands in the middle of the sheet, above “Edit the piece’s words”</b> (TR1, TR2 C).
    <br>Fix: put “Send all” at the foot’s right, where “Move” and “Save” are in PU1 and EP1. The edit row goes above the things, or quiet at the foot’s left. (<code>layout</code>)</li>
  <li><b>Medium. A sent piece keeps its arrow, and what a second tap does isn’t drawn</b> (TR1, TR2).
    <br>Fix: a sent piece’s sheet reads “Sent to Wren, turn 3.” with “Take it back” (the Undo’s lasting home) and “Edit the piece’s words”. (<code>harden</code>)</li>
  <li><b>Medium. The band’s three marks have no words, and the encounter’s mark is two drawings</b> (EN1, PS2 C; ⚑ 1).
    <br>Camp, encounter and depart are icons alone, next to “Next turn”, which has a word. A first-time GM has to learn them. The band uses the icon set’s crossed swords, while the tiles and the card keep today’s thin pair.
    <br>Fix: whatever ⚑ 1 picks goes in all three places, and each mark gets a word under it on a tablet, where there is room. (<code>polish</code>)</li>
  <li><b>Low. A place’s own knowledge has no heading, while its Area’s does</b> (KN1 B). <i>New.</i>
    <br>“Sank”, “Owned by” and “Who strips her” start with no name over them. The line between the place’s sections and the Area’s shows only when “The Drowned Harbour” appears.
    <br>Fix: the place’s name, “2. The Wreck”, as a matching heading over its own. (<code>clarify</code>)</li>
  <li><b>Low. The Kind row shows the same jigsaw for every kind</b> (EP1 A, C, D). <i>New.</i>
    <br>“Treasure” and “Someone here” carry one icon, so it says nothing.
    <br>Fix: drop it, or give each kind its own. (<code>polish</code>)</li>
  <li><b>Low. The GM’s “Move on” list repeats one sentence on every row not shown</b> (WT1 A).
    <br>“Not yet shown: players see “4. Unexplored”.” appears three times, wrapping beside two buttons.
    <br>Fix: the closed eye with “4. Unexplored”, the sign a piece already uses; or say it once above the list. (<code>distill</code>)</li>
  <li><b>Low. “Remove this piece” stands where “Back” stands in the next pop-up</b> (EP1, PU1).
    <br>The foot’s left is the safe way out in “Move on”, but a removal in “Edit piece”. Undo covers a slip.
    <br>Fix: “Remove this piece” as a quiet row under “Kind”, so the foot holds “Save” alone. (<code>layout</code>)</li>
  <li><b>Low. The players’ travel pop-up ends in a sentence with only the X</b> (PU1 B, E).
    <br>It says “1 turn.” where the GM’s says “Takes 1 turn.”
    <br>Fix: the GM’s two labelled lines, and a plain “Got it”, as EN5’s card has. (<code>clarify</code>)</li>
  <li><b>Low. In dark, the edge of a field or plain button on a pop-up is 2.97 to 1, under the 3 to 1 floor</b> (DP3, PU1, EP1).

  <h1>Self-review, 26 November</h1>
  <p class="note big"><b>The stylesheet.</b> As before, the page links the one shared mockup stylesheet (<code>../shared/book.css</code>) and its type pass last, and restates none of their rules. Its own rules now stand in three groups in the page’s head: the layout rules copied from page 24; the parts new on 25 November; and the rules of this redraw (the band’s thin rule, the detail row without its box, the line breaks, the encounter card’s picked line, the picked row of a tapped table, the menu, the skeleton rows, the scrolling pop-up, a second indent in the Depart list, the players’ pair at 375 px, an unfolded Knowledge section, the kinds unfolding in place). Every size and gap is a token from 06, or a size the shared parts already carry (the stacked button’s 56 px).</p>
  <p class="note big"><b>Checked</b> (in a browser, both themes, with the scripts of 25 November run again: 725 tappable parts a theme, the smallest 44 px).
  <br>&bull; <b>14 px floor:</b> no text under 14 px inside a frame.
  <br>&bull; <b>44 px targets:</b> every tappable part is at least 44 px in both directions, or a row of a list at least 44 px tall (a menu’s rows are 48). At 375 px the encounter card’s three buttons are 92 px wide each, over the stacked button’s 88: to give them that, the card has no box of its own inside “Waiting for you” on a phone (boxed, they measured 86).
  <br>&bull; <b>8 px gaps:</b> no two separate controls nearer than 8 px. Rows of one list touch, as list rows do: the detail rows of a group now do too, having lost their boxes.
  <br>&bull; <b>375 px:</b> no frame wider than its device; no sideways overflow in any phone, sheet or pop-up. The one overflow found while drawing (“What everyone knows” in half a row, PS3) was fixed by giving that button its own width.
  <br>&bull; <b>One accent a screen or pop-up:</b> “Roll…” or “Done” in “Waiting for you”; “Show players”, “Move”, “Save” and “Send all” in their pop-ups, with the screen’s own accent drawn plain behind them; “Move on” on a place’s card when nothing waits (PS2, C); none on a player’s frame. DT1 holds the same card twice, so “Move on” is drawn plain on both.
  <br>&bull; <b>No disabled button:</b> “Show players” with nothing written stays a button and says why (EN6, E); an offline reveal waits and says so (EN7, B).
  <br>&bull; <b>Undo over confirm:</b> “Dismiss”, “Done”, “Show players”, a changed row, a send, “Take it back”, a share, “Remove this piece” and the X on changed words all act at once with a toast. No confirm dialog is added.
  <br>&bull; <b>Contrast:</b> the table above. One control edge is under its floor, as on 25 November (finding 24).
  <br>&bull; <b>Messy data:</b> a row of forty words in the reveal’s box (EN6); a long name in a pop-up’s head (EN3, PU1); a long Area name and thirteen places, a pack of 212 (DP3); 999 turns (PU1); a long text (EP1); a long table row at 375 px (ET1); a table taller than the screen and a d100 table (EN7); a character with no stat block (EN3); a place with no map number (WT1, C); a long place name in the wide band (PS2, D).
  <br>&bull; <b>Nielsen’s ten, where the redraw moved a score’s cause:</b> status (the card quotes what players see; “Sent to Wren, turn 3.”; “waiting”); the user’s language (“Roll…”, “places”); control (“Change…”, “Take it back”, “Changes dropped.” with Undo, “Revealed” takes back); consistency (one fold mark; an arrow only opens; one encounter mark; words never open a form); error prevention (the preview before a reveal; no eye on a folded row); recognition (the way under “N. Unexplored”; the closed eye on the GM’s rows; “Encounter tables” first in the menu); recovery (EN7’s offline and failed states). The scores themselves are Home Two’s to give again.</p>
