<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Pack tab, whole (2026-11-14): sitting 1, what the first night needs</title>
<link rel="stylesheet" href="../creation/final/final.css">
<link rel="stylesheet" href="pk.css">
<link rel="stylesheet" href="../shared/book.css">
<style>
  /* layout this page needs, formerly read from the sweep pages’ stylesheet (no type, book-format, button, sheet or toast rule) */
  .lab { font-size:14px; color:var(--muted); margin:0 0 var(--space-2); }
  .trio { display:flex; gap:var(--space-4); align-items:flex-start; flex-wrap:wrap; }
  .from { font-size:14px; color:var(--muted); font-style:italic; margin:var(--space-1) 0 0; }
  .efoot { display:flex; justify-content:flex-end; gap:var(--space-2); margin-top:var(--space-3); }
  .fmark { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; flex:none; }
  .fmark.open svg { transform:rotate(180deg); }
  .tablet.wide { width:1024px; }
  /* from pack/07 (the purse, approved): the coin line, the sheets, the boxes */
  .sheetup { max-height:none; }
  .act { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:48px; border-top:1px solid var(--rule); }
  .act .go { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; transform:rotate(-90deg); flex:none; }
  .opt { display:flex; align-items:center; gap:var(--space-2); min-height:44px; padding:var(--space-1) var(--space-3); border:1.5px solid var(--control); border-radius:4px; margin-bottom:var(--space-2); }
  .back2 { display:inline-flex; align-items:center; min-height:44px; text-decoration:underline; text-underline-offset:3px; color:var(--accent); }
  .coinl { display:flex; align-items:center; gap:var(--space-2); min-height:52px; padding:var(--space-1) 0; border-top:3px double var(--rule); }
  .coinl.inlist { border-top:0; border-bottom:1px dotted var(--rule); }
  .coinl .t { flex:1; min-width:0; font-weight:700; }
  .coinl .t small { display:block; font-weight:400; font-size:14px; color:var(--muted); }
  .coinl .go { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; flex:none; transform:rotate(-90deg); }
  .coinl .li { display:inline-flex; color:var(--muted); flex:none; }
  .coinrow { display:grid; grid-template-columns:minmax(0,1fr) 112px; gap:var(--space-3); align-items:center; min-height:52px; padding:var(--space-1) 0; border-bottom:1px dotted var(--rule); }
  .coinrow small { display:block; font-size:14px; color:var(--muted); }
  .coinrow .field { text-align:right; font-weight:700; }
  .tst { position:absolute; left:var(--space-3); right:var(--space-3); bottom:var(--space-3); }
  /* new on this page */
  .b8 { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--ink); color:var(--page); font-size:14px; font-weight:700; margin-left:var(--space-1); box-sizing:border-box; }
  .pk-tabs > span { position:relative; }
  .pk-tabs .b8 { position:absolute; top:var(--space-1); left:calc(50% + 8px); margin:0; }
  .tag8 { display:inline-block; font-size:14px; font-weight:700; border:1.5px solid var(--ink); border-radius:4px; padding:0 var(--space-1); line-height:20px; margin-left:var(--space-2); vertical-align:2px; }
  .grid8 { display:grid; grid-template-columns:150px minmax(0,1fr) minmax(0,1fr); gap:var(--space-4); padding:var(--space-3); align-items:start; }
  .side8 { border-left:1px solid var(--rule); padding-left:var(--space-4); }
  .line8 { display:flex; align-items:center; gap:var(--space-2); min-height:44px; border-bottom:1px dotted var(--rule); padding:var(--space-1) 0; }
  .line8 span:first-child { flex:1; }
  .line8 small { display:block; font-size:14px; color:var(--muted); }
  .hold8 { border:1.5px dashed var(--control); border-radius:4px; min-height:160px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; margin-top:var(--space-2); }
  .sk8 { display:block; height:16px; border-radius:4px; background:var(--rule); margin:var(--space-2) 0; }
  .pill8 { display:inline-flex; align-items:center; gap:var(--space-1); border:1.5px solid var(--warn); color:var(--warn); border-radius:4px; padding:0 var(--space-2); min-height:28px; font-size:14px; font-weight:700; }
  .piece8 { display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:var(--space-2); align-items:center; min-height:52px; border-bottom:1px dotted var(--rule); padding:var(--space-1) 0; }
  .piece8 small { display:block; font-size:14px; color:var(--muted); }
  .eye8 { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; }
  /* this page’s own, for frame PK6b only: the two-line button that was not chosen */
  .btn.stk.two { width:88px; min-width:0; white-space:normal; }
  /* this page’s own, for frame PK12 only: the alternative row, its Take on one line beside its icon */
  .btn.inl { gap:var(--space-1); min-height:44px; border-width:2px; border-color:var(--ink); flex:none; }
  .opt.on { background:var(--wash); border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); font-weight:700; }
  .opt .r { margin-left:auto; font-size:14px; color:var(--muted); font-weight:400; white-space:nowrap; flex:none; }
  .starb { display:inline-flex; width:44px; height:44px; align-items:center; justify-content:center; margin-right:var(--space-2); }
  /* measured (t44-1): the "About" mark is a full 44 px target. Where its target meets the first row under it, the mark's target wins the overlap:
     the small control over the large row (the lead's rule, 2026-11-14); the head is not made taller for it */
  .pk-gh:has(.i) .i { width:44px; }
  .act .li { display:inline-flex; color:var(--muted); margin-right:var(--space-2); flex:none; }
  .act > span:first-child { display:inline-flex; align-items:center; flex:1; }
  .sw2 { display:inline-flex; gap:3px; padding:3px; border:1.5px solid var(--control); border-radius:24px; background:var(--sheet); }
  .sw2 > span { padding:0 var(--space-4); display:inline-flex; align-items:center; }
  .sw2 > span.on { background:var(--wash); font-weight:700; box-shadow:inset 0 0 0 2px var(--accent); }
  .f8s { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--space-3); padding:var(--space-3) var(--space-3) 0; }
  .f8 { border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); padding:var(--space-2) var(--space-3); }
  .f8 .k { display:block; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .f8 .v { display:block; font-weight:700; font-size:20px; line-height:1.2; }
  .f8 .s { display:block; font-size:14px; color:var(--muted); }
  .chips8 { display:flex; flex-wrap:wrap; gap:var(--space-2); align-items:center; margin:var(--space-2) 0; }
  .note8 { border-left:3px solid var(--rule); padding-left:var(--space-3); margin:var(--space-2) 0; }
  /* frames PK8b to PK8d: a long description scrolls inside the sheet; the actions stay at its foot */
  .scroll8 { max-height:230px; overflow:hidden; position:relative; padding-right:var(--space-3); }
  .scroll8::after { content:""; position:absolute; right:0; top:0; width:4px; height:38%; border-radius:2px; background:var(--control); }
  .scroll8::before { content:""; position:absolute; left:0; right:var(--space-3); bottom:0; height:var(--space-5); background:linear-gradient(transparent, var(--popup)); }
  .acts8 { border-top:1px solid var(--rule); margin-top:var(--space-2); }
  .acts8 .act:first-child { border-top:0; }
  .cardb .efoot { margin-top:var(--space-1); }
  .picks { border-collapse:collapse; max-width:1100px; font-size:14px; }
  .picks td, .picks th { text-align:left; vertical-align:top; padding:var(--space-1) var(--space-2); border-bottom:1px solid var(--rule); }
</style>
</head>
<body>
<script src="../creation/final/final.js"></script>
<script src="../creation/final/sweep.js"></script>
<script src="pk.js"></script>
<script src="../december/icons/icons.js"></script>
<script src="../shared/book.js"></script>
<script>
const NEWP = 'Not built in this form. Drawn in the swept dress (pack/05 to 07) for docs/plans/dec-6-the-whole-pack-tab.md.';
const goC = `<span class="go" aria-hidden="true">${I.chev}</span>`;
const X8 = `<span class="btn sq" role="button" aria-label="Close" style="border:0;background:transparent">${I.close}</span>`;
const stk8 = (words, k, o = {}) => `<span class="btn stk${o.accent ? ' accent' : ''}${o.wide ? ' stk-wide' : ''}" role="button">${gi(k, 24)}<span>${words}</span></span>`;
const undo8 = `<span class="tu" role="button">${gi('anticlockwise-rotation', 20)}Undo</span>`;
const badge8 = (n) => `<span class="b8" role="img" aria-label="${n} new">${n}</span>`;
const glab8 = (t) => `<div class="sclab">${t}</div>`;
const sub8 = (t) => `<h3 class="bsub">${t}</h3>`;
const ln8 = (l, v) => `<p class="ln"><span class="lb">${l}</span>${v}</p>`;
const sheet8 = (title, body) => `<div class="sheetup"><div class="head"><span class="title">${title}</span>${X8}</div>${body}</div>`;
const back8 = (to) => `<span class="back2" role="button">‹ ${to}</span>`;
const foot8 = (btn) => `<div class="efoot">${btn}</div>`;
const toast8 = (words, abs) => `<div class="toastb${abs ? ' tst' : ''}" role="status" style="position:${abs ? 'absolute' : 'relative'}"><span class="tmsg">${words}</span>${undo8}<span class="tb" aria-hidden="true"></span></div>`;
// the coin line, as pack/07 (approved); the New tag is this page's
const coinLine8 = (amounts, inList, tag) => `<div class="coinl${inList ? ' inlist' : ''}" role="button" aria-label="Coin: ${amounts}"><span class="t">${amounts}${tag ? '<span class="tag8">New</span>' : ''}</span>${goC}</div>`;
const W3 = '12 crowns, 30 herons, 4 bits';
const LOAD = load(true, 'Light, speed 125', [96, 0, 0], '383 of 1,200 coins');
// a row that opens the stash's own screen: a leading icon before its words (ic-1)
const stashRow8 = (line) => `<div class="coinl" role="button" aria-label="Party stash: ${line}"><span class="li">${gi('open-chest', 24)}</span><span class="t">Party stash<small>${line}</small></span>${goC}</div>`;
const hand8 = (name, act, k) => `<div class="pk-row"><span class="t"><b>${name}</b><small>${G.star}In hand</small></span>${stk8(act, k)}</div>`;
const hands8 = `${gh(true, 'At hand', '2 items')}${hand8('Reed spear', 'Attack', 'broadsword')}${hand8('Storm lantern', 'Light', 'torch')}`;
const rowNew = (name, o) => row(true, name, o).replace('</b>', '</b><span class="tag8">New</span>');
const listsOwn = (more = '', n = '5 items') => `${hands8}${worn(true)}${basket(true)}${gh(true, 'Carried', n)}${carried(true, more)}${tiny(true)}${wait}`;
const pfoot8 = (say, accent = true) => `<div class="pk-foot"><span class="say">${say}</span>${stk8('Add item', 'knapsack', { accent })}</div>`;
const tabs8 = (n) => `<div class="pk-tabs" role="tablist"><span>${G.crown}Player</span><span>${G.fire}Scene</span><span class="on">${G.pouch}Pack${n ? badge8(n) : ''}</span><span>${G.book}Log</span></div>`;
const tabsOn = (on, n) => `<div class="pk-tabs" role="tablist">${[['Player', G.crown], ['Scene', G.fire], ['Pack', G.pouch], ['Log', G.book]].map(([w, i]) => `<span${w === on ? ' class="on"' : ''}>${i}${w}${w === 'Pack' && n ? badge8(n) : ''}</span>`).join('')}</div>`;
// the tablet, as PA6 and PC10 lay it out: the tabs down the left, the list, a right column
const tbar8 = (backTo, title) => `<div class="bar pk-bar pk-wide"><span class="pk-link" role="button" style="min-height:44px;display:inline-flex;align-items:center">‹ ${backTo}</span><span class="title">${title}</span><span class="ico" role="button" aria-label="Messages">${G.mail}</span><span class="ico" role="button" aria-label="Rules">${G.book}</span><span class="ico" role="button" aria-label="More">${I.more}</span></div>`;
const nav8 = (n) => `<div class="pk-nav" role="tablist"><span>${G.crown}Player</span><span>${G.fire}Scene</span><span class="on">${G.pouch}Pack${n ? badge8(n) : ''}</span></div>`;
const tab8 = (cap, backTo, title, left, right, n, from = NEWP) => `<div><p class="cap" style="max-width:1024px">${cap}</p><div class="tablet wide bit">${tbar8(backTo, title)}<div class="grid8">${nav8(n)}<div>${left}</div><div class="side8">${right}</div></div></div><p class="from">${from}</p></div>`;

// ---- PK1: the tab whole on a tablet ----
const pk1 = tab8('PK1. <b>Brought up to the rulings from PA6, PA1 (the swept tab) and 01’s standing frame; the coin line is assembled from approved PC1 and PC10.</b> The Pack tab whole, on a tablet. <b>The bar:</b> the way back and whose pack. <b>Left, the lists</b> as the sweep rules them (psw-1 to psw-3): small-capitals heads with their counts, “Weight” over the figures, a chevron the one fold mark, the foot counting each thing once (“11 items”). The party stash is no longer a fold at the list’s end (pk-4): it is its own screen. <b>Right:</b> the load as built (its state in words, the bar, the figures with the unit said once); <b>under it the coin line, as approved</b> (PC10: “under the load, in the right column”; pu-1, pu-10); then <b>one row, “Party stash”</b>, with what is in it, a leading icon and the chevron: it opens the stash’s screen (frame PK4). The rework fills the right column, which psw-7 kept empty until now. <b>Icons on every button</b> (ic-1): “Attack”, “Light” and “Add item” are stacked buttons, the icon above the word (icons proposed: the table at the page’s end). <b>My picks, each a question in the plan’s list:</b> (1) two columns on a tablet, yes; (2) <b>no row of four facts</b>: the built load line, the approved coin line and the stash’s row say the same with less, and “New” is a card only when something is new (frame PK2); (3) “Add item” stays at the list’s foot with the count, as built, and is the screen’s one accent; (5) the chevron holds for the rework too. One thing waits for the GM (the built card, kept).',
  'The Reed Marches', 'Wren’s pack', `${listsOwn()}${pfoot8('11 items')}`, `${LOAD}${coinLine8(W3)}${stashRow8('7 things')}`);

// ---- PK2: a find has arrived ----
const newCard = (head, lines, accent = true) => `<div class="cardb" role="status">${sub8(head)}${lines.map(([n, s]) => `<p><b>${n}</b><small>${s}</small></p>`).join('')}${foot8(stk8('Got it', 'check-mark', { accent }))}</div>`;
const FIND = [['A waxed pouch', 'From your GM, just now.'], ['Moon opals ×2', 'From your GM, just now.'], ['Silver key', 'Tam gave it to you, day 3.']];
const newRows = `${rowNew('A waxed pouch', { w: 12 })}${rowNew('Moon opals', { q: 2, w: 2 })}${rowNew('Silver key', { w: 0 })}`;
const pk2 = tab8('PK2. <b>Brought up to the rulings from 01’s “arrived” frame and 02’s P1 and P2</b> (pk-5, pk-2, psw-1 to psw-3, ic-1). A find has arrived. <b>The count on the Pack’s icon</b> (“3”, a number in a filled mark, read aloud as “3 new”). <b>“New in your pack”</b>, a card at the head of the right column: each new thing with who it came from and when, and one button, <b>“Got it”</b>, the screen’s accent while it shows (“Add item” is plain meanwhile). <b>A “New” tag on each row</b> until Got it: a word in a box, never colour alone. <b>The things land loose</b>, under “Carried” (pk-2): the app does not ask where they go. Several finds at once are one card (here two from the GM and one from Tam). Got it on the card clears the count, the card and the tags together. The foot counts 14 items.',
  'The Reed Marches', 'Wren’s pack', `${hands8}${worn(true)}${basket(true)}${gh(true, 'Carried', '8 items')}${newRows}${carried(true)}${tiny(true)}${pfoot8('14 items', false)}`, `${newCard('New in your pack', FIND)}${LOAD}${coinLine8(W3)}${stashRow8('7 things')}`, 3);
const elsewhere = (card, n) => `${shell('Wren')}<div class="inner" style="min-height:480px">${card}<div class="hold8">The tab she is on</div></div>${tabsOn('Player', n)}`;
const pk2b = frame('PK2b. <b>New, a proposal</b> (pk-5 in the swept dress; 02’s P1, P5 and S1 drew it in the older dress). <b>First: the card wherever the player is</b>, here on the Player tab: the same card, above that tab’s own content, with “Got it”; the Pack’s icon carries the count. <b>Second: several finds merged</b> into one card (pk-5): the head counts them and says from whom; past four, the last line is “and 2 more”, and the Pack lists them all. <b>Third: a thing sent to the party stash is told to everyone, more quietly</b>: a toast that fades, no card and no count. <b>My pick for question 9:</b> a find for one character shows its card to that character’s player alone; the others see nothing but the log’s line (hidden means hidden: a card can name coin).',
  [col('The card, on another tab', elsewhere(newCard('New in your pack', FIND.slice(0, 2)), 2), 'bit'), col('Several, merged', elsewhere(newCard('6 new things: 5 from your GM, 1 from Tam', [...FIND, ['Bundle of reeds ×8', 'From your GM, just now.'], ['and 2 more', '']]), 6), 'bit'), col('To the stash: a quiet line', `${shell('Wren')}<div class="inner" style="min-height:480px;position:relative"><div class="hold8" style="margin-top:0">The tab she is on</div><div class="toastb tst" role="status"><span class="tmsg">Your GM put a silver ewer in the party stash.</span></div></div>${tabsOn('Player')}`, 'bit')], 1100, NEWP);

// ---- PK3: coin on a find card ----
const packWith = (card, line, n) => `${shell()}<div class="inner">${card}${LOAD}${line}${hands8}</div>${tabs8(n)}`;
const pk3 = frame('PK3. <b>New, a proposal</b> (pu-3, pu-5, pk-5, pk-6; not drawn anywhere before). <b>A find card that names coin.</b> Coin is a line of the card like any other thing, in the pack’s own coin words (pu-10), and it <b>lands in the purse</b>, not in the lists. <b>First:</b> coin and things together: the card names both. <b>Second:</b> coin alone. <b>Third:</b> where it shows afterwards: the coin line reads the new amounts at once and carries the <b>“New” tag</b> until Got it (a word in a box; no line under the amounts, pu-1). The count on the Pack’s icon counts coin as one. <b>Hidden means hidden:</b> a card that names coin is sent to that character’s player alone; nobody else’s screen has it, and the log’s line for the others names no amount.',
  [col('Coin and things', packWith(newCard('New in your pack', [['40 herons', 'From your GM, just now. In your coin.'], ['Moon opals ×2', 'From your GM, just now.']]), coinLine8('12 crowns, 70 herons, 4 bits', false, true), 2), 'bit'), col('Coin alone', packWith(newCard('New in your coin', [['40 herons', 'From your GM, just now.']]), coinLine8('12 crowns, 70 herons, 4 bits', false, true), 1), 'bit'), col('After Got it', packWith('', coinLine8('12 crowns, 70 herons, 4 bits'), 0), 'bit')], 1100, NEWP);

// ---- PK4: the party stash as its own screen ----
const srow = (name, who, o = {}) => `<div class="pk-row"><span class="t"><b>${name}</b>${o.q ? `<span class="q">×${o.q}</span>` : ''}<small>${who}</small></span><span class="wt">${o.w}</span>${stk8('Take', 'grab')}</div>`;
const sgh = (label, n) => `<div class="pk-gh"><span class="l">${label}</span><span class="n">${n}</span><span class="l" style="margin-left:auto;padding-right:84px">Weight</span></div>`;
const stashLists = `${coinLine8('40 herons, 12 bits', true)}${sgh('Loose', '5 items')}${srow('Bundle of reeds', 'Ash put them in, day 2.', { q: 8, w: 80 })}${srow('Moon opals', 'Your GM put them in, today.', { q: 2, w: 2 })}${srow('Reed chest', 'Tam put it in, day 2.', { w: 80 })}${srow('Silver ewer', 'Tam put it in, today.', { w: 30 })}${srow('Torches', 'Moss put them in, day 1.', { q: 6, w: 60 })}${sgh('In the reed chest', '2 items')}${srow('Lamp oil', 'Tam put it in, day 2.', { q: 3, w: 30 })}${srow('Week of fen rations', 'Tam put them in, day 2.', { q: 2, w: 140 })}`;
const stashFacts = `<div class="bk">${ln8('In it.', '7 things.')}${ln8('Last in.', 'Silver ewer. Tam, today.')}${ln8('Last out.', 'Torches ×2. Ash, day 2.')}</div>`;
const recent8 = (first = '') => `${sub8('Recently')}${first}<div class="line8"><span>Tam put in a silver ewer.<small>Today</small></span></div><div class="line8"><span>Ash took 2 torches.<small>Day 2</small></span></div><div class="line8"><span>Your GM put in 2 moon opals.<small>Today</small></span></div>`;
const pk4 = tab8('PK4. <b>Brought up to the rulings from 03’s frames 1 to 3; the coin row is assembled from approved PC6</b> (pk-3, pk-4, pu-3, psw-1 to psw-3, ic-1). The party stash as a screen of its own, opened from the Pack’s “Party stash” row; the bar’s way back returns to the pack. <b>Three facts</b> as labelled lines: what is in it, the last thing in, the last thing out, each with who and when (my pick for question 7; coin is not a fact now). <b>The coin row first</b>, the same row as a character’s coin line, with no button on it (pu-3): a tap opens “Party stash’s coin” (PC6). <b>Then the lists</b>: loose things (“Loose”), then each container’s; every row says who put the thing in and when, carries its weight, and <b>ends in “Take”</b> (pk-3). pk-3’s “Take on every row” and pu-3’s coin row with no button disagree only on the coin row: pu-3 governs it. <b>Right: the taker’s room</b> (Wren’s own load) and the stash’s recent lines; your own line keeps Undo while it can be undone. “You are taking for” shows only for a player with more than one character (not drawn). No accent: nothing here is the one next step. “Put something in” is at the foot.',
  'Wren’s pack', 'Party stash', `${stashFacts}${stashLists}<div class="pk-foot"><span class="say">7 items</span>${stk8('Put in', 'open-chest')}</div>`, `${sub8('Wren’s room')}${LOAD}${recent8()}`);
const stashPh = (extra, h = 560) => `${shell('Party stash')}<div class="inner" style="min-height:${h}px;position:relative;padding-bottom:104px">${coinLine8('40 herons, 12 bits', true)}${sgh('Loose', '4 items')}${srow('Bundle of reeds', 'Ash put them in, day 2.', { q: 8, w: 80 })}${srow('Torches', 'Moss put them in, day 1.', { q: 6, w: 60 })}${extra}</div>`;
