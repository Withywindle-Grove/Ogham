<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Pack tab, the style sweep: batch A, the tab and the stash (2026-11-12)</title>
<link rel="stylesheet" href="../creation/final/final.css">
<link rel="stylesheet" href="../creation/final/sweep.css">
<link rel="stylesheet" href="pk.css">
</head>
<body>
<script src="../creation/final/final.js"></script>
<script src="../creation/final/sweep.js"></script>
<script src="pk.js"></script>
<script>
const full = (sw) => `${shell()}<div class="inner">${load(sw, 'Light, speed 125', [96, 0, 0], '383 of 1,200 coins')}${lists(sw)}${pfoot(sw ? '11 items' : '29 items')}</div>${tabs}`;
const a1 = frame('PA1. The Pack tab, on a phone. <b>Left: as built, today’s type. Right: swept</b> (cs-30: the built screen dressed; nothing it shows removed, nothing it lacks added). The title; the load: its state in words (“Light, speed 125”), the bar in three parts and its figures; the groups under small-capitals heads with their counts, as built (labels over lists, as in Notes): At hand, Worn and in hand, In the reed basket (its ⓘ kept), Carried; a row is the thing’s name in the display type, its quantity, and a chevron to its sheet; the two things at hand keep their starred “In hand” and their action (Attack, Light); “Tiny things” and “Party stash” fold with the chevron (the build’s “+” is kept for adding); the card for a thing waiting for the GM, with the warning sign and words; the foot’s count and the screen’s one accent, “Add item”; the tabs. <b>A weight’s unit is said once</b> (ruled): on the load’s line (“383 of 1,200 coins’ weight”); each row carries its figure at the right, under a small-capitals “Weight” at the right edge of its group’s head, so a figure is never read as the count said twice (“Eel hooks ×12 … 12”). “Weight” is on every head that has the column (three here), not once: each group can scroll into view alone. <b>The cure of a fault, flagged:</b> the foot counts each thing the character carries once (“11 items”): the rows of the pack’s own groups (1 worn, 2 in the basket, 5 carried, 1 tiny thing) and the two under “At hand”, which appear nowhere else. The party’s stash is not the character’s and is not counted. The build counts quantities (“29 items”). <b>The two first heads, both the app’s ruled words:</b> “At hand” holds the things the player has pinned that have an action to take now (the star); a pinned thing shows only there, taken out of its own group. “Worn and in hand” is the first of the pack’s groups by where things are carried. <b>Where the approved rework’s coin will land</b> (pack/01, not built, not drawn here): a coin line under the load, opening the purse’s sheet; today the tab shows no coin.',
  [col('As built, today’s type', full(false)), col('Swept', full(true), 'bit')], 720, PK_CHK);
// ---- over the limit, messy ----
const overLists = (sw) => `${hands(sw)}${worn(sw)}${gh(sw, 'Carried', '4 items')}${row(sw, 'Bog-iron coat', { w: 400 })}${row(sw, 'Drowned bell from the old chapel of the Nine Lanterns below the weir', { w: 300 })}${row(sw, 'Lamp oil', { q: 999, w: 999 })}${row(sw, 'Reed whistle on a cord', { w: 0 })}${tiny(sw)}${fold(sw, 'Party stash', [sw ? 'Nothing in the Party stash yet.' : 'Nothing in the Party stash yet. Things given to it show here.'])}`;
const over = (sw) => `${shell()}<div class="inner">${load(sw, 'Can’t move', [100, 100, 100], '1,849 of 1,200 coins', true)}${overLists(sw)}${pfoot(sw ? '8 items' : '1,007 items')}</div>${tabs}`;
const a2 = frame('PA2. Over the limit, with messy data. <b>Left: as built, today’s type. Right: swept.</b> The state reads “Can’t move” with the warning sign, in the warning tone, and the bar’s three parts are full in that tone: a sign, words and a full bar, never the colour alone. Messy: a very long name wraps and its figure and chevron keep their place; 999 of a thing; a weight of 0; an empty stash, in the build’s words cut to their first sentence (“Nothing in the Party stash yet.”; the build adds “Things given to it show here.”). The foot counts each thing once (8: 2 in hand, 1 worn, 4 carried, 1 tiny), where the build would say 1,007.',
  [col('As built, today’s type', over(false)), col('Swept', over(true), 'bit')], 720, PK_CHK);
// ---- empty ----
const empty = (sw) => `${shell()}<div class="inner" style="min-height:420px">${load(sw, 'Light, speed 125', [0, 0, 0], '0 of 1,200 coins')}<p style="margin:var(--space-3) 0">Nothing carried yet. Add what you take on the road.</p>${fold(sw, 'Party stash', STASH)}${pfoot('0 items')}</div>${tabs}`;
const a3 = frame('PA3. Nothing carried yet. <b>Left: as built, today’s type. Right: swept:</b> the load at 0, the build’s one sentence, the party stash still within reach, the foot at “0 items” with “Add item”.',
  [col('As built, today’s type', empty(false)), col('Swept', empty(true), 'bit')], 720, PK_CHK);
// ---- the party stash, opened in the tab ----
const stashOpen = (sw) => `${shell()}<div class="inner">${gh(sw, 'Carried', '5 items')}${row(sw, 'Reed basket', { w: 20 })}${row(sw, 'River pearls', { q: 6, w: 6 })}${tiny(sw)}${wait}${fold(sw, 'Party stash', STASH, true)}${row(sw, 'Bundle of reeds', { q: 8, w: 80 })}${row(sw, 'Silver ewer', { w: 30 })}${row(sw, 'Week of fen rations', { q: 2, w: 140 })}<div style="margin-top:var(--space-2)${sw ? ';display:flex;justify-content:flex-end' : ''}"><span class="btn">Add to the Party stash</span></div>${pfoot(sw ? '11 items' : '29 items')}</div>${tabs}`;
const a4 = frame('PA4. The party stash, opened inside the tab (the end of the list; the top is frame PA1). <b>Left: as built, today’s type. Right: swept:</b> the fold open, its chevron turned (the build shows “−”); <b>an open fold drops its summary line</b> (ruled 2026-11-12: “3 items: Bundle of reeds ×8…” over the very rows it lists says it twice; the summary shows only while the fold is shut; the same for “Tiny things”); the stash’s things as the same rows, “Weight” over their figures on the fold’s own line; “Add to the Party stash” under them, right-justified; the foot still counts the character’s own pack. <b>Where the approved rework will land</b> (pack/03, not built, not drawn here): the stash as a screen of its own, with who put each thing in, Take on every row, and its coin.',
  [col('As built, today’s type', stashOpen(false)), col('Swept', stashOpen(true), 'bit')], 720, PK_CHK);
// ---- the GM's view ----
const gmBar = `<div class="bar pk-bar pk-wide"><span class="pk-link" role="button" style="min-height:44px;display:inline-flex;align-items:center">‹ Players</span><span class="title"></span><span class="ico" role="button" aria-label="Messages">${G.mail}</span><span class="ico" role="button" aria-label="Rules">${G.book}</span><span class="ico" role="button" aria-label="More">${I.more}</span></div>`;
const gm = (sw) => `${gmBar}<div class="inner" style="min-height:520px"><div class="pk-chips" role="group" aria-label="Whose pack"><span class="btn on" role="button" aria-pressed="true">Party stash</span><span class="btn" role="button">Fenna of the Long Causeway</span><span class="btn" role="button">Moss</span><span class="btn" role="button">Wren</span></div><h2 style="text-align:center;margin:0 0 var(--space-2);font-variant:normal;text-transform:none;letter-spacing:0;font-size:24px">Party stash</h2><div class="pk-gh" style="justify-content:flex-end">${sw ? '<span class="l" style="padding-right:44px">Weight</span>' : ''}</div>${row(sw, 'Bundle of reeds', { q: 8, w: 80 })}${row(sw, 'Silver ewer', { w: 30 })}${row(sw, 'Week of fen rations', { q: 2, w: 140 })}${pfoot(sw ? '3 items' : '11 items')}</div>`;
const a5 = frame('PA5. The GM’s view of packs: a chip a pack (the party stash, then each character), the chosen one marked by wash, edge and bold; then that pack’s list. <b>Left: as built, today’s type. Right: swept.</b> The chips stay chips (ruled: a switch is for two or three sides; a party can be eight); a long name keeps its chip whole and the chips wrap: in the wider face they take three rows here where the build’s take two; no name is cut. The foot counts rows (3; the build says 11). <b>Not in the built picture:</b> a character’s pack under the GM’s chips, which I take to be frame PA1’s list; the load’s line for the stash (it has no limit, so none is drawn).',
  [col('As built, today’s type', gm(false)), col('Swept', gm(true), 'bit')], 720, PK_CHK);
// ---- the tablet, as built: no re-layout ----
const tabletFull = `<div><p class="cap" style="max-width:1024px">PA6. The Pack tab at the iPad’s width, swept, <b>as built</b> (the sweep does not re-lay out a screen): the way back and the title in the bar; the app’s three tabs down the left; the pack’s list in one column; and at the right the load alone. <b>Flagged for the lead:</b> the right column is nearly empty in the build (the load, then nothing); drawn as built. The approved rework (pack/01) puts the four facts and the stash there.</p><div class="tablet wide bit"><div class="bar pk-bar pk-wide"><span class="pk-link" role="button" style="min-height:44px;display:inline-flex;align-items:center">‹ The Reed Marches</span><span class="title">Wren’s pack</span><span class="ico" role="button" aria-label="Messages">${G.mail}</span><span class="ico" role="button" aria-label="Rules">${G.book}</span><span class="ico" role="button" aria-label="More">${I.more}</span></div><div style="display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1.2fr);gap:var(--space-4);padding:var(--space-3);align-items:start"><div class="pk-nav" role="tablist"><span>${G.crown}Player</span><span>${G.fire}Scene</span><span class="on">${G.pouch}Pack</span></div><div>${lists(true)}${pfoot('11 items')}</div><div style="border-left:1px solid var(--rule);padding-left:var(--space-4)">${load(true, 'Light, speed 125', [96, 0, 0], '383 of 1,200 coins')}</div></div></div><p class="from">${PK_CHK}</p></div>`;

mount(`
  <h1>The Pack tab, the style sweep: batch A</h1>
  <p class="note">The Pack tab as it is built today, dressed in the type pair and today’s standards: the tab, over the limit, empty, the party stash opened, the GM’s view, and the tablet. Drawn from the Builder’s pictures of the real app (pack-as-built, 2026-11-12). The principle is cs-30: dress the built screen; remove nothing it shows, add nothing it lacks; where the build has a fault, draw it cured and flag it. <b>The approved Pack rework (pack/01 to 04) is not built and is not drawn here</b>; a line on a frame says where its coin and its stash will land. Names, words and numbers are invented. A proposal from the Design Studio, not ruled.</p>
  <h1>The tab</h1>
  <div class="wall">${a1}</div>
  <div class="wall">${tabletFull}</div>
  <h1>Over the limit; nothing carried</h1>
  <div class="wall">${a2}</div>
  <div class="wall">${a3}</div>
  <h1>The party stash, opened; the GM’s view</h1>
  <div class="wall">${a4}</div>
  <div class="wall">${a5}</div>
  <h1>Questions (drafts for the lead’s list)</h1>
  <p class="note"><b>1. A row’s weight is a figure at its right, under “Weight” on its group’s head</b> (ruled 2026-11-12); the unit is said once, on the load’s line.</p>
  <p class="note"><b>3. The foot’s count</b> (ruled 2026-11-12): each thing the character carries, once; tiny things count; the stash does not.</p>
  <h1>Self-review</h1>
  <p class="note"><b>Checked.</b> Each frame beside the built picture. One accent a screen (“Add item”). No disabled button. Never colour alone: over the limit is a sign, words and a full bar; the chosen chip has an edge and bold. Targets 44 px (rows 52, the ⓘ, the chevrons, the fold marks, the chips, the tabs 56). One fold mark. Messy: a very long name, ×999, 0 and 999, an empty stash, 1,849 over 1,200. Light and dark side by side; 375 px and the iPad’s width.</p>
  <p class="note"><b>For the Builder’s sweep, a contrast point:</b> in dark the load bar’s unfilled parts are faint against the page; it is the build’s own and is left as it is. <b>Not checked, or gaps.</b> No built picture of: Tiny things opened; the waiting-for-the-GM card opened; a container’s ⓘ; a character’s pack under the GM’s chips; loading, offline and error states; any light theme. The built tablet pictures of over, empty, stash and the GM’s view were not opened. Contrast by measurement; Larger text.</p>
`);
applyPair();
</script>
</body>
</html>
