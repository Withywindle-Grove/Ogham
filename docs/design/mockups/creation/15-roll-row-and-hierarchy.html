<!doctype html>

<style>

  :root { --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; }

  .wall { display:flex; flex-wrap:wrap; gap:var(--space-4); align-items:flex-start; }
  .phone { width:343px; background:var(--page); border:1.5px solid var(--control); border-radius:4px; box-sizing:border-box; overflow:hidden; }
  .tablet { width:740px; background:var(--page); border:1.5px solid var(--control); border-radius:4px; box-sizing:border-box; overflow:hidden; }
  .inner { padding:var(--space-3); }
  .cap { font-size:14px; color:var(--muted); margin:0 0 var(--space-2); max-width:740px; }
  .bar { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; min-height:52px; padding:0 var(--space-1); border-bottom:1px solid var(--rule); }
  .bar .title { text-align:center; font-family:"EB Garamond", Georgia, serif; font-size:20px; font-weight:600; line-height:1.2; }
  .ico { width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink); }
  .meta { font-size:14px; color:var(--muted); }
  .do { font-size:16px; margin:var(--space-2) 0 var(--space-3); }
  .roll { display:flex; align-items:flex-start; gap:var(--space-2); font-weight:700; margin:var(--space-3) 0 var(--space-2); }
  .roll svg { margin-top:2px; }
  .card { background:var(--sheet); border:1px solid var(--rule); border-radius:4px; padding:var(--space-3); margin-bottom:var(--space-2); }
  .kv { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); min-height:44px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:44px; min-width:44px; padding:10px 12px; border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); color:var(--ink); font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:16px; line-height:1.2; box-sizing:border-box; }

  .btn.sq { width:44px; padding:10px; }
  .btn.small { font-family:"Atkinson Hyperlegible", Arial, sans-serif; font-weight:400; }
  .btn.wide { display:flex; width:100%; }
  .num { width:64px; min-height:44px; border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); display:inline-flex; align-items:center; justify-content:center; font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:20px; box-sizing:border-box; }
  .num.usual { color:var(--muted); font-weight:400; }
  .stepper { display:inline-flex; gap:var(--space-2); align-items:center; }
  .usualline { font-size:14px; color:var(--muted); margin-top:var(--space-1); }
  .help { background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:var(--space-3); margin:var(--space-2) 0 var(--space-3); }
  .warnline { color:var(--warn); font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  .foot { display:flex; justify-content:flex-end; align-items:center; gap:var(--space-2); border-top:1px solid var(--rule); margin-top:var(--space-3); padding-top:var(--space-3); flex-wrap:wrap; }
  .foot .say { flex:1; font-size:14px; color:var(--muted); min-width:120px; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-3); }

  .thresh { font-size:14px; color:var(--muted); }
  svg { flex:none; }
</style>
</head>

<template id="screens">
  <h1>The Roll row, and the hierarchy pass over a step</h1>
  <p class="note">Players skimmed past the roll instructions (P6, P13, P18, P19). The fix is one shape used everywhere a player rolls, and one order on every step: (1) the title; (2) one line saying what to do here, body size; (3) the Roll row: the die's solid, the instruction in bold, nothing under 16 px; (4) the fields, each with its average value prefilled and marked in words until touched (P3); (5) captions only for what a number changes; (6) Help me choose, full width, after the instruction and before the fields. Back is the ← in the bar (P2). The warning sign marks closed rows and limits (Francis, 2026-11-06).</p>

  <h1>1 · Scores, phone</h1>
  <div class="wall">
    <div>
      <p class="cap">Nothing touched yet: every score shows the usual 10 in lighter weight with the line "Average value · replace with your roll". Help me choose is closed.</p>
      <div class="phone">
        <div class="bar"><span class="ico" role="button" aria-label="Back"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="title">Scores</span><span class="ico" role="button" aria-label="More"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></span></div>
        <div class="inner">
          <p class="meta">Step 1 of 9</p>
          <p class="do">Six numbers say what your character is naturally good at.</p>
          <div class="roll"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2L21 7V17L12 22L3 17V7z" fill="none" stroke="var(--d6)" stroke-width="2" stroke-linejoin="round"/><path d="M12 12L3 7M12 12L21 7M12 12V22" fill="none" stroke="var(--d6)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Roll 3d6 at the table for each score, then enter what you rolled.</span></div>

          <div class="card"><div class="kv"><span>Nimbleness</span><span class="stepper"><span class="btn sq">−</span><span class="num usual">10</span><span class="btn sq">+</span></span></div><div class="usualline">Average value · replace with your roll</div></div>
          <div class="card"><div class="kv"><span>Grit</span><span class="stepper"><span class="btn sq">−</span><span class="num usual">10</span><span class="btn sq">+</span></span></div><div class="usualline">Average value · replace with your roll</div></div>
          <p class="meta">Wits, Lore and Charm follow, the same.</p>
          <div class="foot"><span class="say">0 of 6 rolled</span><span class="btn accent">Next</span></div>
        </div>
      </div>
    </div>
    <div>
      <p class="cap">Two rolled, Help me choose open as a full-width box that grows to its text (P5), closed by its ✕. A rolled score is full weight and its caption says what the number changes; the untouched ones keep the average line.</p>
      <div class="phone">
        <div class="bar"><span class="ico" role="button" aria-label="Back"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="title">Scores</span><span class="ico" role="button" aria-label="More"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></span></div>
        <div class="inner">
          <p class="meta">Step 1 of 9</p>
          <p class="do">Six numbers say what your character is naturally good at.</p>
          <div class="roll"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2L21 7V17L12 22L3 17V7z" fill="none" stroke="var(--d6)" stroke-width="2" stroke-linejoin="round"/><path d="M12 12L3 7M12 12L21 7M12 12V22" fill="none" stroke="var(--d6)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Roll 3d6 at the table for each score, then enter what you rolled.</span></div>
          <div class="help" style="position:relative;padding-right:52px"><span class="btn sq" role="button" aria-label="Close help" style="position:absolute;top:4px;right:4px;border:0;background:transparent"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg></span>Ability scores are the numbers that say what your character is naturally good or bad at: strength, quickness, wits and so on. You roll them at the table, as your setting says, and type in what you rolled. They decide which choices are open to you later, and they give small bonuses or penalties that follow you everywhere; each tile shows what its number changes. If you're unsure, keep them as rolled, or ask your GM.</div>

          <div class="card"><div class="kv"><span>Grit</span><span class="stepper"><span class="btn sq">−</span><span class="num usual">10</span><span class="btn sq">+</span></span></div><div class="usualline">Average value · replace with your roll</div></div>

      <div class="phone">
        <div class="bar"><span class="ico" role="button" aria-label="Back"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="title">Adjust scores</span><span class="ico" role="button" aria-label="More"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></span></div>

  <h1>4 · The Roll row, every shape it takes</h1>
  <p class="cap">One component (an inventory row in 06): the die's outline in its own colour, the instruction in bold, then what to enter. The outline matches the die (P15).</p>
  <div class="phone">
    <div class="inner">
      <div class="roll"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2.5L21.5 20.5H2.5z" fill="none" stroke="var(--d4)" stroke-width="2" stroke-linejoin="round"/><path d="M12 2.5L11 13.5M11 13.5L2.5 20.5M11 13.5L21.5 20.5" fill="none" stroke="var(--d4)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></svg><span>Roll d4 for your starting torches.</span></div>
