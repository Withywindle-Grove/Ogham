<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The phone's tab bar and drawer (approved 2026-11-07)</title>
<style>
  /* Tokens from docs/06 only. Light and dark side by side (the dark column is the same markup, cloned). Buttons are plain blocks. Invented names and numbers only. Phones at 375 px (343 inside the margins). */
  :root { --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; }
  body { margin:0; font-family:"Atkinson Hyperlegible", Arial, sans-serif; font-size:16px; line-height:1.5; background:#888; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-5); padding:var(--space-5); align-items:start; }
  .theme { padding:var(--space-4); border-radius:4px; background:var(--page); color:var(--ink); }
  .light { --page:#FAFAF7; --surface:#F2F1EC; --sheet:#FFFFFF; --ink:#191714; --muted:#5E574C; --rule:#D6D3CC; --control:#8A8378; --accent:#6E2A1F; --on-accent:#FFFFFF; --info:#2F5D7C; --warn:#7A4A00; --wash:#F3E7E3; --glow:#C98A1E; }
  .dark  { --page:#12100D; --surface:#1C1915; --sheet:#1E1A16; --ink:#F1EADC; --muted:#B5AA96; --rule:#3A342B; --control:#756B5A; --accent:#C9875A; --on-accent:#12100D; --info:#8DB4D0; --warn:#F2D46B; --wash:#3A2A20; --glow:#E6BA66; }
  h1 { font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:24px; line-height:1.2; margin:var(--space-5) 0 var(--space-2); }
  h1:first-child { margin-top:0; }
  .wall { display:flex; flex-wrap:wrap; gap:var(--space-4); align-items:flex-start; }
  .phone { width:343px; height:640px; background:var(--page); border:1.5px solid var(--control); border-radius:4px; box-sizing:border-box; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .inner { padding:var(--space-3); flex:1; overflow:hidden; }
  .cap { font-size:14px; color:var(--muted); margin:0 0 var(--space-2); width:343px; }
  .bar { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; min-height:52px; padding:0 var(--space-1); border-bottom:1px solid var(--rule); flex:none; }
  .bar .title { text-align:center; font-family:"EB Garamond", Georgia, serif; font-size:20px; font-weight:600; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ico { width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink); }
  h2 { font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:20px; line-height:1.2; margin:var(--space-3) 0 var(--space-2); font-variant:small-caps; }
  .meta { font-size:14px; color:var(--muted); }
  .list { border-top:1px solid var(--rule); }
  .kv { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); min-height:52px; padding:var(--space-2) 0; border-bottom:1px solid var(--rule); }
  .kv .k { color:var(--muted); flex:none; }
  .kv .v { text-align:right; flex:1; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:44px; min-width:44px; padding:10px 12px; border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); color:var(--ink); font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:16px; line-height:1.2; box-sizing:border-box; }
  .btn.accent { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .card { background:var(--sheet); border:1px solid var(--rule); border-radius:4px; padding:var(--space-3); margin-bottom:var(--space-2); }
  /* the tab bar */
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--rule); background:var(--page); flex:none; }
  .tab { min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:14px; color:var(--muted); position:relative; }
  .tab.on { color:var(--ink); font-weight:700; }
  .tab.on::after { content:""; position:absolute; top:0; left:25%; right:25%; height:3px; background:var(--accent); border-radius:0 0 2px 2px; }
  .badge { position:absolute; top:6px; right:calc(50% - 34px); min-width:18px; height:18px; border-radius:9px; background:var(--accent); color:var(--on-accent); font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
  /* the drawer */
  .dim { position:absolute; inset:0; background:rgba(0,0,0,0.35); }
  .drawer { position:absolute; top:0; bottom:0; left:0; width:280px; background:var(--sheet); border-right:1px solid var(--rule); display:flex; flex-direction:column; }
  .dhead { display:flex; align-items:center; justify-content:space-between; padding:var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-bottom:1px solid var(--rule); min-height:52px; }
  .dhead .name { font-family:"EB Garamond", Georgia, serif; font-size:20px; font-weight:600; }
  .dsec { font-size:14px; color:var(--muted); padding:var(--space-3) var(--space-3) var(--space-1); }
  .drow { display:flex; align-items:center; gap:var(--space-3); min-height:48px; padding:0 var(--space-3); }
  .drow.on { background:var(--wash); }
  .drow .ico { width:24px; height:24px; }
  .drow small { display:block; font-size:14px; color:var(--muted); }
  .dfoot { margin-top:auto; border-top:1px solid var(--rule); }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--surface); border:1.5px solid var(--control); display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
  .note { font-size:14px; color:var(--muted); margin:var(--space-2) 0 var(--space-4); }
  .glow { color:var(--glow); }
  svg { flex:none; }
</style>
</head>

  <h1>The phone's navigation: a tab bar for play, a drawer for the rest (N1, ruled C)</h1>
  <p class="note">Four tabs, always there in play: Player, Scene, Pack, Log. The ≡ at the top left opens a drawer with everything else, grouped, the signed-in person at its foot. Inside creation and other flows the bar hides and the ← bar takes over (mockups 15 and 16). The tablet keeps its side rail: the same four, plus the drawer's groups unfolded under them.</p>
