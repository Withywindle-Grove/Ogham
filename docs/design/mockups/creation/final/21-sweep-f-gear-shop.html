<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creation, the style sweep: batch F, Gear and the shop (2026-11-12)</title>
<link rel="stylesheet" href="final.css">
<link rel="stylesheet" href="sweep.css">
<style>
  .sheetup { max-height:none; }
  .lbl { font-size:14px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin:var(--space-3) 0 var(--space-1); }
  .unit { color:var(--muted); margin-left:var(--space-2); }
  .drow { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); padding:var(--space-2) 0; border-bottom:1px dotted var(--rule); }
  .drow small { display:block; font-size:14px; color:var(--muted); }
  .drow .btn { flex:none; }
  .drow small svg, .drow b svg { vertical-align:-3px; margin-right:1px; }
  .rolled { display:flex; gap:var(--space-2); align-items:center; margin-bottom:var(--space-2); flex-wrap:wrap; }
  .rolled .field { width:88px; flex:none; }
  .nrow { display:flex; align-items:center; gap:var(--space-3); min-height:44px; padding:var(--space-1) var(--space-3); border:1.5px solid var(--control); border-radius:4px; margin-bottom:var(--space-1); }
  .nrow.on { background:var(--wash); border-color:var(--accent); }
  .nrow .ck { margin-left:auto; }
  .tt .tr.tw { grid-template-columns:4.6em minmax(0,1fr) auto; }
  .tt .tr .minus { margin:var(--space-1) 0 var(--space-1) var(--space-2); }
  .tt.two { display:grid; grid-template-columns:1fr 1fr; }
  .tt.two .tbar, .tt.two .th2 { grid-column:1 / -1; }
  .two-btn { display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-2); }
  .bartrack { height:8px; border:1px solid var(--control); border-radius:4px; margin-top:var(--space-1); }
  .bartrack span { display:block; height:100%; background:var(--ink); border-radius:3px; }
  .price { font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:18px; white-space:nowrap; }
  .prow:has(.price) { grid-template-columns:44px minmax(0,1fr) auto auto; }
  .shoprow:has(.price) { grid-template-columns:44px minmax(0,1fr) auto; }
  .price.kp { float:right; margin-left:var(--space-3); color:var(--ink); line-height:1.2; }
  .sfig .stepper .num { width:auto; min-width:44px; padding:0 var(--space-1); box-sizing:border-box; }
  .btn.ibw { flex-direction:column; gap:0; min-width:56px; min-height:56px; padding:var(--space-1); box-sizing:border-box; font-size:14px; line-height:1.15; }
  .shoprow:has(.ibw) { grid-template-columns:44px minmax(0,1fr) auto; column-gap:var(--space-2); }
  .popc { position:absolute; left:var(--space-3); right:var(--space-3); top:30%; background:var(--sheet); border:1.5px solid var(--control); border-radius:4px; padding:var(--space-3); }
  .phead { display:flex; justify-content:space-between; align-items:baseline; gap:var(--space-2); margin-top:var(--space-3); }
  .srow2 { padding:var(--space-2) 0; border-bottom:1px dotted var(--rule); }
  .srow2 .s1 { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); }
  .srow2 .nm { text-decoration:underline; text-underline-offset:3px; padding:10px 0; }
  .catrow { display:flex; justify-content:space-between; align-items:center; min-height:44px; margin-top:var(--space-2); border-top:3px double var(--rule); }
  .backl { display:inline-flex; align-items:center; gap:var(--space-1); min-height:44px; text-decoration:underline; text-underline-offset:3px; }
  .sfig { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); }
  .sfig .stepper { flex:none; }
  .tt.two .tr:nth-of-type(even) { background:transparent; }
  .tt.two .tr:nth-of-type(4n+2), .tt.two .tr:nth-of-type(4n+3) { background:color-mix(in srgb, var(--ink) 7%, transparent); }
  .tt.two .tr.on { background:var(--wash); }
  .shoprow { display:grid; grid-template-columns:44px minmax(0,1fr); column-gap:var(--space-1); align-items:center; }
  .shoprow .i { width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--info); }
</style>
</head>
<body>
<script src="final.js"></script>
<script src="../../december/icons/icons.js"></script>
<script src="sweep.js"></script>
<script src="entries.js"></script>
<script>
const fld = (v, empty) => `<span class="field${empty ? ' empty' : ''}">${v}</span>`;
const sheetOf = (title, inner, book) => `<div class="dim"></div><div class="sheetup"><div class="head">${book ? `<span class="ehead">${title}</span>` : `<span class="title">${title}</span>`}<span class="btn sq" role="button" aria-label="Close" style="border:0;background:transparent">${I.close}</span></div>${inner}</div>`;
const tt = (title, head, rows, o = {}) => `<div class="tt${o.two ? ' two' : ''}"><div class="tbar">${title}</div>${(o.two ? [0, 1] : [0]).map(() => `<div class="th"><span>${die(o.d === 100 ? 10 : o.d, 16)}d${o.d}</span><span>${head}</span><span></span></div>`).join('')}${rows.map(([n, w, st]) => `<div class="tr${st === 'twice' ? ' on tw' : st ? ' ' + st : ''}" role="button"><span class="n">${n}</span><span>${w}</span><span>${st === 'on' ? '✓' : st === 'twice' ? `✓✓<span class="btn sq minus" role="button" aria-label="One fewer">−</span>` : ''}</span></div>`).join('')}</div>`;
// ---- Gear, redrawn from the built step (the Builder's pictures, 2026-11-12) ----
const CHK = 'Checked against the built screen’s picture (creation-as-built on the pictures branch; the gallery’s frame, not the app’s shell).';
const yours = `<h3 class="sec">Yours already</h3><div class="drow" role="button" aria-expanded="false"><span><b>Given to every character</b><small>6 items: Reed rope, Storm lantern, Dry rations ×2…</small></span>${foldMark(false)}</div>`;
const coin = (v, line, avg) => `<h3 class="sec" style="margin-top:var(--space-2)">Starting coin</h3>${roll(6, 'Roll 3d6 × 10, then enter it.')}<div>${stepper(v, avg)}<span class="unit">silver</span></div><div class="avgline">${line}</div>`;
const kitRow = (name, price, blurb, state) => `<div class="card${state === 'picked' ? ' picked' : ''}"><div class="prow"><span class="i" role="button" aria-label="About ${name}">${I.info}</span><div class="text">${name}</div><span class="btn${state === 'accent' ? ' accent' : ''}">${state === 'picked' ? 'Picked ✓' : 'Pick'}</span></div><div class="under"><span class="price kp">${price}</span>${blurb}</div></div>`;
const extras = (n) => `<div class="drow" role="button" aria-expanded="false"><span><b>Odds and ends: pick up to 2</b><small>${n} of 2 picked. 6 to choose from</small></span>${foldMark(false)}</div>`;
const trinketRow = (rolled) => (rolled ? `<div class="drow"><span><b>Trinket</b><small>Rolled 11: a pebble that is always warm, and hums when the fen floods</small></span><span class="btn">Change</span></div>` : `<div class="drow"><span><b>Trinket</b><small>Stone kin, ${die(10, 16)}d100. Not rolled yet</small></span><span class="btn">Open</span></div>`);
const shopRow = `<div class="drow"><span><b>The shop</b></span><span class="btn">Open</span></div>`;
const gearFoot = (say, accent, wide) => (wide ? footL(say, accent ? 'accent' : 'plain', true).replace('class="foot"', 'class="foot" style="margin:0;padding:var(--space-3);flex-wrap:nowrap"') : footL(say, accent ? 'accent' : 'plain'));
const load = `<div class="card" style="margin-top:var(--space-3)"><div class="kv"><div class="text">Load<small>290 of 500 coins’ weight. Unburdened, speed 30</small></div></div><div class="bartrack"><span style="width:58%"></span></div></div>`;
const gearHead = `<p class="meta">Step 10 of 12</p><p class="do">What you carry into your first adventure.</p>${helpGap}`;
const untouchedBody = `${coin(100, 'Average', true)}<h3 class="sec">To choose (pick 1)</h3>${kitRow('Dredger’s kit', 'Free', 'A dredger’s working gear: a coat, two tools and one small thing.', 'accent')}${kitRow('Ferryman’s kit', '20 silver', 'Everything a ferryman carries on the long crossings between the marsh towns: pole, lantern and oilskin, with a week of dry food.')}${extras(0)}${trinketRow(false)}${shopRow}${yours}`;
const afterBody = `${coin(120, '120 rolled, 14 spent: 106 left')}<h3 class="sec">To choose (pick 1)</h3>${kitRow('Dredger’s kit', 'Free', 'Reed rope, waxed coat, bog sling, reed spear, eel hooks', 'picked').replace('</div></div>', `</div><div class="under">${warn('Waxed coat: a Reed Witch can’t wear it; carried')}</div></div>`)}<div class="two-btn"><span class="btn">Change the rolls</span><span class="btn">Take it off</span></div>${extras(1)}${trinketRow(true)}${shopRow}${yours}${load}`;
const f1 = frame('F1. Gear, untouched, on a phone, swept, <b>redrawn from the built step</b>. One line and “Help me choose” with its gap, as built; the coin under its own sub-heading (the roll row says only the act, the unit once, “Average”); <b>“To choose (pick 1)”</b>, the count kept as information; each kit a row with the ⓘ, its name and Pick, the pack’s blurb under it and the price at the right of the blurb’s first line (the source is in the entry); <b>a pick table as one folded row</b>, like “Given to every character”: its heading with its count (“Odds and ends: pick up to 2”), under it “0 of 2 picked. 6 to choose from”, the chevron at the right; <b>the trinket’s row</b> naming whose table it is, its die and “Not rolled yet”, with Open; <b>the shop as a row</b> with Open; “Yours already”; the foot with “Decide later” at the left, the state, Back and Next. <b>Changed from the build, all ruled 2026-11-12:</b> no roll row over the pick table or the trinket (the die belongs in the table’s sheet); “Nothing picked yet” goes (the count says it); the shop row’s second line goes; the boxed “to spend” tally at the foot of the list goes (the coin’s own line carries it once something is spent); the “+” on a fold becomes the chevron. The bar is the live shell’s (the back arrow, the title centred, “⋯”, the count under it); the first built picture’s bar was a fallback and is not drawn. Starting coin is the same roll at any starting level (ruled by Francis 2026-11-12).',
  [col('Swept', `${bar('Gear')}<div class="inner">${gearHead}${untouchedBody}${gearFoot('No kit yet, nothing bought')}</div>`, 'bit')], 720, CHK);
const f2 = frame('F2. Gear after a kit, one pick from the table, a trinket and the shop, swept, in the same built order: the coin’s sum in words, once (“120 rolled, 14 spent: 106 left”); the picked kit on the wash, what it gave in the blurb’s place, and a thing the class cannot wear said with the warning sign (carried, never refused); “Change the rolls” and “Take it off”; the pick table’s count now “1 of 2 picked”; the trinket’s row reading what was rolled, with Change; the shop’s row; “Yours already”; the load. Next takes the accent. The after state is not in the Builder’s pictures: it is the untouched step’s parts with the gallery’s picked kit and rolled trinket.',
  [col('Swept', `${bar('Gear')}<div class="inner">${gearHead}${afterBody}${gearFoot('1 kit, 1 of 2 picked, 2 things bought', true)}</div>`, 'bit')], 720, 'Its parts checked against the built screen’s picture; the after state itself is not in the built pictures.');
// ---- a kit’s rolls ----
const seqOld = `${bar('Gear')}<div class="inner" style="min-height:640px"></div>${sheetOf('Dredger’s kit', `<p class="meta" style="margin:0 0 var(--space-2)">Step 2 of 3: Tools, twice</p>${roll(4, 'Roll d4 twice at the table, then tap each result.')}<div style="display:flex;gap:var(--space-2);align-items:center"><div class="nrow on" style="flex:1;margin:0">1–2: Eel knife<span class="ck">✓✓</span></div><span class="btn sq">−</span></div><div class="nrow" style="margin-top:var(--space-1)">3: Bog sling</div><div class="nrow">4: Reed spear, a long one with a barbed head for the deep channels</div><div class="meta" style="margin:var(--space-2) 0">Eel knife, Eel knife</div><div class="efoot"><span class="btn">Back</span><span class="btn accent">Next</span></div>`)}`;
const seqNew = `${bar('Gear')}<div class="inner" style="min-height:640px"></div>${sheetOf('Dredger’s kit', `<p class="meta" style="margin:0 0 var(--space-2)">Roll 2 of 3</p>${roll(4, 'Roll d4 twice, then tap each result.')}${tt('Tools', 'Tool', [['1 to 2', 'Eel knife', 'twice'], [3, 'Bog sling'], [4, 'Reed spear, a long one with a barbed head for the deep channels']], { d: 4 })}<div class="meta" style="margin:var(--space-2) 0">Eel knife, eel knife</div><div class="efoot"><span class="btn">Back</span><span class="btn accent">Next</span></div>`)}`;
const f3 = frame('F3. A kit’s rolls, one at a time, in a sheet. <b>Left: as built, today’s type. Right: swept:</b> the roll’s table in the book’s style (the bar names what is rolled, “Tools”; the head row has the die; rows are taps, with ranges written “1 to 2”); a row rolled twice shows two ticks and the − square that takes one back; the line under the table says what is taken so far; Back and Next at the right. The count reads “Roll 2 of 3”, since “Step 2 of 3” used the creation steps’ own word for something else, and “twice” is said once, in the roll row.',
  [col('As built, today’s type', seqOld), col('Swept', seqNew, 'bit')], 720, BUILT);
// ---- the long table ----
const trinkets = [['1 to 2', 'A thin gold chain'], ['3 to 4', 'A hollow silver egg', 'on'], ['5 to 6', 'Sulphur sweets'], ['7 to 8', 'Half a heron banner'], ['9 to 10', 'A lead soldier'], ['11 to 12', 'A burnt town’s key'], ['13 to 14', 'A jar of river mud'], ['15 to 16', 'A horn comb'], ['17 to 18', 'A very long keepsake that someone’s grandmother carried from the abbey of the long-gone marsh wardens']];
const longOld = `${bar('Gear')}<div class="inner" style="min-height:900px"></div>${sheetOf('Reed trinkets', `${roll(100, 'Roll d100, then tap the row.')}<div class="lbl" style="margin-top:0">What you rolled</div><div class="rolled">${fld('', true)}<span class="btn">Show</span></div><div class="rolled"><span class="btn">1–50</span><span class="btn">51–100</span></div>${trinkets.slice(0, 6).map(([n, w, st]) => `<div class="card${st ? ' picked' : ''}"><div class="kv"><div class="text">${String(n).replace(' to ', '–')}: ${w}</div><span class="btn">${st ? 'Picked ✓' : 'Pick'}</span></div></div>`).join('')}<p class="meta">44 more rows, all shown.</p>`)}`;
const longSheet = (rows, marked, popped) => `${bar('Gear')}<div class="inner" style="min-height:1040px"></div>${sheetOf('Trinket', `${roll(100, 'Roll d100, then mark your row.')}<div class="lbl" style="margin-top:0">What you rolled</div><div class="rolled">${fld('', true)}<span class="btn">Show</span></div><div class="rolled"><span class="btn">1 to 50</span><span class="btn">51 to 100</span></div>${tt('Reed trinkets', 'Trinket', rows, { d: 100 })}<p class="meta">41 more rows, all shown in the app.</p><div class="efoot"><span class="btn${marked ? ' accent' : ''}">Take it</span></div>`)}${popped ? `<div class="dim"></div><div class="popup" role="dialog" aria-label="Tap a row first" style="top:auto;bottom:84px"><div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)"><p style="margin:0">Tap a row first.</p><span class="btn sq" role="button" aria-label="Close" style="border:0;background:transparent">${I.close}</span></div></div>` : ''}`;
const longNew = longSheet(trinkets, true);
const longNone = longSheet(trinkets.map(([n, w]) => [n, w]), false, true);
const f4 = frame('F4. A long table (a d100 of fifty rows), in its sheet. <b>Left: as built, today’s type</b> (the first rows; the build shows every row, no folds). <b>Middle: swept, ruled by Francis 2026-11-12:</b> the same parts (the roll row; “What you rolled” with Show, which jumps to the row; the two jump buttons), and the table in the book’s style. <b>A tap marks the row</b> (wash, edge, bold, a tick; a tap on it again clears it) and nothing is taken until the one button at the foot’s right, <b>“Take it”</b>, which takes the accent once a row is marked; a stray tap while scrolling costs nothing. The X closes with nothing taken. “Done” and the Pick on every row go: one way out, one confirm, as on the name table. <b>Right: nothing marked</b>: “Take it” is plain and still a tap; it says why in the pop-up form, “Tap a row first.”, placed by the button that raised it. The roll row reads “Roll d100, then mark your row.” <b>“Take it” stays in view</b> at the sheet’s foot while the fifty rows scroll (a fixed foot; drawn here at the end of the rows shown). The sheet is titled by what it is (“Trinket”) and the table’s bar carries the table’s name. A very long entry wraps in its row. Only the first rows are drawn; the app shows all fifty. <b>The same on the pack’s “pick up to N” table</b> (folded on Gear, not drawn open here): taps mark, then “Take these”. A kit’s rolls (frame F3) move by Next and stay as they are. <b>This changes built behaviour</b> (the build takes on the tap, with Undo, and closes by “Done”).',
  [col('As built, today’s type', longOld), col('Swept: a row marked', longNew, 'bit'), col('Swept: nothing marked, “Take it” tapped', longNone, 'bit')], 1100, BUILT);
// ---- the kit’s entry ----
const kitEntry = enSheet('Gear', 'Dredger’s kit', `${enLn('About', 'Given, not bought: roll for a coat and two tools.')}${enLn('Carried', 'Reed basket')}${enLn('In the reed basket', 'Dry rations ×2, waxed coat, bog sling, a reed spear with a heron-bone point and a long eel line')}${enLn('Cost', 'Free')}<h4>Rolled at the table</h4><div class="drow"><span><b>${die(6, 16)}Armour: d6</b><small>Waxed coat</small></span><span class="btn">Change</span></div><div class="drow"><span><b>${die(4, 16)}Tools: d4, twice</b><small>Bog sling; a reed spear with a heron-bone point and a long eel line</small></span><span class="btn">Change</span></div>${enSrc(33)}`, 760, '<span class="btn">Picked ✓</span>');
// ---- the shop ----
// ---- the shop, redrawn from the built screen (the Builder's pictures, 2026-11-12) ----
const buy = (name) => `<span class="btn ibw" role="button" aria-label="Buy ${name}">${gi('two-coins', 26)}<span>Buy</span></span>`;
const srow = (name, what, price, weight, w) => `<div class="srow2"><div class="s1"><a class="nm" role="button" aria-label="${name}: read its entry">${name}</a>${buy(name)}</div><div class="under" style="margin-top:0"><span class="price kp">${price}</span>${what} ${weight}</div>${w ? `<div class="under">${warn(w)}</div>` : ''}</div>`;
const cat = (name, n, open) => `<div class="catrow" role="button" aria-expanded="${open}"><b>${name}: ${n}</b>${foldMark(open)}</div>`;
const shopBar = `<div style="padding:var(--space-2) var(--space-3) 0"><span class="backl" role="button">${I.back.replace('width="24"', 'width="18"').replace('height="24"', 'height="18"')}Gear</span><h2 style="text-align:center;margin:0 0 var(--space-2);font-variant:normal;text-transform:none;letter-spacing:0;font-size:24px">Shop</h2></div>`;
const shopTop = `<p style="margin:0 0 var(--space-2)"><b>106 silver to spend</b></p><span class="field empty" role="searchbox" aria-label="Search items">Search items</span>`;
const shopNew = `${shopBar}<div class="inner">${shopTop}${cat('Weapons', 3, false)}${cat('Armour', 2, true)}${srow('Bog-iron coat', 'Heavy, rusty and very hard to cut.', '40 silver', '400 coins’ weight', 'A Reed Witch can’t use it. Heavy iron drowns the whisper.')}${srow('Waxed coat', 'Keeps the wet out and some blows.', '10 silver', '150 coins’ weight')}${cat('Adventuring gear', 7, true)}${srow('Dry rations', 'A day’s food that won’t go soggy.', '1 silver', '20 coins’ weight')}${srow('Eel hooks', 'Bent bone, barbed.', '1 copper', '0 coins’ weight')}${srow('A very long name for a thing the market sometimes has, when the barges are in', 'Nobody knows.', '999 silver', '70 coins’ weight')}<p class="meta">4 more in this group, all shown in the app.</p>${cat('Trinkets', 1, false)}<div class="toast"><span>Waxed coat bought</span><span class="btn small">Undo</span></div><div class="efoot"><span class="btn accent">Done shopping</span></div></div>`;
const countBody = `<span class="backl" role="button">${I.back.replace('width="24"', 'width="18"').replace('height="24"', 'height="18"')}Back to the list</span><h3 class="sec" style="margin-top:var(--space-2)">Dry rations</h3><div>${stepper(3)}</div><div class="lbl">Where it goes</div><div class="lbl" style="margin-top:var(--space-1)">Equipped</div><div class="nrow" role="button">In hand</div><div class="lbl">Containers</div><div class="nrow on" role="button">Carried<span class="ck">✓</span></div><p style="margin:var(--space-3) 0 0"><span class="price">3 silver</span></p><div class="efoot"><span class="btn accent">Buy 3</span></div>`;
const shopCount = `${shopBar}<div class="inner">${shopTop}<div class="card" style="margin-top:var(--space-3)">${countBody}</div></div>`;
const f5 = frame('F5. The shop, swept, <b>redrawn from the built screen</b>. It takes the Gear step’s place and has no bar, as built: the link “Gear” at the top left and “Done shopping” (right-justified) are its two ways out, and do the same thing; no X. “Shop” is the page’s centred heading. The top says the coin to spend, and nothing else (the built shop shows no load). The search field has no visible label: the placeholder “Search items”, the label kept for a screen reader. <b>The categories fold, as built</b>, each with its count, with the chevron (one folded and two open here). <b>A row:</b> the name is the tap to the thing’s entry, in the link style, with no ⓘ (as built, and as on a town’s stock row); the two-coins “Buy” button buys one at once (the build’s word is “Add”); under the name what it is, then its weight, with the price at the right of that line; the source is in the entry. A thing the class cannot use has the warning sign, “A Reed Witch can’t use it.”, then the pack’s reason; it can still be bought. A buy shows the Undo toast. <b>Right: a thing that stacks</b> opens the count screen, which replaces the list, as built: “Back to the list”; the name; the shared stepper; “Where it goes” with the places the build offers (in hand; a container, ticked); the cost; and one button at the right, “Buy 3” (the build’s reads “Add to [the character]’s pack”). On the built phone “Done shopping” is the full width; it is right-justified here on both widths (ruled). The Undo toast is not in the built picture (nothing is bought in it). Messy: a very long name, 999 silver, 0 weight.',
  [col('Swept', shopNew, 'bit'), col('Swept: a thing that stacks', shopCount, 'bit')], 720, CHK);
const colW = (inner) => `<div class="tablet wide bit"><div style="width:388px;margin:0 auto;border-left:1px dotted var(--rule);border-right:1px dotted var(--rule)">${inner}</div></div>`;
const f9 = `<div><p class="cap" style="max-width:1024px">F9. The count screen at the iPad’s width, swept, <b>as built</b>: one centred column of about a phone’s width (the sweep does not re-lay out a screen); the same parts as the phone. The dotted lines mark the column in this drawing only.</p>${colW(`${shopBar}<div class="inner">${shopTop}<div class="card" style="margin-top:var(--space-3)">${countBody}</div></div>`)}<p class="from">${CHK}</p></div>`;
