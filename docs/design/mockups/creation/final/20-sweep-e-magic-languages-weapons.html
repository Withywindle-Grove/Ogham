<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creation, the style sweep: batch E, Magic, Languages, Weapon skills (2026-11-12)</title>
<link rel="stylesheet" href="final.css">
<link rel="stylesheet" href="sweep.css">
<style>
  .sheetup { max-height:none; }
</style>
</head>
<body>
<script src="final.js"></script>
<script src="sweep.js"></script>
<script src="entries.js"></script>
<script>
const givenOld = (name, sub) => `<div class="card picked"><div class="kv"><div class="text">${name}<small>${sub}</small></div><span class="meta">Given</span></div></div>`;
const given = (name, sub) => `<div class="card picked"><div class="prow"><span class="i" role="button" aria-label="About ${name}">${I.info}</span><div class="text">${name}</div><span class="giv">Given</span></div><div class="under">${sub}</div></div>`;
const closed = (name, why) => `<div class="card"><div class="prow"><span class="i" role="button" aria-label="About ${name}">${I.info}</span><div class="text">${name}</div><span></span></div><div class="under">${warn(why)}</div></div>`;
const needs = `<div class="under">${warn('Needs the GM’s special approval')}</div>`;
// a tapped table in the book's style: rows [n, words, sub, state] with state 'on' | 'shut'
const tt = (title, d, head, rows) => `<div class="tt"><div class="tbar">${title}</div><div class="th"><span>${die(d, 16)}d${d}</span><span>${head}</span><span></span></div>${rows.map(([n, w, sub, st]) => `<div class="tr${st ? ' ' + st : ''}" role="button"><span class="n">${n}</span><span>${w}${sub ? `<small>${sub}</small>` : ''}</span><span>${st === 'on' ? '✓' : ''}</span></div>`).join('')}</div>`;
// ---- First spells (the build's title where the step is a caster's spells; "Magic" is for knacks and the like: to confirm for this character) ----
const L1 = (dur, range) => `Level 1, ${dur}, ${range}`;
const nine = [['Marsh Light', 'A floating glow that follows you', L1('6 turns', '30 feet')], ['Whispering Reeds', 'Hear what was said here an hour ago', L1('1 turn', 'touch')], ['Eel Skin', 'Slip ropes, nets and narrow gaps', L1('6 turns', 'touch')], ['Still Water', 'Calm a pool or a reach of river', L1('1 turn', '60 feet')], ['Fog Hand', 'A hand of fog that carries one small thing', L1('3 turns', '30 feet')], ['Heron’s Patience of the Long Wait at the Drowned Causeway', 'Stand unseen while you do not move', L1('until you move', 'self')], ['Mud Step', 'Walk on marsh as on a road', L1('6 turns', 'touch')], ['Reed Dart', 'A reed thrown as hard as a bolt', L1('instant', '90 feet')], ['Lamp against the Dark', 'A light no wind or water puts out', L1('1 day', 'touch')]];
const whisperRows = [[1, 'Eel Skin', 'Slip ropes, nets and narrow gaps'], [2, 'Still Water', 'Calm a pool or a reach of river', 'on'], [3, 'Fog Hand', 'A hand of fog that carries one small thing'], [4, 'Marsh Light', 'Already yours: roll again', 'shut']];
const magicOld = `${bar('Magic')}<div class="inner"><p class="meta">Step 7 of 12</p><p class="do">The spells your character starts with. Tap a name to read it.</p>${helpBtn()}<h2>From your class</h2><p class="meta" style="margin:0 0 var(--space-2)">Reed Witches start with two, always theirs.</p>${givenOld('Marsh Light', 'A floating glow that follows you. Rank 1')}${givenOld('Whispering Reeds', 'Hear what was said here an hour ago. Rank 1')}<h2>From your kindred</h2>${roll(6, 'Roll d6 for your knack, then tap the row.')}${pick('Bird Friend', 'Talks with birds', 'pick')}${pick('Lock Singer', 'Sings locks open', 'pick')}${pick('Root Friend', 'Questions roots', 'pick')}<p class="meta">3 more rows follow.</p>${footL('Knack still to roll')}</div>`;
const magicA = `${enHead('From your class', '', 'always in your book')}${enGiven('Marsh Light', nine[0][1], nine[0][2])}${enGiven('Whispering Reeds', nine[1][1], nine[1][2])}
  ${enHead('Pick 1 more, for level 2', '1 of 1 picked')}${enSpell(...nine[2], 'picked')}${enSpell(...nine[4])}${enSpell(...nine[6])}`;
const knackRows = [[1, 'Bird Friend', 'Talks with birds'], [2, 'Lock Singer', 'Sings locks open', 'on'], [3, 'Root Friend', 'Questions roots'], [4, 'Moth Sight', 'Sees by one candle as by day'], [5, 'Rain Sense', 'Knows the weather a day ahead'], [6, 'Still Heart', 'Is not heard when standing still']];
const magicB = `${enHead('From your kindred')}${roll(6, 'Roll d6, then tap the row.')}${tt('Stone kin knacks', 6, 'Knack', knackRows)}`;
const spellsB = `<div style="margin-top:var(--space-4)"></div>${roll(4, 'Roll d4, then tap the row.')}${tt('First whispers', 4, 'Spell', whisperRows)}
  ${enHead('Charms: pick 2', '0 of 2 picked')}${enSpell('Frog Chorus', 'Covers your footsteps with croaking', 'Charm, 1 turn, self')}${enSpell('Dry Boots', 'Feet stay dry whatever you wade through', 'Charm, 1 day, touch')}${enSpell('Knot Charm', 'Ties or loosens a rope at a glance', 'Charm, instant, touch')}`;
const magicNew = `${bar('Magic')}<div class="inner"><p class="meta">Step 7 of 12</p><p class="do">The spells your character starts with.</p>${helpGap}${magicA}${magicB}${footL('')}</div>`;
const e1 = frame('E1. Magic, on a phone, <b>redrawn from the built step</b>. The title is “Magic” because this character has magic from her kindred (the build’s rule, confirmed by the Builder: “Magic” with any kindred-given or kindred-rolled magic; otherwise the pack’s title, else “First spells”: frame E2). <b>Left: the approved mockup</b> (kept as the record). <b>Right: swept, the build’s parts:</b> one line; “Help me choose” with its gap; what the class gives under “From your class” with the build’s aside, “always in your book”, as rows on the wash with a small-capitals “Given”; <b>a spell’s row keeps the build’s line as well as the blurb</b> (ruled 2026-11-12): line one what the spell does, line two its level, duration and range (“Level 1, 6 turns, touch”); the source is in the entry; <b>a pick’s heading carries its count beside it</b> (“1 of 1 picked”), as built; the level-2 case under its own heading (“Pick 1 more, for level 2”, ruled by Francis; the built form of a higher starting level’s pick is pull request #633’s and is to be checked against it); then “From your kindred”: the knack is a roll on a table, dressed as the book’s tapped table (the build has a card with a Pick for each number). The foot: “Decide later”, the state, Back, and Next with the accent. While something is left the foot says so in the build’s form (“2 charms to go”, frame E2); with nothing left, as here, its state is left empty: <i>to confirm</i> (the build’s words for a finished step have not been seen).',
  [col('The approved mockup', magicOld), col('Swept', magicNew, 'bit')], 720, EN_CHK);
const spellsStep = `${bar('First spells')}<div class="inner"><p class="meta">Step 7 of 12</p><p class="do">The spells your character starts with.</p>${helpGap}${enHead('From your class', '', 'always in your book')}${enGiven('Marsh Light', nine[0][1], nine[0][2])}${spellsB}${footL('2 charms to go')}</div>`;
const nineStep = `${bar('First spells')}<div class="inner"><p class="meta">Step 7 of 12</p><p class="do">The spells your character starts with.</p>${helpGap}${enHead('Pick 2', '1 of 2 picked')}${nine.map((s, i) => enSpell(...s, i === 2 ? 'picked' : 'pick')).join('')}${footL('1 spell to go')}</div>`;
const spellEntry = enSheet('First spells', 'Eel Skin', enSpellBody, 620);
const e2 = frame('E2. “First spells”: a caster with no magic from a kindred (another character), and a spell’s entry, <b>redrawn from the built step and sheet</b>. <b>Left: nine spells, pick 2</b>, each row with its blurb and the build’s line (level, duration, range); messy: a very long spell name wraps and Pick keeps its place; the picked row is on the wash and reads “Picked ✓”; a third tap explains in a pop-up, never greys the rows; the foot says what is still to go, as built. <b>Middle: the other parts the built step has:</b> a rolled list (“First whispers”) under its roll row, dressed as the book’s tapped table (the table’s bar carries its name, so the build’s heading over it is not said a second time), with the build’s state for a result the character already has (“Already yours: roll again”, muted, still a row); and a second counted pick (“Charms: pick 2”), as the build has cantrips. <b>Right: the ⓘ on a spell</b> opens its entry: <b>the build’s parts and order, in the book format</b>: Level, Range, Duration and Saves as labelled lines (the build’s word is “Level”; my “Rank” is gone), then the spell’s text (the build labels it “Rules”; here it is the paragraph); the source last; one accent “Pick” at the right. The lead-ins I had invented (“Reversed”, “In water”) are gone.',
  [col('Swept: nine spells', nineStep, 'bit'), col('Swept: a rolled list, and charms', spellsStep, 'bit'), col('Swept: a spell’s entry', spellEntry, 'bit')], 1100, EN_CHK);
// ---- Languages ----
const langOld = `${bar('Languages')}<div class="inner"><p class="meta">Step 8 of 12</p><p class="do">The tongues your character speaks. Wits 15 gives you one more.</p>${helpBtn()}<h2>You speak</h2>${givenOld('Marsh-common', 'The common tongue')}${givenOld('Stone-speech', 'From your kindred')}<h2>Pick 1 more</h2>${roll(6, 'Roll d6, or choose.')}${pick('Heron-tongue', '1. The courtly tongue of the heron lords', 'pick')}${pick('Causeway cant', '2 to 3. The common speech of the folk', 'pick')}${closedPick('Old Marsh', '4. Not open to Stone kin')}${pick('Deepwood', '5. The shared tongue of the deep woods', 'pick')}${pick('Purr', '6. The purring speech of the cat-folk', 'pick')}<h2>Or choose one of these</h2>${pick('Eel-talk', 'Coded talk of the marsh’s thieves', 'pick')}${pick('Croak', 'The croak-speech of the toad folk', 'pick', '<small>' + warn('Needs the GM’s special approval') + '</small>')}${foot('0 of 1 picked')}</div>`;
const literacy = `<div class="card" style="margin-top:var(--space-3)">Literacy: <b>Reads</b>, from Wits 15 (Derived values)</div>`;
const langA = `${enHead('You speak')}${enGiven('Marsh-common', 'The common tongue')}${enGiven('Reed-tongue', 'The tongue of your alignment; it changes if your alignment does')}${enGiven('Stone-speech', 'From your kindred')}`;
const langB = `${enHead('Pick 1 more', '1 of 1 picked')}${roll(6, 'Roll d6, or tap any row.')}${tt('Tongues of the marsh', 6, 'Language', [[1, 'Heron-tongue', 'The courtly tongue of the heron lords'], ['2 to 3', 'Causeway cant', 'The common speech of the folk', 'on'], [4, 'Old Marsh', warn('Not open to Stone kin'), 'shut'], [5, 'Deepwood', 'The shared tongue of the deep woods'], [6, 'Purr', 'The purring speech of the cat-folk']])}
  ${enHead('Others you may choose')}${irow('Eel-talk', 'Coded talk of the marsh’s thieves')}${irow('Croak', 'The croak-speech of the toad folk', 'pick', needs)}${enOther('A language the list doesn’t have.')}${literacy}`;
const langBody = langA + langB;
const langNew = `${bar('Languages')}<div class="inner"><p class="meta">Step 8 of 12</p><p class="do">The tongues your character speaks. Wits 15 gives you one more.</p>${helpGap}${langBody}${foot('1 of 1 picked')}</div>`;
const e3 = frame('E3. Languages, on a phone, <b>redrawn from the built step</b>. <b>Left: the approved mockup. Right: swept, the build’s parts:</b> the line (both sentences, ruled: the second is a fact about this character); what the character already speaks as “Given” rows, <b>the alignment’s tongue among them</b>, saying that it changes if the alignment does; the pick’s heading with its count beside it; then, <b>as built:</b> “Other…”, a dashed row with “+” for a language the list does not have; and a boxed line for literacy (“Reads”, the score it comes from, and where it is kept). <b>The foot has no “Decide later”</b>, as built: the state, Back, Next. <b>The rolled table is built</b> where the pack’s languages carry a roll (the Builder, 2026-11-12; the built picture’s pack has none): the rolled ones first with their ranges, and a row closed to the kindred kept as a closed row that says why (a tap says it cannot be learnt: roll again or choose). The roll row keeps the ruled words, “Roll d6, or tap any row.” (the build’s are “Roll d6, or choose.”). The second heading “Others you may choose” is the ruled wording. A pick row’s source is in its entry (ruled), where the build shows it on the row.',
  [col('The approved mockup', langOld), col('Swept', langNew, 'bit')], 720, EN_CHK);
// ---- Weapon skills ----
const wLine = (d, use) => `${die(d, 16)}1d${d}, ${use}`;
const wOld = `${bar('Weapon skills')}<div class="inner"><p class="meta">Step 9 of 12</p><p class="do">The weapons your character has trained with. Others are clumsier in your hands.</p>${helpBtn()}<h2>Pick 2</h2>${pick('Spear', 'Close or thrown. Also the long spear', 'picked')}${pick('Sling', 'Range. Stones are free', 'pick')}${pick('Staff', 'Close. Two hands', 'pick')}${pick('Knife', 'Close or thrown. Also the silver knife', 'pick')}${closedPick('Long sword', 'Not open to Reed Witch')}${footL('1 of 2 picked')}</div>`;
const wBody = `${enHead('Pick 2', '1 of 2 picked')}${enHead('Weapons').replace('<h3 class="sec">', '<h3 class="sec" style="margin-top:var(--space-2)">')}${irow('Spear', wLine(6, 'melee, thrown'), 'picked')}${irow('Sling', wLine(4, 'missile'))}${irow('Staff', wLine(4, 'melee, two hands'))}${irow('Knife', wLine(4, 'melee, thrown'))}${enOther('Type its name; it counts as one pick.')}<div class="fold" role="button" aria-expanded="true"><span>Not your class’s weapons: 2</span>${foldMark(true)}</div><p class="meta" style="margin:0 0 var(--space-2)">Iron drowns the whisper: a Reed Witch trains with no blade longer than her forearm.</p>${irow('Long sword', wLine(8, 'melee'), 'pick', needs)}${irow('Bog-iron axe', wLine(8, 'melee, two hands'), 'pick', needs)}`;
const wNew = `${bar('Weapon skills')}<div class="inner"><p class="meta">Step 9 of 12</p><p class="do">The weapons your character has trained with.</p>${helpGap}${wBody}${footL('1 of 2 picked')}</div>`;
const e4 = frame('E4. Weapon skills, on a phone, <b>redrawn from the built step</b>. <b>Left: the approved mockup. Right: swept, the build’s parts:</b> one line (ruled); the counted pick’s heading with its count beside it; the group’s heading, “Weapons”, as built (the empty band the build has between the two is the Builder’s to fix and is not drawn); each row with the ⓘ and, under it, <b>the build’s line: damage and use</b> (“1d6, melee, thrown”, the die with its glyph); the source is in the entry (ruled); <b>“Other…”</b>, a dashed row with “+”: “Type its name; it counts as one pick.” The foot: “Decide later”, the count, Back, Next. <b>The class’s forbidden weapons</b> (the Builder, 2026-11-12; with the pack’s restricted-weapons option on): a folded group, “Not your class’s weapons: 2”, with the chevron, drawn open here: the pack’s rule as its note, and each weapon PICKABLE, with “Needs the GM’s special approval”. With the option off they are left out. The earlier closed row with no Pick is gone. <i>Placement to confirm:</i> the group sits under “Other…”, its note under its heading; no built picture shows it.',
  [col('The approved mockup', wOld), col('Swept', wNew, 'bit')], 720, EN_CHK);
// ---- iPad ----
const tab = (title, count, line, left, right, footer, cap, from) => `<div><p class="cap" style="max-width:1024px">${cap}</p><div class="tablet wide bit">${bar(title)}<div class="cols"><div><p class="meta">${count}</p><p class="do">${line}</p>${helpGap}${left}</div><div>${right}</div></div>${footer.replace('class="foot"', 'class="foot" style="margin:0;padding:var(--space-3);flex-wrap:nowrap"')}</div><p class="from">${from}</p></div>`;
const TABFROM = 'Its rows checked against the built phone picture; no built tablet picture of this step has been sent, and the two columns are mine.';
const top5 = (h) => h.replace('<h3 class="sec">', '<h3 class="sec" style="margin-top:var(--space-5)">');
const e5 = tab('Magic', 'Step 7 of 12', 'The spells your character starts with.', magicA, top5(magicB), footL('', 'accent', true), 'E5. Magic at the iPad’s width, swept: the same rows as the phone (frame E1) in two columns: what the class gives and the level-2 pick at the left; the kindred’s knack table at the right. A tap on a row’s ⓘ opens the spell’s entry as a sheet here, since both columns are in use.', TABFROM);
const e6 = tab('Languages', 'Step 8 of 12', 'The tongues your character speaks. Wits 15 gives you one more.', langA + langB.slice(0, langB.indexOf('<h3 class="sec">Others you may')), top5(langB.slice(langB.indexOf('<h3 class="sec">Others you may'))), foot('1 of 1 picked'), 'E6. Languages at the iPad’s width, swept: the same rows as the phone (frame E3); no “Decide later”, as built.', TABFROM);
const e7 = `<div><p class="cap" style="max-width:1024px">E7. Weapon skills at the iPad’s width, swept, with a weapon’s entry, <b>redrawn from the built sheet</b>: the list at the left (about two fifths), the open weapon’s entry in a pane at the right, as Class does: the pane has an X; the open row keeps its button and is marked by its edge. <b>The entry is the build’s parts, in the book format:</b> the blurb; Qualities, Damage and use, Cost and Weight as labelled lines; the source last (the build shows a bare “p. 33”). My invented “Thrown” line and paragraph are gone. The pane’s button is plain (“Picked ✓” here: the spear is taken).</p><div class="tablet wide bit">${bar('Weapon skills')}<div style="padding:var(--space-3)"><p class="meta">Step 9 of 12</p><p class="do">The weapons your character has trained with.</p>${helpGap}<div style="display:grid;grid-template-columns:2fr 3fr;gap:var(--space-4);align-items:start"><div>${wBody.replace('<div class="card picked">', '<div class="card picked open">')}</div>${enPane('Spear', enWeaponBody, '<span class="btn">Picked ✓</span>')}</div></div>${footL('1 of 2 picked', 'accent', true).replace('class="foot"', 'class="foot" style="margin:0;padding:var(--space-3);flex-wrap:nowrap"')}</div><p class="from">The entry’s parts and the rows checked against the built phone pictures; no built tablet picture of this step has been sent.</p></div>`;

mount(`
  <h1>Creation, the style sweep: batch E</h1>
  <p class="note"><b>Redrawn 2026-11-12 from the Builder’s pictures of the built steps and sheets</b> (First spells, Languages, Weapon skills; a spell’s and a weapon’s entry) and the Builder’s answers of the same day: the build’s parts, order, states and words, in our type, the book format and the ruled economies of words. What is still from a mockup is said on its frame.</p>
  <p class="note">Magic, Languages and Weapon skills, in the type pair and today’s standards, with the rulings of batches A to D applied (one line a step; ⓘ rows with the line under; a tapped roll table in the book’s style; nothing said twice between a roll row and a table; the level-2 case). Names, words and numbers are invented. A proposal from the Design Studio, not ruled.</p>
  <p class="note"><b>The example character</b> (one through every batch, ruled 2026-11-12): a Stone kin Reed Witch starting at level 2, with no patron. Her twelve steps: 1 How to build, 2 Scores, 3 Kindred, 4 Class, 5 Adjust scores (optional), 6 Who they are, 7 Magic, 8 Languages, 9 Weapon skills, 10 Gear, 11 Details (optional), 12 Review. The count shows no total until the class is picked (“Step 4”, then “Step 5 of 12”). Two frames need another character and say so: the Patron step (a Marsh folk Marsh Chaplain, thirteen steps) and a liege (a Marsh folk Heron Knight, who casts no spells: eleven steps). Messy-data values (a score of 0, 999 coins) are for the frame they are on.</p>
  <h1>Magic, and First spells</h1>
  <p class="note"><b>The foot:</b> “Decide later” is first in the foot on First spells and Weapon skills, as built; Languages has none, as built.</p>
  <div class="wall">${e1}</div>
  <div class="wall">${e2}</div>
  <div class="wall">${e5}</div>
  <h1>Languages</h1>
  <div class="wall">${e3}</div>
  <div class="wall">${e6}</div>
  <h1>Weapon skills</h1>
  <div class="wall">${e4}</div>
  <div class="wall">${e7}</div>
  <h1>Questions for Francis (drafts for the lead’s list)</h1>
  <p class="note"><b>Answered by the Builder, 2026-11-12:</b> the title (“Magic” with any magic from the kindred, else the pack’s title, else “First spells”); a rolled language table is built where the pack’s languages carry a roll; a class’s forbidden weapons are a folded group, pickable with the GM’s special approval. <b>Still open:</b> how a level-2 start asks for its extra spell; the foot’s words when nothing is left to choose.</p>
  <h1>Self-review</h1>
  <p class="note"><b>Checked.</b> Each step beside the approved mockup. Nothing said twice between a roll row, a table’s bar and a heading. One fold mark (none on these steps). The level-2 case on Magic. Phone and iPad carry the same rows (E5 and E6 are the phone’s bodies split in two; E7 the same list). One accent a screen (Next; “Pick” in an entry). No disabled button: a closed row says why; a third pick explains. Die glyphs on every die named. The picked table row is told from a band by edge, weight and a tick. Messy: nine spells, a very long spell name. Light and dark side by side.</p>
  <p class="note"><b>Not checked, or uncertain.</b> The phone frames are checked against the built phone pictures in dark; no built tablet or light picture of these steps has been sent. The pop-up for a third pick is not drawn. Contrast by measurement; Larger text.</p>
`);
applyPair();
</script>
</body>
</html>
