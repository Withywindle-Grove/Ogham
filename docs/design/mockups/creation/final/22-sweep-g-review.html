<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creation, the style sweep: batch G, the review and the GM’s side (2026-11-12)</title>
<link rel="stylesheet" href="final.css">
<link rel="stylesheet" href="sweep.css">
<style>
  .rev .card h3 { font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:20px; margin:0; }
  .rev .head { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); min-height:44px; }
  .rev .line { padding:var(--space-2) 0; border-bottom:1px dotted var(--rule); display:flex; justify-content:space-between; align-items:center; gap:var(--space-3); }
  .rev .line:last-child { border-bottom:0; }
  .rev .line small { display:block; font-size:14px; color:var(--muted); }
  .rev .line svg { vertical-align:-3px; }
  .foot .btn { white-space:nowrap; flex:none; }
  .phone .rev .foot { flex-wrap:wrap; justify-content:flex-end; }
  .phone .rev .foot .say { flex:1 0 100%; }
  .phone .rev .foot .say:empty { display:none; }
  .dvt { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--space-2); margin-top:var(--space-2); }
  .dvt .t { border:1.5px solid var(--control); border-radius:4px; padding:var(--space-2); text-align:center; }
  .dvt .t .n { font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); line-height:1.2; }
  .dvt .t .f { font-family:"EB Garamond", Georgia, serif; font-size:22px; font-weight:600; line-height:1.2; }
  .dvt .t .p { font-size:14px; color:var(--muted); line-height:1.2; }
  .phone .dvt { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .dvt .t { min-width:0; }
  .lbl { font-size:14px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin:var(--space-3) 0 var(--space-1); }
  .marked { border:2px solid var(--warn) !important; }
  .field { display:block; }
  .tf { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); min-height:44px; border-bottom:1px dotted var(--rule); }
  .tf:last-child { border-bottom:0; }
</style>
</head>
<body>
<script src="final.js"></script>
<script src="sweep.js"></script>
<script>
const card = (title, lines, change = true, cls = '') => `<div class="card ${cls}"><div class="head"><h3>${title}</h3>${change ? '<span class="btn small">Change</span>' : ''}</div>${lines.map((l) => `<div class="line"><span>${l}</span></div>`).join('')}</div>`;
const two = (old) => `<div class="card"><h3>Kindred and class</h3><div class="line"><span>Kindred: Stone kin</span><span class="btn small">Change</span></div><div class="line"><span>Class: Reed Witch, level 2</span><span class="btn small">Change</span></div></div>`;
const G_CHK = 'Checked against the built screen’s picture (creation-as-built on the pictures branch).';
const dvFold = (sw) => `<div class="card"><div class="head" role="button" aria-expanded="false"><span><b>Derived values</b><small style="display:block;font-size:14px;color:var(--muted)">${sw ? '8 figures' : '8 figures: tap one to see why'}</small></span>${sw ? foldMark(false) : `<span class="btn sq" aria-hidden="true">${I.plus}</span>`}</div></div>`;
const givenFold = (sw) => `<div class="line" role="button" aria-expanded="false"><span><b>Given to every character</b><small>6 items</small></span>${sw ? foldMark(false) : `<span class="btn sq" aria-hidden="true">${I.plus}</span>`}</div>`;
const gear = (sw) => `<div class="card"><div class="head"><h3>Gear</h3><span class="btn small">Change</span></div><div class="line"><span>Dredger’s kit<small>Reed rope, waxed coat, bog sling, reed spear, eel hooks</small><small>${warn('Waxed coat: a Reed Witch can’t wear it; carried')}</small></span></div>${sw ? `<div class="line"><span>Trinket<small>A pebble that is always warm, and hums when the fen floods</small></span></div><div class="line"><span>Odds and ends<small>Eel line</small></span></div>` : `<div class="line"><span>Also in the pack<small>A pebble that is always warm, and hums when the fen floods; eel line</small></span></div>`}${givenFold(sw)}<div class="line"><span>12 items${sw ? ', unburdened' : ''}</span></div><div class="line"><span>Starting coin<small>${sw ? '120 silver rolled, 14 spent: 106 left' : '120 sp rolled, 14 sp spent, 106 sp left'}</small></span></div></div>`;
const chip = (t) => `<span class="btn small">${t}</span>`;
// as built: a language with an entry is a chip (a tap opens it); the alignment's tongue is plain words among them
const langCard = (langs = ['Marsh-common', '*Reed-tongue', 'Stone-speech', 'Causeway cant'], cls = '') => `<div class="card ${cls}"><div class="head"><h3>Languages</h3><span class="btn small">Change</span></div><div class="line"><span style="display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center">${langs.map((l) => (l[0] === '*' ? `<span>${l.slice(1)}</span>` : chip(l))).join('')}</span></div></div>`;
const craftCard = `<div class="card"><div class="head"><h3>Stone kin crafts</h3><span class="btn small">Change</span></div><div class="line"><span>${chip('Causeway mason')}</span></div></div>`;
const scoresCard = (sw) => card('Scores', ['Might 13, Nimbleness 9, Grit 13, Wits 15, Lore 12, Charm 10' + (sw ? '<small>1 trade made: Might 15 to 13, Wits 14 to 15</small>' : '<small>1 trade made: Might 15 → 13, Wits 14 → 15</small>')]);
const whoCard = (cls = '') => card('Who they are', ['Oswin Adderbald', '11 hit points', 'Alignment: Reed'], true, cls);
const magicCard = card('Magic', ['Marsh Light<small>From your class</small>', 'Whispering Reeds<small>From your class</small>', 'Eel Skin<small>Picked, for level 2</small>', 'Lock Singer<small>From your kindred</small>']);
const detCard = card('Details', ['Age: 110 years', 'Height: 4 ft 4 in', 'Weight: 165 lb', 'Manner: hums while thinking']);
// the build's order: Kindred and class, Scores, Who they are, Derived values, Gear, then the picks, the kindred's trait list, Details
const bodyA = (sw, o = {}) => `${two()}${scoresCard(sw)}${whoCard(o.mark ? 'marked' : '')}${dvFold(sw)}`;
const bodyB = (sw) => `${gear(sw)}${magicCard}${langCard()}${card('Weapon skills', ['Spear, sling'])}${detCard}`;
const body = (sw, o = {}) => bodyA(sw, o) + bodyB(sw);
// the foot, swept: what the build's holds (the line, Send, Save and leave, Start over; no Back: the bar's arrow goes back), right-justified, the accent outermost
const revFoot = (say, o = {}) => `<div class="foot"${o.wide ? ' style="margin:0;padding:var(--space-3);flex-wrap:nowrap"' : ''}><span class="say">${say}</span><span class="btn small">Start over</span><span class="btn">Save and leave</span>${o.wide ? '' : '<span style="flex:1 0 100%;height:0"></span>'}<span class="btn accent">${o.send || 'Send to the GM'}</span></div>`;
const revFootOld = `<div style="border-top:1px solid var(--rule);margin-top:var(--space-3);padding-top:var(--space-3)"><p class="meta" style="margin:0 0 var(--space-3)">Goes to the GM for approval</p><span class="btn accent wide">Send to the GM</span><div style="display:flex;gap:var(--space-2);margin-top:var(--space-2)"><span class="btn" style="flex:1">Save and leave</span><span class="btn small" style="flex:1">Start over</span></div></div>`;
const review = (sw) => `${bar('Oswin Adderbald')}<div class="inner rev"><p class="meta">Step 12 of 12, Review</p>${sw ? '' : '<p class="do">Look it over. Anything you change goes back to its step and comes back here.</p>'}${body(sw)}${sw ? revFoot('Goes to the GM for approval') : revFootOld}</div>`;
const g1 = frame('G1. The review, on a phone, <b>redrawn from the built screen</b>: the example witch, level 2, whole. <b>Swept</b> (the built form is frame G1b): no instruction line (ruled: the cards and the button say it); one card a step with a small Change (the first card holds two steps, a line and a Change each). <b>The cards are in the build’s order:</b> Kindred and class, Scores, Who they are, Derived values (folded, with the chevron), Gear, then the picks (Magic, Languages, Weapon skills) and Details. <b>As built:</b> a language that has an entry is a boxed chip (a tap opens it) and the alignment’s tongue is plain words among them; Details a line a field, each with its label. The level shows in the class’s line (“Reed Witch, level 2”), the level-2 spell in Magic’s lines, the two-dice hit points as their total; arrows in the trade line become words (“Might 15 to 13”); coins in the pack’s own words; the rolled trinket has a row of its own, “Trinket” (ruled 2026-11-12; in the build it sits under “Also in the pack”), and the pack’s pick table is named by the pack (“Odds and ends”). More on this frame is in the note under it.',
  [col('Swept', review(true), 'bit')], 1100, G_CHK);
const g1b = frame('G1b. The review as built, in today’s type, for comparison with frame G1 (two pictures, since side by side they are too tall for one): the instruction line; the cards in the build’s order; “8 figures: tap one to see why”; the foot with “Send to the GM” at the full width over “Save and leave” and “Start over”.', [col('As built, today’s type', review(false))], 720, G_CHK);
// ---- messy and missing ----
const g2body = `<div class="card"><div>${warn('1 thing needs the GM’s special approval')}</div><div class="line"><span>Croak<small>A language usually learnt only by the toad folk</small></span></div></div>
  <div class="card"><div class="head"><h3>Gear</h3><span class="btn small">Change</span></div><div class="line"><span>The Drowned Abbey’s lantern-warden expedition kit, the heavy one<small>Ring coat, reed spear, lantern of the Drowned Abbey, half-empty, marsh knife, lamp oil ×3, eel line, reed basket, tinderbox</small><small>${warn('Ring coat: a Reed Witch can’t wear it; carried')}</small></span></div><div class="line"><span>10 items<small>${warn('Over the limit')}</small></span></div><div class="line"><span>Starting coin<small>999 silver, the average (not rolled); 999 spent: 0 left</small></span></div></div>`;
const g2 = frame('G2. The review with messy data and something missing, swept: a very long character name in the bar (cut with an ellipsis); a choice that needs the GM’s special approval called out in a card of its own before sending; a very long kit name and list; a card for a kindred’s trait list (“Stone kin crafts”), its pick a chip, as built; a thing the class cannot wear; a load over the limit, said with the warning sign and words; coin that was never rolled, said so, and 0 left. The foot is the review’s (frame G1: no Back). <b>Something still to do:</b> the foot’s line names the step and what it lacks with the warning sign (“Languages: pick 1 more”); “Send to the GM” stays tappable and goes to that step. <b>A send that failed</b> says so in the same place (“Couldn’t send it to the GM. Nothing is lost.”), and the button tries again.',
  [col('Swept: messy, and a step unfinished', `${bar('Bartholomew Fenwick-Adderbald the Younger')}<div class="inner rev"><p class="meta">Step 12 of 12, Review</p>${g2body}${craftCard}${revFoot(warn('Languages: pick 1 more'))}</div>`, 'bit'),
   col('Swept: a send that failed', `${bar('Oswin Adderbald')}<div class="inner rev"><p class="meta">Step 12 of 12, Review</p>${two()}${revFoot(warn('Couldn’t send it to the GM. Nothing is lost.'))}</div>`, 'bit')], 720, BUILT);
// ---- derived values ----
const tile = (n, f, p) => `<div class="t"><div class="n">${n}</div><div class="f"${/^[+−0-9]/.test(f) ? '' : ' style="font-size:16px;line-height:1.25"'}>${f}</div>${p ? `<div class="p">${p}</div>` : ''}</div>`;
const dvOpen = `<div class="card"><div class="head" role="button" aria-expanded="true"><b>Derived values</b>${foldMark(true)}</div><div class="dvt">${tile('Armour', '10', 'unarmoured, Nimbleness +0')}${tile('Attack', '+0')}${tile('Speed', '30', '90 a turn')}${tile('Title', 'Medium')}${tile('Literacy', 'Veteran of the Nine Drowned Bells')}${tile('Armour of the long cold of the Drowned Abbey', '0', 'no armour, Nimbleness −3')}</div><div class="lbl">Saves</div><div class="dvt">${tile('Mire', '12')}${tile('Ash', '13')}${tile('Bell', '14')}${tile('Reed', '15')}${tile('Lantern', '16')}</div></div>`;
const g3 = frame('G3. “Derived values” open, swept: the figures the rules work out, as tiles, two across on a phone and three from the tablet’s width (ruled 2026-11-12), each tile growing with its words, which wrap at spaces only: a small-capitals label (Alegreya Sans SC), the figure, and where it comes from in words; the saves as their own group. A tap on a tile opens why (not drawn). Messy: a long label, a word figure is set smaller than a number and wraps, never cut; 0.',
  [col('Swept', `<div class="inner rev">${dvOpen}</div>`, 'bit')], 343, BUILT);
// ---- a step opened from the review ----
const fromRev = `${bar('Languages')}<div class="inner"><p class="meta">From the review</p><p class="do">The tongues your character speaks. Wits 15 gives you one more.</p>${helpGap}<h3 class="sec">You speak</h3>${irow('Marsh-common', 'The common tongue', 'picked').replace('<span class="btn">Picked ✓</span>', '<span class="giv">Given</span>')}${foot('Nothing changed', false, 'plain', 'Back to review')}</div>`;
const g4 = frame('G4. A step opened from the review’s Change, swept: “From the review” in the count’s place; the step as it is anywhere; the foot’s one button reads “Back to review” (ruled word). <b>A fix, counted ways out:</b> the approved mockup had “Back to review” on both foot buttons while nothing had changed; two buttons with one meaning become one. The bar’s arrow does the same thing; that pair (arrow and foot) is the same as on every step.',
  [col('Swept', fromRev, 'bit')], 343);
// ---- sent, sent back, no approval ----
const sent = `<div class="inner rev" style="min-height:420px"><h3 class="sec" style="margin-top:0">Your characters</h3><div class="card"><div class="head"><h3>Oswin Adderbald</h3></div><div class="line"><span>Level 2, waiting for your GM’s approval.</span></div><div class="efoot" style="margin-top:var(--space-1)"><span class="btn small">Delete…</span></div></div><div class="toast"><span>Sent Oswin Adderbald to your GM.</span></div></div>`;
const sentBack = `${bar('Oswin Adderbald')}<div class="inner rev"><p class="meta">Step 12 of 12, Review</p><div class="card marked"><div>${warn('Your GM asks for a change')}</div><div class="line"><span>“Croak is not for a Stone kin in this campaign. Pick another tongue.”<small>Maren, your GM, today</small></span></div></div>${two()}${card('Languages', ['Marsh-common, Stone-speech, Croak'], true, 'marked')}${card('Weapon skills', ['Spear, sling'])}${foot('1 part marked', true, 'accent', 'Send to the GM')}</div>`;
const noAppr = `${bar('Oswin Adderbald')}<div class="inner rev"><p class="meta">Step 12 of 12, Review</p>${two()}${card('Scores', ['Might 13, Nimbleness 9, Grit 13, Wits 15, Lore 12, Charm 10'])}${revFoot('', { send: 'Add to the party' })}</div>`;
const g5 = frame('G5. After sending, sent back, and a campaign with no approval, swept. <b>Left: after sending, as built</b> (the Builder’s reading of the build, 2026-11-12): the player never sees the review’s cards again. A toast says “Sent Oswin Adderbald to your GM.” (“… has joined the party.” where no approval is needed; “… to your GM again.” on a resend), and the character’s card reads “Level 2, waiting for your GM’s approval.”; a tap on it does nothing while it waits; its one control is “Delete…”, for a character never approved (an inline confirm, not drawn). There is no taking it back: that would be new behaviour, outside this sweep. The page it sits on is drawn plainly; I have not seen the built one. <b>Middle: sent back:</b> the GM’s words in a card at the top with the warning sign, the part to fix edged in the warning tone and still carrying its Change (a shape, an edge and words; not colour alone); the foot’s “1 part marked”, Back and “Send to the GM”; no “Start over” here, as built. <b>Right: no approval needed:</b> the button reads “Add to the party”. The middle and right columns are not from built pictures.',
  [col('Swept: after sending, as built', sent, 'bit'), col('Swept: sent back', sentBack, 'bit'), col('Swept: no approval needed', noAppr, 'bit')], 1100);
// ---- the GM's card ----
const gmOld = `${bar('Oswin Adderbald')}<div class="inner rev"><p class="meta">Sent by Imre, 4 minutes ago</p><div class="card"><div class="kv"><div class="text">${warn('Needs your special approval')}<small>Croak: a language usually learnt only by the toad folk. The pack’s rule, River Rules p. 58</small></div></div><div class="kv" style="gap:var(--space-2);margin-top:var(--space-2)"><span class="btn small" style="flex:1">Allow it</span><span class="btn small" style="flex:1">Take it off</span></div></div>${card('Kindred and class', ['Stone kin Reed Witch, level 2'], false)}${card('Scores', ['Might 13, Nimbleness 9, Grit 13, Wits 15, Lore 12, Charm 10<small>1 trade made: Might 15 → 13, Wits 14 → 15</small>'], false)}<div class="foot"><span class="say">1 thing to settle</span><span class="btn">Send back</span><span class="btn accent">Approve</span></div></div>`;
const gmNew = `${bar('Oswin Adderbald')}<div class="inner rev"><p class="meta">Sent by Imre, 4 minutes ago</p><div class="card"><div>${warn('Needs your special approval')}</div><div class="line"><span>Croak<small>A language usually learnt only by the toad folk. River Rules, p. 58</small></span></div><div class="efoot" style="margin-top:var(--space-2)"><span class="btn small">Take it off</span><span class="btn small">Allow it</span></div></div>${card('Kindred and class', ['Stone kin Reed Witch, level 2'], false)}${card('Scores', ['Might 13, Nimbleness 9, Grit 13, Wits 15, Lore 12, Charm 10<small>1 trade made: Might 15 to 13, Wits 14 to 15</small>'], false)}${card('Who they are', ['Oswin Adderbald', '11 hit points<small>9 rolled on ' + die(8, 16) + '2d8, +2 for Grit 13</small>', 'Alignment: Reed'], false)}${card('Gear', ['Dredger’s kit, a trinket, 2 things bought', '120 silver rolled, 14 spent: 106 left'], false)}<div class="line" role="button"><span><b>The whole sheet</b></span>${I.chev.replace('class="chev"', 'class="chev" style="transform:rotate(-90deg)"')}</div><div class="foot"><span class="say">1 thing to settle</span><span class="btn">Send back</span><span class="btn">Approve</span></div></div>`;
const g6 = frame('G6. The GM’s approval card. <b>Left: the approved mockup. Right: swept:</b> who sent it and when; what needs the GM’s special approval first, with the pack’s reason and its page, and its two answers at the right, both plain (neither is the screen’s main action); then the character in short cards with no Change: the level in the class’s line, hit points with the roll behind them (the two dice of a level-2 start), coin as rolled, spent, left; the whole sheet one tap away; the foot: what is left to settle, “Send back” and “Approve”. Approve and Send back are both plain, as the written spec has them (settled 2026-11-12; the older mockup’s accent is superseded). Send back asks for a note (not drawn). <b>Ways out:</b> the bar’s arrow leaves the card; the foot’s two buttons are two different answers.',
  [col('The approved mockup', gmOld), col('Swept', gmNew, 'bit')], 720);
// ---- Decide later; To finish ----
const later = `${bar('Weapon skills')}<div class="inner"><p class="meta">Step 9 of 12</p><p class="do">The weapons your character has trained with.</p>${helpGap}<h3 class="sec">Pick 2</h3>${irow('Spear', 'Close or thrown. Also the long spear')}${irow('Sling', 'Range. Stones are free')}${footL('0 of 2 picked', 'plain')}</div>`;
const finish = `<div class="inner rev"><div class="card"><h3>To finish</h3><p class="meta" style="margin:var(--space-1) 0 var(--space-2)">You can play now.</p><div class="tf" role="button"><span>Weapon skills<small style="display:block;font-size:14px;color:var(--muted)">2 to pick</small></span>${I.chev.replace('class="chev"', 'class="chev" style="transform:rotate(-90deg)"')}</div><div class="tf" role="button"><span>Details</span>${I.chev.replace('class="chev"', 'class="chev" style="transform:rotate(-90deg)"')}</div></div></div>`;
const g7 = frame('G7. “Decide later”, and the “To finish” card. <b>Left:</b> a step that allows it has a quiet “Decide later” first in its foot, as built (optional steps only: first spells, Gear, Languages, Weapon skills, optional trait lists); it moves on and leaves the step open. <b>Right:</b> on the character’s sheet, the “To finish” card lists each open step as a tap line; gone when all are done. The spec’s words are “You can play now. Finish these any time.”; I kept the first sentence, a fact a player needs, and cut the second, which the card’s title says. <b>For Francis:</b> those are ruled words. <b>Not from a built picture:</b> both are drawn from the spec’s description.',
  [col('Swept: Decide later', later, 'bit'), col('Swept: the To finish card', finish, 'bit')], 720);
// ---- iPad ----
const g8 = `<div><p class="cap" style="max-width:1024px">G8. The review at the iPad’s width, swept: the same cards as the phone (frame G1), in the build’s order, in two columns: down the left, then the right; the foot on one row, with no Back.</p><div class="tablet wide bit">${bar('Oswin Adderbald')}<div class="cols rev"><div><p class="meta">Step 12 of 12, Review</p>${bodyA(true)}${gear(true)}</div><div>${magicCard}${langCard()}${card('Weapon skills', ['Spear, sling'])}${detCard}</div></div>${revFoot('Goes to the GM for approval', { wide: true })}</div><p class="from">Its cards checked against the built phone picture; no built tablet picture of the review has been sent, and the two columns are mine.</p></div>`;

mount(`
  <h1>Creation, the style sweep: batch G</h1>
  <p class="note">The review, what follows it (sent, sent back, no approval needed), a step opened from the review, the GM’s approval card, “Decide later” and the “To finish” card, in the type pair and today’s standards, with the rulings of batches A to F applied. The review (G1, G8) is redrawn from the Builder’s picture of the built screen (2026-11-12); its messy form, the failed send and the derived values are from the built gallery’s pictures of their parts; the rest from the approved mockup or the spec, and each says which. Names, words and numbers are invented. A proposal from the Design Studio, not ruled.</p>
  <p class="note"><b>The example character</b> (one through every batch): a Stone kin Reed Witch starting at level 2, with no patron; the review is her step 12 of 12, and every card on it is what the earlier batches’ frames chose for her (Wits her prime after one trade, three spells and a knack, Causeway cant, spear and sling, the Dredger’s kit).</p>
  <h1>The review</h1>
  <div class="wall">${g1}</div>
  <div class="wall">${g1b}</div>
  <p class="note"><b>On frame G1.</b> <b>The foot holds what the build’s holds</b> (ruled 2026-11-12): the line (“Goes to the GM for approval”), “Send to the GM”, “Save and leave” and “Start over”, and <b>no Back</b>: the bar’s arrow goes back. They are right-justified with the accent outermost and the other two as the quiet pair (the build has “Send to the GM” full width over the two side by side); on a phone the quiet pair sits on the upper row, at the right. “Start over” opens creation’s one confirm (batch H, frame H6). <b>Ways out, counted:</b> the bar’s arrow (one step back); “Save and leave” (leaves creation, keeps the draft); no X. <b>Not in the built picture, placed by me:</b> the Magic card (the built character casts nothing). The built review also has a card for a kindred’s trait list; the example witch’s kindred has none, so that card is drawn on frame G2. <b>For Francis:</b> the built folded card reads “8 figures: tap one to see why”; I cut the instruction and kept the count. The Builder’s own to fix, not drawn: Scores written twice; the empty band above the buttons.</p>
  <div class="wall">${g8}</div>
  <div class="wall">${g2}${g3}</div>
  <div class="wall">${g4}</div>
  <h1>Sent, sent back, no approval needed</h1>
  <div class="wall">${g5}</div>
  <h1>The GM’s approval card</h1>
  <div class="wall">${g6}</div>
  <h1>Decide later; To finish</h1>
  <div class="wall">${g7}</div>
  <h1>Questions (drafts for the lead’s list)</h1>
  <p class="note"><b>1. After sending: drawn as built</b> (a toast and a waiting card; no taking it back).</p>
  <p class="note"><b>2. Approve and Send back are both plain: settled, the written spec wins.</b></p>
