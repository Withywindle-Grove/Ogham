<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Places from packs — the place card, the picker, + Piece (M8b slice 0, approved 2026-11-06)</title>
<style>
  /* Tokens from docs/06 only. Light and dark side by side (the dark column is the same markup, cloned). Buttons are plain blocks. Invented names only. */
  :root { --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; }
  body { margin:0; font-family:"Atkinson Hyperlegible", Arial, sans-serif; font-size:16px; line-height:1.5; background:#888; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-5); padding:var(--space-5); align-items:start; }
  .theme { padding:var(--space-4); border-radius:4px; background:var(--page); color:var(--ink); }
  .light { --page:#FAFAF7; --surface:#F2F1EC; --sheet:#FFFFFF; --ink:#191714; --muted:#5E574C; --rule:#D6D3CC; --control:#8A8378; --accent:#6E2A1F; --on-accent:#FFFFFF; --info:#2F5D7C; --flash:#EDEAE3; }
  .dark  { --page:#12100D; --surface:#1C1915; --sheet:#1E1A16; --ink:#F1EADC; --muted:#B5AA96; --rule:#3A342B; --control:#756B5A; --accent:#C9875A; --on-accent:#12100D; --info:#8DB4D0; --flash:#4A3A22; }
  h1 { font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:24px; line-height:1.2; margin:var(--space-5) 0 var(--space-3); }
  h1:first-child { margin-top:0; }
  h2 { font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:20px; line-height:1.2; margin:var(--space-4) 0 var(--space-2); font-variant:small-caps; }
  .card { background:var(--sheet); border:1px solid var(--rule); border-radius:4px; padding:var(--space-3); margin-bottom:var(--space-4); }
  .sheet { background:var(--sheet); border:1.5px solid var(--control); border-radius:4px; padding:var(--space-3); margin-bottom:var(--space-4); }
  .phone { width:343px; }                        /* 375 px less the page's 16 px margins */
  .head { display:flex; justify-content:space-between; align-items:center; gap:var(--space-2); }
  .label { font-family:"EB Garamond", Georgia, serif; font-size:20px; font-weight:600; line-height:1.2; }
  .meta { font-size:14px; color:var(--muted); }
  .row { display:flex; align-items:center; gap:var(--space-2); padding:var(--space-2) 0; border-bottom:1px dotted var(--rule); min-height:44px; }
  .row:last-child { border-bottom:0; }
  .row .text { flex:1; min-width:0; overflow-wrap:anywhere; }
  .row .text small { display:block; font-size:14px; color:var(--muted); }
  .indent { padding-left:var(--space-5); }
  .indent2 { padding-left:calc(var(--space-5) * 2); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:44px; min-width:44px; padding:10px 12px; border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); color:var(--ink); font-family:"EB Garamond", Georgia, serif; font-weight:600; font-size:16px; line-height:1.2; box-sizing:border-box; }
  .btn.accent { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .btn.sq { width:44px; padding:10px; }
  .btn.wide { width:100%; justify-content:flex-start; text-align:left; }
  .picked { background:var(--surface); border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .field { display:block; width:100%; min-height:44px; padding:10px 12px; border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); color:var(--muted); box-sizing:border-box; }
  .field.typed { color:var(--ink); }
  .group { border:1px solid var(--rule); border-radius:4px; margin-bottom:var(--space-2); }
  .group > .row { padding:var(--space-2) var(--space-3); border-bottom:0; }
  .group .body { border-top:1px solid var(--rule); padding:0 var(--space-3); }
  .toast { margin:var(--space-3) 0; padding:var(--space-3); border:1.5px solid var(--control); border-radius:4px; background:var(--sheet); display:flex; justify-content:space-between; gap:var(--space-2); align-items:center; }
  .undo { color:var(--accent); text-decoration:underline; min-height:44px; display:inline-flex; align-items:center; padding:0 var(--space-2); }
  .info { background:var(--surface); border-left:4px solid var(--info); padding:var(--space-3); border-radius:4px; margin:var(--space-2) 0; }
  .note { font-size:14px; color:var(--muted); margin:var(--space-2) 0 var(--space-4); }
  svg { flex:none; }
  .gap { display:flex; gap:var(--space-2); flex-wrap:wrap; }
</style>
</head>
<body>
<template id="screens">
  <!-- icons: pin (a place), within (go up: the place this one is part of), inside (go down: the places inside), plus / minus (unfold / fold), eye-off, close -->

  <h1>1 · GM's place card, a place picked from a pack (iPad landscape)</h1>
  <div class="card">
    <div class="head">
      <div><div class="label">Heron Isle (Hex)</div>
        <div class="meta">Fen Marches · hex 0412 · marsh · 0 of 5 pieces shown</div></div>
      <span class="btn"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.800 7 11 7 11z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.500" fill="currentColor"/></svg>Change place</span>
    </div>
    <div class="row">
      <div class="text">Players see: <strong>Heron Isle</strong><small>The name goes out with the first piece you show. Change it first if it gives something away.</small></div>
      <span class="btn">Rename for players</span>
    </div>
    <div class="row">
      <span class="btn wide"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8" y="8" width="8" height="8" rx="1" fill="currentColor"/></svg>Part of The Long Fen (Region)</span>
    </div>
    <div class="group">
      <div class="row">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.500" cy="9" r="1.600" fill="currentColor"/><circle cx="15.500" cy="9" r="1.600" fill="currentColor"/><circle cx="12" cy="15.500" r="1.600" fill="currentColor"/></svg>
        <div class="text">Here · 3 places</div>
        <span class="btn sq" role="button" aria-label="Fold the places here"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2"/></svg></span>
      </div>
      <div class="body">
        <div class="row"><span class="btn wide">Heron Isle (Site)</span></div>
        <div class="row"><span class="btn wide">The Sunken Chapel (Site)</span></div>
        <div class="row"><span class="btn wide">Along the Reed Road (Site)</span></div>
      </div>
    </div>
    <h2>Pieces</h2>
    <div class="row"><div class="text">Black water on every side; a single dry rise crowned with alders.<small>Description · from Fen Marches</small></div>
      <span class="btn sq" role="button" aria-label="Show players"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 20 20 4" stroke="currentColor" stroke-width="1.8"/></svg></span></div>
    <div class="row"><div class="text">A causeway of split logs, east<small>Exit · from Fen Marches</small></div>
      <span class="btn sq" role="button" aria-label="Show players"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 20 20 4" stroke="currentColor" stroke-width="1.8"/></svg></span></div>
    <div class="row"><span class="btn">+ Piece</span><span class="meta">3 more from Fen Marches, or type one</span></div>
  </div>
  <div class="toast"><span>The party is at The Sunken Chapel (Site).</span><span class="undo" role="button">Undo</span></div>
  <p class="note">A tap on "Part of …" or on a place under "Here" moves the party there at once, with this toast; no travel points inside a hex. No "›" anywhere: going up and going in each carry an icon and words. A place that wasn't picked from a pack (typed under Other…) shows neither line. "Rename for players" opens a one-line field. Every piece from the pack arrives hidden. The Safe or hostile row is gone (safety is asked at End expedition).</p>

  <h1>2 · The place picker (iPad: a pop-up over Scene)</h1>
  <div class="sheet">
    <div class="head"><div class="label">Where are we?</div>
      <span class="btn sq" role="button" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg></span></div>
    <span class="field">Search places by name or map number</span>
    <h2>Near here</h2>
    <div class="row"><span class="btn wide">Heron Isle (Site)</span></div>
    <div class="row"><span class="btn wide">The Sunken Chapel (Site)</span></div>
    <h2>Recently visited</h2>
    <div class="row"><span class="btn wide">Saltreach (Site)</span></div>
    <div class="row"><span class="btn wide">The Reed Camp<span class="meta">&nbsp;· typed</span></span></div>
    <h2>From your packs</h2>
    <div class="group">
      <div class="row"><div class="text">Fen Marches<small>Region pack · 855 places</small></div>
        <span class="btn sq" role="button" aria-label="Fold Fen Marches"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2"/></svg></span></div>
      <div class="body">
        <div class="row"><span class="btn wide" style="flex:1">The Long Fen (Region)</span>
          <span class="btn sq" role="button" aria-label="Fold the places in The Long Fen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2"/></svg></span></div>
        <div class="row indent"><span class="btn wide picked" style="flex:1">Heron Isle (Hex) · 0412&nbsp; ✓ here now</span>
          <span class="btn sq" role="button" aria-label="Fold the places in Heron Isle"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2"/></svg></span></div>
        <div class="row indent2"><span class="btn wide">Heron Isle (Site)</span></div>
        <div class="row indent2"><span class="btn wide">The Sunken Chapel (Site)</span></div>
        <div class="row indent2"><span class="btn wide">Along the Reed Road (Site)</span></div>
        <div class="row indent"><span class="btn wide" style="flex:1">Saltreach and the Eel Weirs (Hex) · 0413</span>
          <span class="btn sq" role="button" aria-label="Show the places in Saltreach and the Eel Weirs"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2"/></svg></span></div>
        <div class="row indent"><span class="meta">197 more hexes, by map number</span></div>
      </div>
    </div>
    <div class="group">
      <div class="row"><div class="text">The Drowned Abbey<small>Adventure · 13 places</small></div>
        <span class="btn sq" role="button" aria-label="Show The Drowned Abbey"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2"/></svg></span></div>
    </div>
    <div class="row"><span class="btn wide">Other… a place that isn't listed</span></div>
  </div>
  <p class="note">One group per pack, folded to start; inside, the pack's own tree. A tap on a place's name picks it: the pop-up closes, the party is there, and the toast offers Undo (no accent button: every row is the action). The square button at a row's right only unfolds or folds what's inside (plus and minus, never an arrow). "Near here" lists the current place's own places and its neighbours in the tree; it is absent before the first place. Hexes sort by map number and show it, because that is what the map prints.</p>

  <h1>3 · Searching, two places with one name</h1>
  <div class="sheet">
    <div class="head"><div class="label">Where are we?</div>
      <span class="btn sq" role="button" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg></span></div>
    <span class="field typed">fish</span>
    <div class="meta" style="margin:var(--space-2) 0">3 places</div>
    <div class="row"><span class="btn wide">Fish Market (Building), in Saltreach<span class="meta">&nbsp;· Fen Marches</span></span></div>
    <div class="row"><span class="btn wide">Fish Market (Building), in Marlow's Ford<span class="meta">&nbsp;· Fen Marches</span></span></div>
    <div class="row"><span class="btn wide">The Fishers' Stair (Room)<span class="meta">&nbsp;· The Drowned Abbey</span></span></div>
    <div class="row"><span class="btn wide">Other… use "fish" as a new place</span></div>
  </div>
  <p class="note">Name plus type; when both match, the parent follows ("…, in Saltreach"); the source pack last, quieter. Search also finds a map number ("0412").</p>

  <h1>4 · On a phone (375 px): the picker is a full-screen sheet</h1>
  <div class="sheet phone">
    <div class="head"><div class="label">Where are we?</div>
      <span class="btn sq" role="button" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg></span></div>
    <span class="field">Search places</span>
    <h2>Recently visited</h2>
    <div class="row"><span class="btn wide">Saltreach and the Eel Weirs (Hex) · 0413</span></div>
    <div class="row"><span class="btn wide">The Chapel of Saint Wenna-under-the-Water (Site)</span></div>
    <h2>From your packs</h2>
    <div class="group"><div class="row"><div class="text">Fen Marches<small>Region pack · 855 places</small></div>
      <span class="btn sq" role="button" aria-label="Show Fen Marches"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2"/></svg></span></div></div>
    <div class="row"><span class="btn wide">Other… a place that isn't listed</span></div>
  </div>

  <h1>5 · Other…, and the picker's other states</h1>
  <div class="sheet phone">
    <div class="head"><div class="label">A place that isn't listed</div>
      <span class="btn sq" role="button" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg></span></div>
    <span class="field typed">The Reed Camp</span>
    <div class="gap" style="margin-top:var(--space-3)"><span class="btn accent">Set place</span><span class="btn">Back to the list</span></div>
  </div>
  <div class="sheet phone">
    <div class="label">No packs with places</div>
    <p class="meta">None of this campaign's packs lists places. Type one, or attach an adventure or a region in the Rules library.</p>
    <div class="row"><span class="btn wide">Other… a place that isn't listed</span></div>
  </div>
  <div class="sheet phone">
    <span class="field typed">xyzzy</span>
    <p class="meta">No place called "xyzzy" in your packs.</p>
    <div class="row"><span class="btn wide">Other… use "xyzzy" as a new place</span></div>
  </div>
  <div class="sheet phone">
    <div class="info">Loading Fen Marches' places…</div>
    <div class="info">You're offline. Recently visited places and Other… still work; a pack's list needs a connection the first time.</div>
  </div>

  <h1>6 · + Piece, as a pop-up</h1>
  <div class="sheet">
    <div class="head"><div class="label">Add a piece</div>
      <span class="btn sq" role="button" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2"/></svg></span></div>
    <h2>From Fen Marches · 3 not on the card yet</h2>
    <div class="row"><div class="text">A heron watches from the alders, unafraid<small>Someone here · the stat line stays yours</small></div><span class="btn">Add</span></div>
    <div class="row"><div class="text">The rise is ringed with drowned fence-posts<small>Hazard · look only; what it does stays yours</small></div><span class="btn">Add</span></div>
    <div class="row"><div class="text">A ring of river pearls in the heron's nest<small>Treasure · the value stays yours</small></div><span class="btn">Add</span></div>
    <div class="row"><span class="btn">Add all 3</span><span class="meta">Added pieces stay hidden until you tap their eye.</span></div>
    <h2>Or type one</h2>
    <div class="gap"><span class="btn picked">Description</span><span class="btn">Exit</span><span class="btn">Someone here</span><span class="btn">Clue</span><span class="btn">Treasure</span><span class="btn">Hazard</span><span class="btn">Other</span></div>
    <span class="field" style="margin-top:var(--space-2)">One line the players will see</span>
    <div class="gap" style="margin-top:var(--space-3)"><span class="btn accent">Add piece</span></div>
  </div>
  <p class="note">The pop-up stays open while you add, so several go in a row; ✕ closes it. For a typed place the first section is absent. "From Fen Marches · everything is on the card" replaces the list when nothing is left. A pack's GM notes go to the card's Notes, never into a piece.</p>
</template>

<div class="pair">
  <div class="theme light" id="light"></div>
  <div class="theme dark" id="dark"></div>
</div>
<script>
  // The dark column is the same markup as the light one: one source, two themes.
  const t = document.getElementById('screens');
  document.getElementById('light').appendChild(t.content.cloneNode(true));
  document.getElementById('dark').appendChild(t.content.cloneNode(true));
</script>
</body>
</html>
