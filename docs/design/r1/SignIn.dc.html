<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=EB+Garamond:wght@500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:{{c.bg}};color:{{c.ink}};font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:16px;display:flex;flex-direction:column;overflow:hidden">

<sc-if value="{{sSign}}" hint-placeholder-val="{{ true }}">
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:0 28px">
<div style="text-align:center;font-family:'EB Garamond',Georgia,serif;font-size:46px;font-weight:600;line-height:1">Grimoire</div>
<label for="em" style="font-size:14px;color:{{c.mut}};margin-top:18px">Email</label>
<input id="em" type="email" value="sam@example.com" style="min-height:52px;padding:0 12px;border:1px solid {{c.rule}};border-radius:4px;background:transparent;color:inherit;font-family:inherit;font-size:17px">
<button onClick="{{send}}" style="min-height:54px;border-radius:4px;border:none;background:{{c.acc}};color:{{c.onAcc}};font-family:'EB Garamond',Georgia,serif;font-size:20px;font-weight:600;cursor:pointer">Email me a code</button>
<div style="text-align:center;font-size:14px;color:{{c.mut}}">No password to remember.</div>
</div>
</sc-if>

<sc-if value="{{sSent}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:0 28px;text-align:center">
<div style="font-family:'EB Garamond',Georgia,serif;font-size:34px;font-weight:600">Check your email</div>
<div style="font-size:16px;color:{{c.mut}};line-height:1.45">Enter the 6-digit code we sent to sam@example.com.</div>
<label for="code" style="position:absolute;width:1px;height:1px;overflow:hidden">Sign-in code</label>
<input id="code" inputmode="numeric" autocomplete="one-time-code" value="482 913" style="width:220px;min-height:60px;text-align:center;letter-spacing:.2em;border:1px solid {{c.line}};border-radius:4px;background:transparent;color:inherit;font-family:'EB Garamond',Georgia,serif;font-size:32px;font-weight:600">
<button onClick="{{open}}" style="width:220px;min-height:54px;border-radius:4px;border:none;background:{{c.acc}};color:{{c.onAcc}};font-family:'EB Garamond',Georgia,serif;font-size:20px;font-weight:600;cursor:pointer">Sign in</button>
<button style="min-height:44px;background:none;border:none;color:{{c.mut}};font-family:inherit;font-size:15px;cursor:pointer">Send a new code</button>
<button onClick="{{back}}" style="min-height:44px;background:none;border:none;color:{{c.acc}};font-family:inherit;font-size:15px;font-weight:700;cursor:pointer">Use a different email</button>
</div>
</sc-if>

<sc-if value="{{sPick}}" hint-placeholder-val="{{ false }}">
<div style="padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:center">
<span style="font-family:'EB Garamond',Georgia,serif;font-size:32px;font-weight:600">Your campaigns</span>
<button aria-label="Account and device options" style="width:44px;height:44px;border:none;border-radius:22px;background:transparent;color:{{c.mut}};font-size:22px;font-weight:700">⋯</button>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:0 18px 12px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:{{c.tint}}">
<span style="flex:1;font-size:15px"><b>You’re invited:</b> Ironwood Road · GM Priya</span>
<a href="CharCreate.dc.html" style="min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:4px;background:{{c.acc}};color:{{c.onAcc}};text-decoration:none;font-family:'EB Garamond',Georgia,serif;font-size:16px;font-weight:600">Join</a>
</div>
<sc-for list="{{camps}}" as="k" hint-placeholder-count="2">
<a href="{{k.href}}" style="min-height:92px;display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid {{c.rule}};border-radius:8px;color:inherit;text-decoration:none">
<span aria-hidden="true" style="width:56px;height:56px;flex:none;border-radius:50%;border:1px solid {{c.line}};display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',Georgia,serif;font-size:24px;font-weight:600;color:{{c.acc}}">{{k.initial}}</span>
<span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-family:'EB Garamond',Georgia,serif;font-size:22px;font-weight:600;line-height:1.1">{{k.name}}</span><span style="font-size:14px;color:{{c.mut}}">{{k.role}}</span><span style="font-size:13px;color:{{k.nextColor}}">{{k.next}}</span></span>
<span aria-hidden="true" style="color:{{c.mut}};font-size:20px">›</span>
</a>
</sc-for>
<button style="min-height:52px;border-radius:4px;border:1px dashed {{c.rule}};background:transparent;color:{{c.mut}};font-family:'EB Garamond',Georgia,serif;font-size:18px;font-weight:600">+ Start a new campaign (as GM)</button>
<div style="font-size:13px;color:{{c.mut}};line-height:1.4">You can be the GM in one campaign and a player in another. Each is kept separate.</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'sign' };
  }
  renderVals() {
    const s = this.state;
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#12100D', ink: '#F1EADC', mut: '#B5AA96', rule: '#3A342B', line: '#E4DCCB', acc: '#D4836B', warn: '#E6BA66', tint: '#4A3A22', onAcc: '#12100D' }
      : { bg: '#FBF8F1', ink: '#191714', mut: '#5E574C', rule: '#CFC4B0', line: '#191714', acc: '#6E2A1F', warn: '#7A4A00', tint: '#F3E6CB', onAcc: '#FBF8F1' };
    return {
      c: c, sSign: s.step === 'sign', sSent: s.step === 'sent', sPick: s.step === 'pick',
      send: () => this.setState({ step: 'sent' }), open: () => this.setState({ step: 'pick' }), back: () => this.setState({ step: 'sign' }),
      camps: [
        { name: 'The Drowned Marches', initial: 'D', role: 'Player · Wren · the Sluice Gate Company', next: 'Downtime · 1 offer waiting for you', nextColor: c.acc, href: 'PlayerDowntime.dc.html' },
        { name: 'Barrowmoor (test table)', initial: 'B', role: 'GM · 3 players', next: 'Last played Oct 4', nextColor: c.mut, href: 'Campaign.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
