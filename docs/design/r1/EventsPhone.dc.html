<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Events on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=EB+Garamond:wght@500;600&family=Caveat:wght@500;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:{{c.bg}};color:{{c.ink}};font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:16px;display:flex;flex-direction:column;overflow:hidden">

<div style="padding:10px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:3px double {{c.rule}}">
<button aria-label="Open the company page" style="width:44px;height:44px;flex:none;border-radius:50%;border:1px solid {{c.line}};background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 48 48" fill="none" stroke="{{c.acc}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h12M20 10v-3h8v3"></path><path d="M16 14h16l-2 16H18z"></path><path d="M6 38c4-3 8-3 12 0s8 3 12 0 8-3 12 0"></path></svg></button>
<span style="flex:1;display:flex;flex-direction:column"><span style="font-family:'EB Garamond',Georgia,serif;font-size:22px;font-weight:600;line-height:1.1">{{clock}}</span></span>
<span style="{{modeChip}}">{{modeText}}</span>
</div>
<button onClick="{{flip}}" style="margin:6px 16px 0;min-height:36px;border-radius:4px;border:1px dashed {{c.rule}};background:transparent;color:{{c.mut}};font-family:inherit;font-size:13px;cursor:pointer">Demo: GM switches to {{otherMode}}</button>

<div style="flex:1;min-height:0;overflow-y:auto;padding:6px 16px 8px;display:flex;flex-direction:column;gap:4px">

<sc-if value="{{isFight}}" hint-placeholder-val="{{ false }}">
<div style="{{S.label}}">Acting now</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:6px">
<div style="border:2px solid {{c.acc}};background:{{c.tint}};border-radius:8px;min-height:64px;display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',Georgia,serif;font-size:26px;font-weight:600">Party</div>
<div style="border:1px solid {{c.rule}};border-radius:8px;min-height:64px;display:flex;align-items:center;justify-content:center;font-family:'EB Garamond',Georgia,serif;font-size:26px;font-weight:600;color:{{c.mut}}">Foes</div>
</div>
</sc-if>

<div style="{{S.label}}">{{partyLabel}}</div>
<sc-for list="{{party}}" as="p" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px dotted {{c.rule}}">
<sc-if value="{{isExplore}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="color:{{c.mut}};font-size:16px;width:14px">⋮⋮</span></sc-if>
<button aria-label="{{p.aria}}" style="position:relative;width:46px;height:46px;flex:none;border-radius:50%;padding:0;background:{{c.surf}};color:inherit;font-family:'EB Garamond',Georgia,serif;font-size:20px;font-weight:600;cursor:pointer;{{p.ring}}">{{p.initial}}
<sc-if value="{{p.lit}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:-6px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:{{c.bg}};display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{c.glow}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-5 1-8z"></path></svg></span></sc-if>
<sc-if value="{{p.dark}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:-6px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:{{c.bg}};display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{c.sight}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></sc-if>
</button>
<span style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-family:'EB Garamond',Georgia,serif;font-size:20px;font-weight:600">{{p.name}}</span><span style="font-size:14px;color:{{c.warn}}">{{p.status}}</span></span>
<span style="font-family:'EB Garamond',Georgia,serif;font-size:22px;font-weight:600">{{p.hp}}</span>
</div>
</sc-for>

<sc-if value="{{isFight}}" hint-placeholder-val="{{ false }}">
<div style="{{S.label}};margin-top:8px">Foes</div>
<sc-for list="{{foes}}" as="f" hint-placeholder-count="3">
<div style="display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px dotted {{c.rule}};opacity:{{f.op}}">
<span style="display:flex;flex-direction:column"><span style="font-family:'EB Garamond',Georgia,serif;font-size:19px;font-weight:600">{{f.name}}</span><span style="font-size:14px;color:{{c.warn}}">{{f.status}}</span></span>
<span style="font-size:15px">Damage <b>{{f.taken}}</b></span>
</div>
</sc-for>
</sc-if>

<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:10px"><span style="{{S.label}}">Log</span><span style="font-size:15px;color:{{c.acc}};font-weight:700">Full log ›</span></div>
<sc-for list="{{log}}" as="e" hint-placeholder-count="3">
<sc-if value="{{e.arch}}" hint-placeholder-val="{{ false }}"><div style="padding:6px 0;border-bottom:1px dotted {{c.rule}}"><div style="font-size:12px;color:{{c.archInk}};font-weight:700">Archivist · Wren · pinned</div><div style="font-family:Caveat,cursive;font-size:23px;line-height:1.15;color:{{c.archInk}}">{{e.t}}</div></div></sc-if>
<sc-if value="{{e.plain}}" hint-placeholder-val="{{ true }}"><div style="padding:6px 0;border-bottom:1px dotted {{c.rule}}"><div style="font-size:15px;line-height:1.35">{{e.t}}</div><div style="font-size:12px;color:{{c.mut}}">{{e.when}}</div></div></sc-if>
</sc-for>
<button style="margin-top:6px;min-height:44px;border-radius:4px;border:1px solid {{c.line}};background:transparent;color:inherit;font-family:'EB Garamond',Georgia,serif;font-size:17px;font-weight:600">Add a note</button>
</div>

<nav aria-label="Main" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px double {{c.rule}}">
<button style="{{S.navOff}}">Player</button>
<button aria-current="page" style="{{S.navOn}}">Events</button>
<button style="{{S.navOff}}">Pack</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'explore' };
  }
  renderVals() {
    const s = this.state;
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#12100D', surf: '#1C1915', ink: '#F1EADC', mut: '#B5AA96', rule: '#3A342B', line: '#E4DCCB', acc: '#D4836B', warn: '#E6BA66', tint: '#4A3A22', glow: '#F2B45A', sight: '#9DB3C7', archInk: '#9EC3E6' }
      : { bg: '#FBF8F1', surf: '#F3EEE3', ink: '#191714', mut: '#5E574C', rule: '#CFC4B0', line: '#191714', acc: '#6E2A1F', warn: '#7A4A00', tint: '#F3E6CB', glow: '#B4561C', sight: '#3F5E78', archInk: '#1F4E79' };
    const G = "'EB Garamond',Georgia,serif";
    const isExplore = s.mode === 'explore';
    const litRing = 'border:2.5px solid ' + c.glow + ';box-shadow:0 0 12px ' + c.glow + '88';
    const darkRing = 'border:2.5px dashed ' + c.sight;
    const P = [
      { name: 'Ash', i: 'A', hp: '6/8', lit: true, status: isExplore ? 'Torch · 1 turn left' : '' },
      { name: 'Wren', i: 'W', hp: '9/14', lit: true, status: 'Blessed · 4' },
      { name: 'Tam', i: 'T', hp: '4/4', lit: true, status: '' },
      { name: 'Bram', i: 'B', hp: '11/11', dark: true, status: '' }
    ];
    const logExplore = [
      { t: 'The goblins kept saying “the bell under the water”. Ask the priest in Reedmouth.', arch: true },
      { t: 'Turn 14. Ash’s torch has 1 turn left.', when: 'just now' },
      { t: 'Tam refilled the lantern (1 flask left).', when: '2 min ago' }
    ];
    const logFight = [
      { t: 'Round 3. Party acts first.', when: 'just now' },
      { t: 'Mire goblin 2 is down.', when: 'round 2' },
      { t: 'Wren took 3 damage.', when: 'round 2' }
    ];
    return {
      c: c, isExplore: isExplore, isFight: !isExplore,
      clock: isExplore ? 'Day 2 · Turn 14' : 'Round 3',
      modeText: isExplore ? 'Exploring' : 'Encounter · fight', otherMode: isExplore ? 'Encounter' : 'Explore',
      modeChip: 'padding:6px 12px;border-radius:16px;font-weight:700;font-size:14px;background:' + (isExplore ? 'transparent' : c.acc) + ';color:' + (isExplore ? c.mut : c.bg) + ';border:1px solid ' + (isExplore ? c.rule : c.acc),
      flip: () => this.setState({ mode: isExplore ? 'fight' : 'explore' }),
      partyLabel: isExplore ? 'Marching order' : 'Party',
      party: P.map((p) => ({ name: p.name, initial: p.i, hp: p.hp, status: p.status, lit: !!p.lit, dark: !!p.dark, ring: p.lit ? litRing : (p.dark ? darkRing : 'border:1px solid ' + c.rule), aria: p.name + ', ' + p.hp + ' hit points' })),
      foes: [{ name: 'Mire goblin 1', taken: '2', status: '', op: 1 }, { name: 'Mire goblin 2', taken: '4 · down', status: '', op: 0.45 }, { name: 'Mire goblin 3', taken: '0', status: 'Fleeing', op: 1 }],
      log: (isExplore ? logExplore : logFight).map((e) => Object.assign({ plain: !e.arch, arch: !!e.arch }, e)),
      S: {
        label: 'font-family:' + G + ';font-size:18px;font-weight:600;font-variant:small-caps;letter-spacing:.07em;color:' + c.mut,
        navOn: 'height:62px;background:none;border:none;color:' + c.ink + ';font-family:' + G + ';font-size:20px;font-weight:600;font-variant:small-caps;letter-spacing:.06em;text-decoration:underline;text-underline-offset:6px',
        navOff: 'height:62px;background:none;border:none;color:' + c.mut + ';font-family:' + G + ';font-size:20px;font-variant:small-caps;letter-spacing:.06em'
      }
    };
  }
}
</script>
</body>
</html>
